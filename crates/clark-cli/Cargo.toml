[package]
name = "clark-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Human-facing Clark terminal client."

[[bin]]
name = "clark"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../agent-core", features = ["native"] }
base64 = "0.22"
chacha20poly1305 = "0.11"
clap = { version = "4.5", features = ["derive"] }
clark-http = { path = "../clark-http" }
conversation-cloud = { path = "../conversation-cloud" }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
exec-private-fs = { path = "../exec-core/private-fs" }
futures.workspace = true
getrandom = "0.4"
provider-local = { path = "../provider-local" }
provider-specialist = { path = "../provider-specialist" }
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7"
security-cloud-sync = { path = "../security-cloud-sync" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["net", "signal"] }
tempfile = "3"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
