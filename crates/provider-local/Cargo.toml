[package]
name = "provider-local"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local coding-agent provider for clark-desktop: an OpenAI-compatible tool-calling loop that runs file/shell tools on the local machine and delegates research to Clark's sandbox."

[dependencies]
agent-core = { path = "../agent-core", features = ["native"] }
clark-agent = { path = "../../../clark-agent" }
clark-agent-compaction = { git = "https://github.com/clark-labs-inc/clark-agent-compaction", rev = "860f3159944ca78b33da4eea517e1df34ee8b490" }
# The Executor trait + LocalExecutor live here (shared with clark-exec-server);
# exec-protocol is the wire contract RemoteExecutor speaks to it.
exec-core = { path = "../exec-core" }
exec-protocol = { path = "../exec-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
async-channel.workspace = true
uuid = { version = "1", features = ["v4"] }
# OpenAI-compatible streaming chat client (mirrors provider-clark's reqwest setup
# so `https://` works without a system OpenSSL/cert dependency).
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
tokio-util = { version = "0.7", default-features = false }
# RemoteExecutor's transport to clark-exec-server (plaintext ws over the SSH tunnel).
tokio-tungstenite = "0.29"
glob = "0.3"
regex = "1"
walkdir = "2"
# Unified diffs for `edit_file`/`write_file` results — the model sees what
# changed and the UI renders a red/green diff (Codex/Claude-Code style).
similar = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net"] }
tempfile = "3"
# Spin up a real clark-exec-server in-process to test RemoteExecutor parity.
exec-server = { path = "../exec-server" }
exec-protocol = { path = "../exec-protocol" }
