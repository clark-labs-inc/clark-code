[package]
name = "provider-local"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Product-extensible local coding-agent provider with sandboxed tools."

[dependencies]
agent-core = { path = "../agent-core", features = ["native"] }
agent-orchestration = { path = "../agent-orchestration" }
provider-acp = { path = "../provider-acp" }
agent-loop = { package = "clark-agent", version = "0.3.0" }
agent-loop-compaction = { package = "clark-agent-compaction", git = "https://github.com/clark-labs-inc/clark-agent-compaction", rev = "e5f4a4b7d122f73adc362c4a5395355ac95e540c" }
# The Executor trait + LocalExecutor live in a dependency-light crate shared by
# native composition roots and remote workers.
exec-core = { path = "../exec-core" }
exec-sandbox = { path = "../exec-sandbox" }
security-poc-runner = { path = "../security-poc-runner" }
scout-adapter-protocol = { path = "../scout-adapter-protocol" }
scout-adapter-runtime = { path = "../scout-adapter-runtime" }
scout-cartography-adapter = { path = "../scout-cartography-adapter" }
scout-capsule-host = { path = "../scout-capsule-host" }
scout-capability-census = { path = "../scout-capability-census" }
scout-ingest-protocol = { path = "../scout-ingest-protocol" }
scout-platform-client = { path = "../scout-platform-client" }
desktop-install-context = { path = "../install-context" }
computer-use = { path = "../computer-use" }
desktop-http = { path = "../desktop-http" }
libreoffice-pure = "0.5.4"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
toml = "1.1"
thiserror.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
async-channel.workspace = true
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
url = "2"
# OpenAI-compatible streaming chat client with a rustls transport.
reqwest = { version = "0.13", default-features = false, features = ["http2", "stream", "json", "rustls"] }
tokio-util = { version = "0.7", default-features = false }
# Browser CDP transport.
tokio-tungstenite = "0.30"
glob = "0.3"
getrandom = "0.4"
walkdir = "2"
grep-searcher = "0.1"
grep-regex = "0.1"
base64 = "0.23"
# Unified diffs for `edit_file`/`write_file` results — the model sees what
# changed and the UI renders a red/green diff.
similar = "3"
# HTML->Markdown conversion for the local `web_fetch` tool.
htmd = "0.5"
# Archive extraction for a host-configured opt-in managed browser download.
tar = "0.4"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Text extraction for pasted PDF/DOCX attachments (sibling to the vision
# fallback in `attachments.rs` — neither local coding model can read
# documents any more than it can read images).
pdf-extract = "0.12"
docx-rs = { version = "0.4", default-features = false }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
exec-sandbox-windows = { path = "../exec-sandbox-windows" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net"] }
scout-coordinator = { path = "../scout-coordinator" }
scout-accumulator = { path = "../scout-accumulator" }
scout-store = { path = "../scout-store" }
rusqlite = { version = "0.32", features = ["bundled"] }
