interface:
  display_name: "Security Diff"
  short_description: "Review an exact Git patch with sealed evidence"
  default_prompt: "Use $security:security-diff to review the current Git working tree for security regressions. The workflow runs on host-pinned DeepSeek V4 Flash Latest."
dependencies:
  tools:
    - type: tool
      value: security_scan_contract
    - type: tool
      value: security_poc_execute
    - type: tool
      value: read_file
    - type: tool
      value: grep
    - type: tool
      value: glob
    - type: tool
      value: bash
policy:
  allow_implicit_invocation: false
