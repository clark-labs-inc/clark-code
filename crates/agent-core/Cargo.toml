[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Provider-agnostic desktop agent engine: domain model, event projection, and Provider abstraction. Compiles to native and WASM."

[lib]
crate-type = ["rlib"]

[features]
default = []
# Native host capability marker. Transports own their runtime dependencies.
native = []
# Browser build: exposes the engine to JS via wasm-bindgen.
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:serde-wasm-bindgen"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
indexmap.workspace = true
futures.workspace = true
async-trait.workspace = true
rmp-serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]
serde_json.workspace = true
