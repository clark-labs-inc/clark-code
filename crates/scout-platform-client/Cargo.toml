[package]
name = "scout-platform-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Portable signed sensor client for Clark's authoritative system-cartography API."

[dependencies]
clark-http = { path = "../clark-http" }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
scout-ingest-protocol = { path = "../scout-ingest-protocol" }
scout-machine-identity = { path = "../scout-machine-identity" }
serde.workspace = true
serde_ignored = "0.1"
serde_json.workspace = true
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
