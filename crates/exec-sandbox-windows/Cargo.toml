[package]
name = "exec-sandbox-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows restricted-token runner and elevated setup boundary for Agent Desktop's local sandbox."

[lib]
name = "exec_sandbox_windows"
path = "src/lib.rs"

[[bin]]
name = "agent-command-runner"
path = "src/bin/command_runner.rs"

[[bin]]
name = "agent-windows-sandbox-setup"
path = "src/bin/setup.rs"

[dependencies]
base64 = "0.23"
exec-sandbox-protocol = { path = "../exec-sandbox-protocol" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
] }
