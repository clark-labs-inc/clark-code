[package]
name = "exec-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Executor abstraction (filesystem + process primitives) shared by clark-desktop's local provider and the remote exec-server. Deliberately tiny — no HTTP, no agent-core — so the remote binary stays lean."

[dependencies]
async-trait.workspace = true
libc = "0.2"
portable-pty = "0.9"
tokio = { workspace = true }
tokio-util = { version = "0.7", default-features = false }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
