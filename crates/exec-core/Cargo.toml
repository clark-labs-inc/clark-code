[package]
name = "exec-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The process-local Executor abstraction shared by Clark providers and durable workers."

[dependencies]
async-trait.workspace = true
exec-private-fs = { path = "private-fs" }
libc = "0.2"
portable-pty = "0.9"
tokio = { workspace = true }
tokio-util = { version = "0.7", default-features = false }
ignore = "0.4"
scout-capability-census = { path = "../scout-capability-census" }
scout-store = { path = "../scout-store" }
scout-adapter-runtime = { path = "../scout-adapter-runtime" }
scout-capsule-host = { path = "../scout-capsule-host" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
