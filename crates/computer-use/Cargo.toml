[package]
name = "computer-use"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded native desktop perception and input backends for Clark Code."

[features]
default = []
helper-service = [
    "dep:accessibility-sys",
    "dep:core-graphics",
    "dep:enigo",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:screencapturekit",
    "dep:xcap",
    "dep:x11rb",
]

[dependencies]
serde.workspace = true
serde_bytes = "0.11"
thiserror.workspace = true
png = "0.18"
rmp-serde.workspace = true
serde_json.workspace = true
fs2 = "0.4"
interprocess = "2.4.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = { version = "0.2", optional = true }
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = { version = "0.25", optional = true, features = ["highsierra"] }
libc = "0.2"
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "libc"], optional = true }
screencapturekit = { version = "8.0.1", features = ["macos_14_0"], optional = true }
security-framework = "3.7"
security-framework-sys = "2.17"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
enigo = { version = "0.6.1", optional = true }
xcap = { version = "0.9.7", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.13.2", features = ["xinput"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "clark-computer-use-helper"
path = "src/bin/clark-computer-use-helper.rs"
required-features = ["helper-service"]
