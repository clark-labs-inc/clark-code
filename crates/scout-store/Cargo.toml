[package]
name = "scout-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Target-side authenticated derived index for Clark Scout enterprise ledgers."

[dependencies]
agent-orchestration = { path = "../agent-orchestration" }
base64 = "0.22"
exec-private-fs = { path = "../exec-core/private-fs" }
fs2 = "0.4"
getrandom = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
scout-accumulator = { path = "../scout-accumulator" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
