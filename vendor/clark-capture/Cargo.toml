[package]
name = "clark-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/clark-labs-inc/clark-capture"
description = "Local-first, Sentry-style observability capture for any Rust project"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4"] }

[features]
default = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dev-dependencies]
tempfile = "3"
