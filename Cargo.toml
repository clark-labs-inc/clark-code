[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/provider-acp",
    "crates/provider-clark",
    "crates/provider-local",
    "crates/exec-core",
    "crates/exec-protocol",
    "crates/exec-server",
    "crates/devbridge",
    "src-tauri",
]

[workspace.package]
version = "0.1.30"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/clark/clark-desktop"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "process", "time", "fs"] }
async-channel = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
