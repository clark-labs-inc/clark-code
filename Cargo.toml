[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-orchestration",
    "crates/install-context",
    "crates/provider-acp",
    "crates/provider-clark",
    "crates/provider-local",
    "crates/exec-core",
    "crates/exec-sandbox",
    "crates/exec-sandbox-protocol",
    "crates/exec-sandbox-windows",
    "crates/exec-protocol",
    "crates/exec-server",
    "crates/devbridge",
    "src-tauri",
]

[workspace.package]
version = "0.1.73"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/clark/clark-desktop"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: tool-call schemas are autoregressive prompts — the model
# generates arguments in the property order it sees, so authored order
# (path -> old_string -> new_string, action -> scope -> title -> content)
# must survive serialization instead of being alphabetized.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "process", "time", "fs"] }
async-channel = "2"

[profile.dev]
# Full debuginfo dominates dev build + link time on macOS; line tables keep
# panic backtraces mapped to file:line at a fraction of the cost.
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
