name: Clark Code release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Clark Code semver declared by the product composition
        required: true
        type: string
      source_revision:
        description: Frozen 40-character product source commit to release
        required: true
        type: string
      release_platform:
        description: Platform channel to build and advance
        required: true
        default: all
        type: choice
        options:
          - macos
          - linux
          - all
      run_paid_benchmark:
        description: Run the separately authorized bounded Qwen 3.7 Flash benchmark
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write

concurrency:
  group: clark-code-release
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  PRODUCT_REPOSITORY: clark-labs-inc/clark
  PRODUCT_DIR: crates/clark-desktop-product
  # Keep each archived compiler cache below GitHub's repository-wide 10 GiB
  # budget. Small crates are cheaper to rebuild than to archive and transfer.
  KACHE_CACHE_EXECUTABLES: "0"
  KACHE_MAX_SIZE: 6GiB
  KACHE_MIN_STORE_COMPILE_MS: "1000"
  CLARK_RELEASE_TAG: ${{ format('v{0}', inputs.version) }}
  CLARK_RELEASE_SOURCE_REVISION: ${{ inputs.source_revision }}
  CLARK_AUTORESEARCH_RELEASE_REF: ${{ vars.CLARK_AUTORESEARCH_RELEASE_REF }}
  CLARK_DESKTOP_DOWNLOAD_BUCKET: ${{ vars.CLARK_DESKTOP_DOWNLOAD_BUCKET }}
  CLARK_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.CLARK_DESKTOP_DOWNLOAD_BASE_URL }}
  CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN: ${{ vars.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
  CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID: ${{ vars.CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID }}

jobs:
  preflight:
    name: Exact product source and release authority
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 35
    outputs:
      build_matrix: ${{ steps.release-platform.outputs.build_matrix }}
      release_platforms: ${{ steps.release-platform.outputs.release_platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          fetch-depth: 0

      - name: Resolve the explicit platform release boundary
        id: release-platform
        shell: bash
        env:
          REQUESTED_PLATFORM: ${{ inputs.release_platform }}
        run: |
          set -euo pipefail
          case "$REQUESTED_PLATFORM" in
            macos)
              platforms=macos
              matrix='{"include":[{"name":"macOS","os":"macos-15-xlarge","platform":"macos","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin"}]}'
              ;;
            linux)
              platforms=linux
              matrix='{"include":[{"name":"Linux","os":"ubuntu-24.04","platform":"linux","rust_targets":""}]}'
              ;;
            all)
              platforms=macos,linux
              matrix='{"include":[{"name":"macOS","os":"macos-15-xlarge","platform":"macos","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin"},{"name":"Linux","os":"ubuntu-24.04","platform":"linux","rust_targets":""}]}'
              ;;
            *)
              echo "::error::Unknown release platform: $REQUESTED_PLATFORM"
              exit 1
              ;;
          esac
          echo "release_platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "build_matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Require green CI for the exact release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_title="Clark Code product CI / $CLARK_RELEASE_SOURCE_REVISION"
          for attempt in {1..100}; do
            runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/clark-code-product-ci.yml/runs?event=workflow_dispatch&per_page=100")"
            state="$(jq -r --arg title "$expected_title" '
              [.workflow_runs[] | select(.display_title == $title)][0]
              | if . == null then "missing\t"
                else [.status, (.conclusion // "")] | @tsv
                end
            ' <<< "$runs")"
            IFS=$'\t' read -r status conclusion <<< "$state"
            if [[ "$status" == completed && "$conclusion" != success ]]; then
              echo "::error::Exact product CI failed ($conclusion)"
              exit 1
            fi
            if [[ "$status" == completed && "$conclusion" == success ]]; then
              echo "Exact candidate CI passed for $CLARK_RELEASE_SOURCE_REVISION"
              break
            fi
            if [[ "$attempt" == 100 ]]; then
              echo "::error::Timed out waiting for exact candidate CI"
              exit 1
            fi
            sleep 15
          done

      - name: Bind the exact public foundation revision
        shell: bash
        run: |
          set -euo pipefail
          foundation_revision="$(tr -d '[:space:]' < "$PRODUCT_DIR/foundation-revision.txt")"
          [[ "$foundation_revision" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none --no-checkout \
            https://github.com/clark-labs-inc/clark-code.git \
            "$GITHUB_WORKSPACE/../clark-desktop"
          git -C "$GITHUB_WORKSPACE/../clark-desktop" fetch --depth=1 origin "$foundation_revision"
          git -C "$GITHUB_WORKSPACE/../clark-desktop" checkout --detach "$foundation_revision"
          test "$(git -C "$GITHUB_WORKSPACE/../clark-desktop" rev-parse HEAD)" = "$foundation_revision"

      - name: Require exact mainline version and platform release policy
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$CLARK_RELEASE_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CLARK_RELEASE_SOURCE_REVISION"
          git fetch origin main
          git merge-base --is-ancestor "$CLARK_RELEASE_SOURCE_REVISION" origin/main
          [[ "$CLARK_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$PRODUCT_DIR/Cargo.toml" | head -1)" = "${CLARK_RELEASE_TAG#v}"
          test "$(jq -r .version "$PRODUCT_DIR/tauri.conf.json")" = "${CLARK_RELEASE_TAG#v}"
          test "$(jq -r .version prototypes/clark-slack-code-runner/package.json)" = "${CLARK_RELEASE_TAG#v}"
          test "$(jq -r .version prototypes/clark-slack-code-runner/package-lock.json)" = "${CLARK_RELEASE_TAG#v}"
          test "$(jq -r '.packages[""].version' prototypes/clark-slack-code-runner/package-lock.json)" = "${CLARK_RELEASE_TAG#v}"
          existing_tag="$(git ls-remote --tags origin \
            "refs/tags/$CLARK_RELEASE_TAG" \
            "refs/tags/$CLARK_RELEASE_TAG^{}" | awk 'END {print $1}')"
          if [[ -n "$existing_tag" && "$existing_tag" != "$CLARK_RELEASE_SOURCE_REVISION" ]]; then
            echo "Stable product tag points at $existing_tag, not $CLARK_RELEASE_SOURCE_REVISION" >&2
            exit 1
          fi
          required=(
            CLARK_AUTORESEARCH_RELEASE_REF
            CLARK_DESKTOP_DOWNLOAD_BUCKET
            CLARK_DESKTOP_DOWNLOAD_BASE_URL
            CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )
          if [[ "${{ inputs.release_platform }}" == macos || "${{ inputs.release_platform }}" == all ]]; then
            required+=(
              APPLE_CERTIFICATE
              APPLE_CERTIFICATE_PASSWORD
              APPLE_SIGNING_IDENTITY
              APPLE_ID
              APPLE_PASSWORD
              APPLE_TEAM_ID
            )
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for Clark Code release"
              exit 1
            fi
          done
      - name: Bind current Mac and Linux release orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          path: .release-orchestration
          sparse-checkout: |
            crates/clark-desktop-product/scripts/preflight-release-configs.mjs

      - name: Validate every enabled platform path before compilation
        run: |
          node "$GITHUB_WORKSPACE/.release-orchestration/$PRODUCT_DIR/scripts/preflight-release-configs.mjs" \
            --product-root "$GITHUB_WORKSPACE/$PRODUCT_DIR" \
            --foundation-root "$GITHUB_WORKSPACE/../clark-desktop"

      - name: Probe authorized Qwen access before compiling the paid evaluation
        if: ${{ inputs.run_paid_benchmark }}
        shell: bash
        env:
          CLARK_CODE_API_KEY: ${{ secrets.CLARK_CODE_PRERELEASE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLARK_CODE_API_KEY"
          response="$RUNNER_TEMP/qwen-access-probe.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLARK_CODE_API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"model":"qwen/qwen3.7-flash","stream":false,"max_tokens":1,"messages":[{"role":"user","content":"Reply OK"}]}' \
            https://api.clarkslabs.com/v1/chat/completions)"
          if [[ ! "$status" =~ ^2 ]]; then
            # process.argv is evaluated by Node.
            # shellcheck disable=SC2016
            node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.error(value?.error?.code || value?.error?.message || `HTTP ${process.argv[2]}`)' "$response" "$status"
            exit 1
          fi
          # process.argv is evaluated by Node.
          # shellcheck disable=SC2016
          node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (value?.error || !value?.choices?.length) process.exit(1)' "$response"

      - name: Authenticate the private publisher before compilation
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reject conflicting immutable release identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 293723385520
          prefix="desktop/releases/$CLARK_RELEASE_TAG/"
          mapfile -t keys < <(aws s3api list-objects-v2 \
            --bucket "$CLARK_DESKTOP_DOWNLOAD_BUCKET" \
            --prefix "$prefix" \
            --query 'Contents[].Key' \
            --output text | tr '\t' '\n' | sed '/^None$/d;/^$/d')
          checked=0
          for key in "${keys[@]}"; do
            [[ "$key" == "${prefix}_rollback/"* ]] && continue
            ((checked += 1))
            existing_revision="$(aws s3api head-object \
              --bucket "$CLARK_DESKTOP_DOWNLOAD_BUCKET" \
              --key "$key" \
              --query 'Metadata."source-revision"' \
              --output text)"
            if [[ "$existing_revision" != "$CLARK_RELEASE_SOURCE_REVISION" ]]; then
              echo "::error::Release $CLARK_RELEASE_TAG is already occupied by $existing_revision at $key"
              exit 1
            fi
          done
          echo "Immutable release identity is available or reusable ($checked existing exact objects)"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        if: ${{ inputs.run_paid_benchmark }}
        with:
          toolchain: 1.97.1

      - name: Restore the exact cargo-nextest executable
        if: ${{ inputs.run_paid_benchmark }}
        id: cargo-nextest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-nextest-${{ runner.os }}-0.9.143
          path: ~/.cargo/bin/cargo-nextest

      - name: Install the exact cargo-nextest executable
        if: ${{ inputs.run_paid_benchmark && steps.cargo-nextest-cache.outputs.cache-hit != 'true' }}
        run: cargo install cargo-nextest --version 0.9.143 --locked

      - name: Cache the exact cargo-nextest executable
        if: ${{ inputs.run_paid_benchmark && steps.cargo-nextest-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-nextest-${{ runner.os }}-0.9.143
          path: ~/.cargo/bin/cargo-nextest

      - name: Run the authorized bounded Qwen 3.7 Flash evaluation
        if: ${{ inputs.run_paid_benchmark }}
        working-directory: crates/clark-desktop-product
        env:
          CLARK_CODE_LIVE: "1"
          CLARK_CODE_PROVIDER: clark-platform
          CLARK_CODE_BASE_URL: https://api.clarkslabs.com/v1
          CLARK_CODE_MODEL: qwen/qwen3.7-flash
          CLARK_CODE_API_KEY: ${{ secrets.CLARK_CODE_PRERELEASE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLARK_CODE_API_KEY"
          cargo nextest run -p provider-local-product-evals --test live_clark_code \
            -E 'test(=live_qwen_37_flash_quick_chat_paid_evaluation)' \
            --run-ignored only --no-capture --test-threads=1

  mac_packaging_preflight:
    name: Fast macOS packaging and signing preflight
    needs: preflight
    if: ${{ inputs.release_platform == 'macos' || inputs.release_platform == 'all' }}
    runs-on: macos-15-xlarge
    environment: release
    timeout-minutes: 8
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          sparse-checkout: |
            crates/clark-desktop-product
      - name: Bind the exact public foundation revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < "$PRODUCT_DIR/foundation-revision.txt")"
          git clone --filter=blob:none --no-checkout https://github.com/clark-labs-inc/clark-code.git "$GITHUB_WORKSPACE/../clark-desktop"
          git -C "$GITHUB_WORKSPACE/../clark-desktop" fetch --depth=1 origin "$revision"
          git -C "$GITHUB_WORKSPACE/../clark-desktop" checkout --detach "$revision"
      - name: Import the mandatory macOS Developer ID
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$(mktemp "$RUNNER_TEMP/clark-certificate.XXXXXX.p12")"
          keychain="$RUNNER_TEMP/clark-preflight.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate" \
            || printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          rm -f "$certificate"
      - name: Verify merged bundle inputs and helper signing
        shell: bash
        run: bash "$PRODUCT_DIR/scripts/preflight-release-macos-packaging.sh"

  remote_worker:
    name: Shared remote Linux workers
    needs: [preflight, mac_packaging_preflight]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.mac_packaging_preflight.result == 'success' || needs.mac_packaging_preflight.result == 'skipped') }}
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          # Root eval captures include Linux-only generated filenames. Native
          # packages consume product/runtime sources, never those fixtures.
          sparse-checkout: |
            /*
            !/evals/
          sparse-checkout-cone-mode: false
      - name: Bind the exact public foundation revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < "$PRODUCT_DIR/foundation-revision.txt")"
          git clone --filter=blob:none --no-checkout https://github.com/clark-labs-inc/clark-code.git "$GITHUB_WORKSPACE/../clark-desktop"
          git -C "$GITHUB_WORKSPACE/../clark-desktop" fetch --depth=1 origin "$revision"
          git -C "$GITHUB_WORKSPACE/../clark-desktop" checkout --detach "$revision"
      - name: Bind the exact private worker revision outside the product workspace
        shell: bash
        env:
          CLARK_PRIVATE_READ_TOKEN: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLARK_PRIVATE_READ_TOKEN"
          git config --global \
            url."https://x-access-token:${CLARK_PRIVATE_READ_TOKEN}@github.com/clark-labs-inc/clark-autoresearch".insteadOf \
            "https://github.com/clark-labs-inc/clark-autoresearch"
          git clone --filter=blob:none --no-checkout \
            https://github.com/clark-labs-inc/clark-autoresearch.git \
            "$GITHUB_WORKSPACE/../clark-autoresearch"
          git -C "$GITHUB_WORKSPACE/../clark-autoresearch" fetch --depth=1 origin "$CLARK_AUTORESEARCH_RELEASE_REF"
          git -C "$GITHUB_WORKSPACE/../clark-autoresearch" checkout --detach "$CLARK_AUTORESEARCH_RELEASE_REF"
      - name: Validate the in-repository Scientist dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/../clark-autoresearch" rev-parse HEAD)" = "$CLARK_AUTORESEARCH_RELEASE_REF"
          "$PRODUCT_DIR/scripts/validate-scientist-lock.sh" \
            --product-root "$GITHUB_WORKSPACE/$PRODUCT_DIR" \
            --autoresearch-source "$GITHUB_WORKSPACE/../clark-autoresearch"
      - name: Calculate the source-bound shared-worker identity
        id: worker-identity
        shell: bash
        run: |
          node "$PRODUCT_DIR/scripts/shared-worker-cache.mjs" key \
            --product-root "$GITHUB_WORKSPACE" \
            --foundation-root "$GITHUB_WORKSPACE/../clark-desktop" \
            --autoresearch-root "$GITHUB_WORKSPACE/../clark-autoresearch" \
            --out "$RUNNER_TEMP/shared-worker-identity.json"
      - name: Restore immutable shared workers
        id: worker-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.worker-identity.outputs.cache-key }}
          path: |
            crates/clark-desktop-product/binaries/agent-code-worker-x86_64-unknown-linux-musl
            crates/clark-desktop-product/binaries/clark-code-headless-x86_64-unknown-linux-musl
            crates/clark-desktop-product/binaries/clark-execution-cell-x86_64-unknown-linux-gnu
            crates/clark-desktop-product/binaries/shared-worker-receipt.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        if: steps.worker-cache.outputs.cache-hit != 'true'
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - name: Install the repository Linux linker
        if: steps.worker-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Restore exact Zig toolchain
        if: steps.worker-cache.outputs.cache-hit != 'true'
        id: zig-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: zig-${{ runner.os }}-x86_64-0.16.0
          path: ~/.cache/clark-release-tools/zig-0.16.0
      - name: Install exact Zig toolchain
        if: steps.worker-cache.outputs.cache-hit != 'true' && steps.zig-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          install_dir="$HOME/.cache/clark-release-tools/zig-$ZIG_VERSION"
          curl --proto '=https' --tlsv1.2 --retry 5 --location --fail --silent --show-error \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xJf "$archive" --strip-components=1 -C "$install_dir"
      - name: Cache exact Zig toolchain
        if: steps.worker-cache.outputs.cache-hit != 'true' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: zig-${{ runner.os }}-x86_64-0.16.0
          path: ~/.cache/clark-release-tools/zig-0.16.0
      - name: Expose exact Zig toolchain
        if: steps.worker-cache.outputs.cache-hit != 'true'
        shell: bash
        run: echo "$HOME/.cache/clark-release-tools/zig-0.16.0" >> "$GITHUB_PATH"
      - name: Restore exact cargo-zigbuild executable
        if: steps.worker-cache.outputs.cache-hit != 'true'
        id: cargo-zigbuild-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: cargo-zigbuild-${{ runner.os }}-ubuntu-22.04-x86_64-0.23.0-v3
          path: ~/.cargo/bin/cargo-zigbuild
      - name: Install exact cargo-zigbuild executable
        if: steps.worker-cache.outputs.cache-hit != 'true' && steps.cargo-zigbuild-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --version 0.23.0 --locked
      - name: Cache exact cargo-zigbuild executable
        if: steps.worker-cache.outputs.cache-hit != 'true' && steps.cargo-zigbuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: cargo-zigbuild-${{ runner.os }}-ubuntu-22.04-x86_64-0.23.0-v3
          path: ~/.cargo/bin/cargo-zigbuild
      - name: Verify exact cargo-zigbuild executable
        if: steps.worker-cache.outputs.cache-hit != 'true'
        run: |
          test -x "$HOME/.cargo/bin/cargo-zigbuild"
          cargo zigbuild --help >/dev/null
      - name: Build shared workers once per component identity
        if: steps.worker-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shared_target_dir="$GITHUB_WORKSPACE/$PRODUCT_DIR/target/remote-worker"
          (
            cd "$GITHUB_WORKSPACE/../clark-desktop"
            AGENT_CODE_WORKER_TARGET_DIR="$shared_target_dir" \
              AGENT_CODE_WORKER_OUTPUT_DIR="$GITHUB_WORKSPACE/$PRODUCT_DIR/binaries" \
              scripts/stage-code-worker.sh \
                --target x86_64-unknown-linux-musl \
                --profile release
          )
          CLARK_SCIENTIST_TARGET_DIR="$shared_target_dir" \
            "$PRODUCT_DIR/scripts/stage-scientist-worker.sh" \
              --autoresearch-source "$GITHUB_WORKSPACE/../clark-autoresearch" \
              --target x86_64-unknown-linux-musl \
              --profile release
          CARGO_TARGET_DIR="$shared_target_dir" \
            cargo build \
              --locked \
              --manifest-path "$PRODUCT_DIR/Cargo.toml" \
              --release \
              -p clark-cli \
              --target x86_64-unknown-linux-gnu
          install -m 0755 \
            "$shared_target_dir/x86_64-unknown-linux-gnu/release/clark" \
            "$PRODUCT_DIR/binaries/clark-execution-cell-x86_64-unknown-linux-gnu"
          node "$PRODUCT_DIR/scripts/shared-worker-cache.mjs" receipt \
            --manifest "$RUNNER_TEMP/shared-worker-identity.json" \
            --agent-code-worker "$PRODUCT_DIR/binaries/agent-code-worker-x86_64-unknown-linux-musl" \
            --scientist-worker "$PRODUCT_DIR/binaries/clark-code-headless-x86_64-unknown-linux-musl" \
            --execution-cli "$PRODUCT_DIR/binaries/clark-execution-cell-x86_64-unknown-linux-gnu" \
            --out "$PRODUCT_DIR/binaries/shared-worker-receipt.json"
      - name: Verify shared-worker cache receipt
        shell: bash
        run: |
          node "$PRODUCT_DIR/scripts/shared-worker-cache.mjs" verify \
            --manifest "$RUNNER_TEMP/shared-worker-identity.json" \
            --receipt "$PRODUCT_DIR/binaries/shared-worker-receipt.json" \
            --agent-code-worker "$PRODUCT_DIR/binaries/agent-code-worker-x86_64-unknown-linux-musl" \
            --scientist-worker "$PRODUCT_DIR/binaries/clark-code-headless-x86_64-unknown-linux-musl" \
            --execution-cli "$PRODUCT_DIR/binaries/clark-execution-cell-x86_64-unknown-linux-gnu"
      - name: Save immutable shared workers
        if: steps.worker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.worker-identity.outputs.cache-key }}
          path: |
            crates/clark-desktop-product/binaries/agent-code-worker-x86_64-unknown-linux-musl
            crates/clark-desktop-product/binaries/clark-code-headless-x86_64-unknown-linux-musl
            crates/clark-desktop-product/binaries/clark-execution-cell-x86_64-unknown-linux-gnu
            crates/clark-desktop-product/binaries/shared-worker-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-remote-workers
          path: |
            crates/clark-desktop-product/binaries/agent-code-worker-x86_64-unknown-linux-musl
            crates/clark-desktop-product/binaries/clark-code-headless-x86_64-unknown-linux-musl
            crates/clark-desktop-product/binaries/clark-execution-cell-x86_64-unknown-linux-gnu
            crates/clark-desktop-product/binaries/shared-worker-receipt.json
          if-no-files-found: error
          retention-days: 2
      - name: Remove private Cargo credentials
        if: always()
        shell: bash
        env:
          CLARK_PRIVATE_READ_TOKEN: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
        run: |
          git config --global --unset-all \
            url."https://x-access-token:${CLARK_PRIVATE_READ_TOKEN}@github.com/clark-labs-inc/clark-autoresearch".insteadOf || true

  build:
    name: Build and publish immutable ${{ matrix.name }} artifacts
    needs: [preflight, mac_packaging_preflight, remote_worker]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.mac_packaging_preflight.result == 'success' || needs.mac_packaging_preflight.result == 'skipped') && needs.remote_worker.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 90
    env:
      # Tauri's command-pruning proc macros read REMOVE_UNUSED_COMMANDS outside
      # rustc's tracked environment dependencies. Keep native release objects
      # in a dedicated cache namespace so the standalone, command-pruned
      # foundation build can never populate this release cache.
      CLARK_AUTORESEARCH_SOURCE: ${{ github.workspace }}/../clark-autoresearch
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      CLARK_CELL_RELEASE_SIGNING_KEY: ${{ secrets.CLARK_CELL_RELEASE_SIGNING_KEY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CLARK_QA_AUTH_CONFIGURED: ${{ secrets.CLARK_QA_AUTH_NAME != '' && secrets.CLARK_QA_AUTH_EMAIL != '' && secrets.CLARK_QA_AUTH_PASSWORD != '' }}
      CLARK_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
      CLARK_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          # Root eval captures include Linux-only generated filenames. Native
          # packages consume product/runtime sources, never those fixtures.
          sparse-checkout: |
            /*
            !/evals/
          sparse-checkout-cone-mode: false
      - name: Calculate the exact platform release-record identity
        id: platform-record-identity
        shell: bash
        run: |
          set -euo pipefail
          foundation_revision="$(tr -d '[:space:]' < "$PRODUCT_DIR/foundation-revision.txt")"
          # The Scientist source is now part of the exact Clark source revision.
          # Keep this terminal discriminator stable across Mac+Linux expansion.
          identity="${{ matrix.platform }}|$CLARK_RELEASE_SOURCE_REVISION|$foundation_revision|$CLARK_AUTORESEARCH_RELEASE_REF|1.97.1|xcode-26.3|signed|scientist-in-repo-v1"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(printf '%s' "$identity" | sha256sum | awk '{print $1}')"
          else
            digest="$(printf '%s' "$identity" | shasum -a 256 | awk '{print $1}')"
          fi
          echo "cache-key=platform-release-record-v2-$digest" >> "$GITHUB_OUTPUT"
      - name: Restore an exact successful platform release record
        id: platform-record-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.platform-record-identity.outputs.cache-key }}
          path: crates/clark-desktop-product/public-release-records
      - name: Select the release Xcode and macOS 26 SDK
        if: runner.os == 'macOS' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "$xcode_version" == 26.* ]] || {
            echo "Xcode 26 is required, found $xcode_version" >&2
            exit 1
          }
          [[ "$sdk_version" == 26.* ]] || {
            echo "macOS 26 SDK is required, found $sdk_version" >&2
            exit 1
          }
          printf 'release Xcode %s with macOS SDK %s\n' "$xcode_version" "$sdk_version"
      - name: Bind the exact public foundation revision
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < "$PRODUCT_DIR/foundation-revision.txt")"
          git clone --filter=blob:none --no-checkout https://github.com/clark-labs-inc/clark-code.git "$GITHUB_WORKSPACE/../clark-desktop"
          git -C "$GITHUB_WORKSPACE/../clark-desktop" fetch --depth=1 origin "$revision"
          git -C "$GITHUB_WORKSPACE/../clark-desktop" checkout --detach "$revision"
          mkdir -p "$GITHUB_WORKSPACE/.release-cache"
          cp "$GITHUB_WORKSPACE/../clark-desktop/app/pnpm-lock.yaml" \
            "$GITHUB_WORKSPACE/.release-cache/foundation-pnpm-lock.yaml"
      - name: Bind the exact private worker revision outside the product workspace
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CLARK_PRIVATE_READ_TOKEN: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLARK_PRIVATE_READ_TOKEN"
          git config --global \
            url."https://x-access-token:${CLARK_PRIVATE_READ_TOKEN}@github.com/clark-labs-inc/clark-autoresearch".insteadOf \
            "https://github.com/clark-labs-inc/clark-autoresearch"
          git clone --filter=blob:none --no-checkout \
            https://github.com/clark-labs-inc/clark-autoresearch.git \
            "$GITHUB_WORKSPACE/../clark-autoresearch"
          git -C "$GITHUB_WORKSPACE/../clark-autoresearch" fetch --depth=1 origin "$CLARK_AUTORESEARCH_RELEASE_REF"
          git -C "$GITHUB_WORKSPACE/../clark-autoresearch" checkout --detach "$CLARK_AUTORESEARCH_RELEASE_REF"
      - name: Bind the exact private worker dependencies
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/../clark-autoresearch" rev-parse HEAD)" = "$CLARK_AUTORESEARCH_RELEASE_REF"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust_targets }}
      - name: Restore the exact cargo-nextest executable
        if: runner.os == 'Linux' && steps.platform-record-cache.outputs.cache-hit != 'true'
        id: cargo-nextest-platform-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-nextest-${{ runner.os }}-ubuntu-24.04-0.9.143
          path: ~/.cargo/bin/cargo-nextest
      - name: Install the exact cargo-nextest executable
        if: runner.os == 'Linux' && steps.platform-record-cache.outputs.cache-hit != 'true' && steps.cargo-nextest-platform-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --version 0.9.143 --locked
      - name: Cache the exact cargo-nextest executable
        if: runner.os == 'Linux' && steps.platform-record-cache.outputs.cache-hit != 'true' && steps.cargo-nextest-platform-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-nextest-${{ runner.os }}-ubuntu-24.04-0.9.143
          path: ~/.cargo/bin/cargo-nextest
      - name: Set up pinned bounded kache
        uses: kunobi-ninja/kache-action@49398d37113c616fdb61be434cb497e3c2c8f3e6 # v1
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        with:
          version: 0.14.2
          cache-executables: false
          cache-key-prefix: clark-code-release-${{ matrix.platform }}-unpruned-v1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: .release-cache/foundation-pnpm-lock.yaml
      - name: Install Linux native packaging dependencies
        if: runner.os == 'Linux' && steps.platform-record-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            build-essential \
            file \
            patchelf \
            meson \
            mold \
            ninja-build \
            pkg-config \
            libcap-dev
      - name: Install frontend dependencies
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: pnpm --dir "$GITHUB_WORKSPACE/../clark-desktop/app" install --frozen-lockfile
      - name: Bind product frontend dependencies (Unix)
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: ln -s "$GITHUB_WORKSPACE/../clark-desktop/app/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Validate the exact private worker lock
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          "$PRODUCT_DIR/scripts/validate-scientist-lock.sh" \
            --product-root "$GITHUB_WORKSPACE/$PRODUCT_DIR" \
            --autoresearch-source "$CLARK_AUTORESEARCH_SOURCE"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        with:
          name: shared-remote-workers
          path: crates/clark-desktop-product/binaries

      # GitHub artifact archives do not preserve Unix executable modes. The
      # workers are byte-verified by their source-bound receipt, then packaged
      # as native sidecars on both release platforms.
      - name: Restore shared-worker executable modes
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod 0755 \
            "$PRODUCT_DIR/binaries/agent-code-worker-x86_64-unknown-linux-musl" \
            "$PRODUCT_DIR/binaries/clark-code-headless-x86_64-unknown-linux-musl" \
            "$PRODUCT_DIR/binaries/clark-execution-cell-x86_64-unknown-linux-gnu"

      - name: Re-run the canonical product composition gate
        if: runner.os == 'Linux' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          "$PRODUCT_DIR/scripts/verify-product-composition.sh" \
            --foundation-root "$GITHUB_WORKSPACE/../clark-desktop" \
            --autoresearch-source "$CLARK_AUTORESEARCH_SOURCE" \
            --target x86_64-unknown-linux-gnu

      - name: Import the mandatory macOS Developer ID
        if: runner.os == 'macOS' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$(mktemp "$RUNNER_TEMP/clark-certificate.XXXXXX.p12")"
          keychain="$RUNNER_TEMP/clark-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          original_keychain="$(security default-keychain -d user | sed -e 's/^[[:space:]]*\"//' -e 's/\"[[:space:]]*$//')"
          test -n "$original_keychain"
          printf '%s\n' "$original_keychain" > "$RUNNER_TEMP/clark-original-default-keychain"
          chmod 600 "$RUNNER_TEMP/clark-original-default-keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate" \
            || printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          rm -f "$certificate"

      - name: Build native package
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          "$PRODUCT_DIR/scripts/build-release-platform.sh" "${{ matrix.platform }}"

      - name: Build signed enterprise execution cell
        if: runner.os == 'Linux' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLARK_CELL_RELEASE_SIGNING_KEY"
          artifact_name="clark-execution-cell-${{ inputs.version }}.tar.gz"
          artifact_url="$CLARK_DESKTOP_DOWNLOAD_BASE_URL/execution-cells/releases/$CLARK_RELEASE_TAG/$artifact_name"
          node prototypes/clark-slack-code-runner/scripts/build-release.js \
            --version "${{ inputs.version }}" \
            --clark "$PRODUCT_DIR/binaries/clark-execution-cell-x86_64-unknown-linux-gnu" \
            --headless-worker "$PRODUCT_DIR/binaries/clark-code-headless-x86_64-unknown-linux-musl" \
            --artifact-url "$artifact_url" \
            --output "$PRODUCT_DIR/target/execution-cell-release"

      - name: Sign and repackage the standalone macOS Clark TUI
        if: runner.os == 'macOS' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          package_bin="$PRODUCT_DIR/target/clark-cli-release/universal-apple-darwin/package/bin"
          for executable in "$package_bin/clark" "$package_bin/clark-code-headless"; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$executable"
            codesign --verify --strict --verbose=2 "$executable"
          done
          "$PRODUCT_DIR/scripts/package-cli-release.sh" --target universal-apple-darwin

      - name: Notarize and staple the final macOS disk image
        if: runner.os == 'macOS' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$PRODUCT_DIR/target/universal-apple-darwin/release/bundle"
          dmg="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          app="$bundle_root/macos/Clark Code.app"
          test -s "$dmg"
          test -d "$app"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          cli_archive="$PRODUCT_DIR/target/clark-cli-release/universal-apple-darwin/clark-universal-apple-darwin.zip"
          test -s "$cli_archive"
          xcrun notarytool submit "$cli_archive" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --deep --strict --verbose=4 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          "$app/Contents/MacOS/clark-code" --local-research-worker-self-test

      - name: Restore the macOS runtime keychain
        if: runner.os == 'macOS' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Signing needs the temporary Developer ID keychain, but the packaged
          # app must exercise TLS with the runner's ordinary user trust context.
          original_keychain="$(tr -d '\r\n' < "$RUNNER_TEMP/clark-original-default-keychain")"
          test -n "$original_keychain"
          security default-keychain -d user -s "$original_keychain"
          active_keychain="$(security default-keychain -d user | sed -e 's/^[[:space:]]*\"//' -e 's/\"[[:space:]]*$//')"
          test "$active_keychain" = "$original_keychain"

      - name: Run credential-free packaged macOS updater smoke
        if: runner.os == 'macOS' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="$PRODUCT_DIR/target/universal-apple-darwin/release/bundle/macos/Clark Code.app"
          test -d "$app"
          node "$PRODUCT_DIR/harness/macos-release-ui-smoke.mjs" \
            --updater-only \
            --app "$app" \
            --out "$PRODUCT_DIR/target/macos-updater-smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Retain packaged macOS updater smoke receipt
        if: always() && runner.os == 'macOS' && steps.platform-record-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packaged-macos-updater-smoke
          path: crates/clark-desktop-product/target/macos-updater-smoke
          if-no-files-found: error
          retention-days: 90

      - name: Run packaged macOS product smoke
        if: runner.os == 'macOS' && env.CLARK_QA_AUTH_CONFIGURED == 'true' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CLARK_QA_AUTH_NAME: ${{ secrets.CLARK_QA_AUTH_NAME }}
          CLARK_QA_AUTH_EMAIL: ${{ secrets.CLARK_QA_AUTH_EMAIL }}
          CLARK_QA_AUTH_PASSWORD: ${{ secrets.CLARK_QA_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          app="$PRODUCT_DIR/target/universal-apple-darwin/release/bundle/macos/Clark Code.app"
          test -d "$app"
          node "$PRODUCT_DIR/harness/macos-release-ui-smoke.mjs" \
            --app "$app" \
            --out "$PRODUCT_DIR/target/macos-release-ui-smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Retain packaged macOS product smoke receipt
        if: always() && runner.os == 'macOS' && env.CLARK_QA_AUTH_CONFIGURED == 'true' && steps.platform-record-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packaged-macos-ui-smoke
          path: crates/clark-desktop-product/target/macos-release-ui-smoke
          if-no-files-found: error
          retention-days: 90

      - name: Verify Linux release bundle set
        if: runner.os == 'Linux' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          find "$PRODUCT_DIR/target" -type f -path '*/bundle/appimage/*.AppImage' -print -quit | grep -q .
          find "$PRODUCT_DIR/target" -type f -path '*/bundle/deb/*.deb' -print -quit | grep -q .
          find "$PRODUCT_DIR/target" -type f -path '*/bundle/rpm/*.rpm' -print -quit | grep -q .

      - name: Authenticate immutable platform publisher
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish immutable enterprise execution-cell release
        if: runner.os == 'Linux' && steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$PRODUCT_DIR/target/execution-cell-release"
          for file in "$release_dir"/*; do
            name="$(basename "$file")"
            key="desktop/execution-cells/releases/$CLARK_RELEASE_TAG/$name"
            sha="$(sha256sum "$file" | awk '{print $1}')"
            if remote_sha="$(aws s3api head-object --bucket "$CLARK_DESKTOP_DOWNLOAD_BUCKET" --key "$key" --query 'Metadata.sha256' --output text 2>/dev/null)"; then
              test "$remote_sha" = "$sha"
            else
              aws s3 cp "$file" "s3://$CLARK_DESKTOP_DOWNLOAD_BUCKET/$key" \
                --only-show-errors --metadata "sha256=$sha" \
                --content-type "$(case "$name" in *.json) echo application/json;; *) echo application/gzip;; esac)"
            fi
          done
      - name: Publish source-bound immutable platform files
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          "$PRODUCT_DIR/scripts/publish-platform-artifacts.sh"
      - name: Verify the cached immutable platform record
        if: steps.platform-record-cache.outputs.cache-hit == 'true'
        run: |
          node "$PRODUCT_DIR/scripts/verify-platform-record-cache.mjs" \
            --records "$PRODUCT_DIR/public-release-records" \
            --bucket "$CLARK_DESKTOP_DOWNLOAD_BUCKET" \
            --tag "$CLARK_RELEASE_TAG" \
            --source-revision "$CLARK_RELEASE_SOURCE_REVISION"
      - name: Save the exact successful platform release record
        if: steps.platform-record-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.platform-record-identity.outputs.cache-key }}
          path: crates/clark-desktop-product/public-release-records
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-download-records-${{ matrix.platform }}
          path: crates/clark-desktop-product/public-release-records/*.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: runner.os == 'Linux' && steps.platform-record-cache.outputs.cache-hit != 'true'
        with:
          name: execution-cell-release-linux
          path: crates/clark-desktop-product/target/execution-cell-release
          if-no-files-found: error
          retention-days: 90
      - name: Remove private Cargo credentials
        if: always()
        shell: bash
        env:
          CLARK_PRIVATE_READ_TOKEN: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
        run: |
          git config --global --unset-all \
            url."https://x-access-token:${CLARK_PRIVATE_READ_TOKEN}@github.com/clark-labs-inc/clark-autoresearch".insteadOf || true

  publish_cli:
    name: Advance standalone Clark TUI channel when complete
    needs: [preflight, build]
    if: ${{ always() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 15
    concurrency:
      group: clark-cli-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Authenticate the standalone CLI publisher
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish a source-bound complete CLI channel
        shell: bash
        run: |
          "$PRODUCT_DIR/scripts/publish-cli-channel.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: clark-cli-publication
          path: crates/clark-desktop-product/target/clark-cli-channel
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Atomically advance current platform release channels
    needs: [preflight, build, publish_cli]
    # A platform-selective release intentionally skips unrelated preflights.
    # GitHub propagates that skipped ancestor through the default success()
    # condition even after the selected build succeeds, so evaluate only the
    # two direct authorities required to advance the channel.
    if: ${{ always() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.publish_cli.result == 'success' }}
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.0
        with:
          pattern: desktop-download-records-*
          path: crates/clark-desktop-product/release-records
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.0
        if: contains(needs.preflight.outputs.release_platforms, 'linux')
        with:
          name: execution-cell-release-linux
          path: crates/clark-desktop-product/execution-cell-release
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Prepare the selected platform channel
        working-directory: crates/clark-desktop-product
        shell: bash
        run: |
          published_at="$(git -C "$GITHUB_WORKSPACE" show -s --format=%cI "$CLARK_RELEASE_SOURCE_REVISION" | node -e 'process.stdin.once("data", value => console.log(new Date(String(value).trim()).toISOString()))')"
          node harness/prepare-release-channel.mjs \
            --records release-records \
            --out target/release-channel \
            --tag "$CLARK_RELEASE_TAG" \
            --base-url "$CLARK_DESKTOP_DOWNLOAD_BASE_URL" \
            --source-revision "$CLARK_RELEASE_SOURCE_REVISION" \
            --platforms "${{ needs.preflight.outputs.release_platforms }}" \
            --repository "$GITHUB_REPOSITORY" \
            --published-at "$published_at"
      - name: Install the public website verifier before promotion
        working-directory: crates/clark-desktop-product/harness
        run: |
          pnpm install --frozen-lockfile --filter @clark/code-release-harness...
          pnpm exec playwright install --with-deps chromium
      - name: Authenticate atomic channel publisher
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Advance aliases and every updater manifest together
        env:
          CLARK_DESKTOP_LEGACY_UPDATER_MODE: retire
        run: |
          "$PRODUCT_DIR/scripts/advance-release-channel.sh"
      - name: Verify downloads, per-target updaters, and rendered page
        working-directory: crates/clark-desktop-product
        shell: bash
        run: |
          set -euo pipefail
          verification_status=0
          for confirmation in 1 2; do
            node harness/public-release-journey.mjs \
              --tag "$CLARK_RELEASE_TAG" \
              --base-url "$CLARK_DESKTOP_DOWNLOAD_BASE_URL" \
              --site-url https://www.clarkchat.com/clark-code \
              --source-revision "$CLARK_RELEASE_SOURCE_REVISION" \
              --repository "$GITHUB_REPOSITORY" \
              --platforms "$(<target/release-channel/platforms.csv)" \
              --assets target/release-channel/assets.json \
              --out "target/release-channel/journey-$confirmation" || {
                verification_status=$?
                break
              }
            sleep 5
          done
          if (( verification_status != 0 )); then
            scripts/advance-release-channel.sh rollback
            exit "$verification_status"
          fi
      - name: Advance the enterprise execution-cell update channel
        if: contains(needs.preflight.outputs.release_platforms, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find "$PRODUCT_DIR/execution-cell-release" -maxdepth 1 -type f -name '*.json' -print -quit)"
          test -s "$manifest"
          aws s3 cp "$manifest" \
            "s3://$CLARK_DESKTOP_DOWNLOAD_BUCKET/desktop/execution-cells/current.json" \
            --only-show-errors --content-type application/json --cache-control no-cache
          aws s3 cp prototypes/clark-slack-code-runner/scripts/install.sh \
            "s3://$CLARK_DESKTOP_DOWNLOAD_BUCKET/desktop/execution-cells/install.sh" \
            --only-show-errors --content-type text/x-shellscript --cache-control no-cache
          if [[ -n "$CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID" ]]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID" \
              --paths \
                '/desktop/execution-cells/current.json' \
                '/desktop/execution-cells/install.sh' >/dev/null
          fi
          curl --proto '=https' --tlsv1.2 --retry 5 --fail --silent --show-error \
            "$CLARK_DESKTOP_DOWNLOAD_BASE_URL/execution-cells/current.json" \
            --output "$RUNNER_TEMP/execution-cell-current.json"
          cmp "$manifest" "$RUNNER_TEMP/execution-cell-current.json"
          curl --proto '=https' --tlsv1.2 --retry 5 --fail --silent --show-error \
            "$CLARK_DESKTOP_DOWNLOAD_BASE_URL/execution-cells/install.sh" \
            --output "$RUNNER_TEMP/execution-cell-install.sh"
          cmp prototypes/clark-slack-code-runner/scripts/install.sh \
            "$RUNNER_TEMP/execution-cell-install.sh"
      - name: Record the authenticated external finalization handoff
        shell: bash
        working-directory: crates/clark-desktop-product
        run: |
          set -euo pipefail
          jq -n \
            --arg tag "$CLARK_RELEASE_TAG" \
            --arg version "${CLARK_RELEASE_TAG#v}" \
            --arg source_revision "$CLARK_RELEASE_SOURCE_REVISION" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            '{status:"ready",tag:$tag,version:$version,source_revision:$source_revision,run_id:$run_id,repository:$repository}' \
            > target/release-channel/release-finalization-handoff.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-release-receipts
          path: crates/clark-desktop-product/target/release-channel
          if-no-files-found: error
          retention-days: 90
