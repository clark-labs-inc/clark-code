name: Public boundary

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: public-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target checks out the trusted base branch. Never execute
      # scripts or workflows from the contributor's head in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head without checking it out
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"

      - name: Check changed paths and added content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA:-}" ]]; then
            head_ref="refs/remotes/origin/pr/${PR_NUMBER}"
            scripts/check-public-boundary.sh "$BASE_SHA" "$head_ref"
          else
            scripts/check-public-boundary.sh
          fi

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA:-}" ]]; then
            git diff --check "$BASE_SHA" "refs/remotes/origin/pr/${PR_NUMBER}"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Check product decomposition contract
        run: node --test harness/product-boundary.spec.mjs
