name: Migrate Clark Code release secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Copy protected release secrets to the private product repository
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CLARK_RELEASE_ADMIN_TOKEN }}
      TARGET_REPOSITORY: skirdey/clark
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CLARK_CODE_PRERELEASE_API_KEY: ${{ secrets.CLARK_CODE_PRERELEASE_API_KEY }}
      CLARK_SCIENTIST_READ_TOKEN: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
      VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - name: Require the exact private destination
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "skirdey/clark"
          test "$(gh repo view "$TARGET_REPOSITORY" --json isPrivate --jq .isPrivate)" = true

      - name: Copy repository release secrets without exposing their values
        shell: bash
        run: |
          set -euo pipefail
          names=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_ID
            APPLE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
            CLARK_CODE_PRERELEASE_API_KEY
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            VITE_GOOGLE_DESKTOP_CLIENT_ID
            VITE_GOOGLE_DESKTOP_CLIENT_SECRET
          )
          for name in "${names[@]}"; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "::error::$name is unavailable in the source release environment"
              exit 1
            fi
            printf '%s' "$value" | gh secret set "$name" --repo "$TARGET_REPOSITORY"
          done

      - name: Copy the protected private-source token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLARK_SCIENTIST_READ_TOKEN:-}" ]]; then
            echo "::error::CLARK_SCIENTIST_READ_TOKEN is unavailable in the source release environment"
            exit 1
          fi
          printf '%s' "$CLARK_SCIENTIST_READ_TOKEN" |
            gh secret set CLARK_SCIENTIST_READ_TOKEN \
              --repo "$TARGET_REPOSITORY" \
              --env release
