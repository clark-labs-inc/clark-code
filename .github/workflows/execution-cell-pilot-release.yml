name: Execution cell pilot release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact execution-cell semver
        required: true
        type: string
      source_revision:
        description: Exact 40-character Clark source commit
        required: true
        type: string
      worker_run_id:
        description: Trusted Clark Code release run containing shared-remote-workers
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write

concurrency:
  group: execution-cell-pilot-release
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  PRODUCT_REPOSITORY: clark-labs-inc/clark
  CLARK_DESKTOP_DOWNLOAD_BUCKET: ${{ vars.CLARK_DESKTOP_DOWNLOAD_BUCKET }}
  CLARK_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.CLARK_DESKTOP_DOWNLOAD_BASE_URL }}
  CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN: ${{ vars.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
  CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID: ${{ vars.CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID }}

jobs:
  publish:
    name: Build and publish signed pilot cell
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 35
    env:
      CLARK_CELL_RELEASE_SIGNING_KEY: ${{ secrets.CLARK_CELL_RELEASE_SIGNING_KEY }}
      GH_TOKEN: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24.18.0

      - name: Verify the exact pilot source and green contracts
        shell: bash
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(node -p "require('./prototypes/clark-slack-code-runner/package.json').version")" = "$RELEASE_VERSION"
          required_checks=("Exact Clark server and deploy contracts")
          for _ in {1..100}; do
            checks="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$PRODUCT_REPOSITORY/commits/$SOURCE_REVISION/check-runs?filter=latest&per_page=100")"
            pending=0
            for required_check in "${required_checks[@]}"; do
              state="$(jq -r --arg name "$required_check" '
                [.check_runs[] | select(.name == $name)][0]
                | if . == null then "missing\t"
                  else [.status, (.conclusion // "")] | @tsv
                  end
              ' <<< "$checks")"
              IFS=$'\t' read -r status conclusion <<< "$state"
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "::error::Required candidate check failed: $required_check ($conclusion)"
                exit 1
              fi
              if [[ "$status" != completed || "$conclusion" != success ]]; then
                pending=1
              fi
            done
            (( pending == 0 )) && exit 0
            sleep 10
          done
          echo "::error::Timed out waiting for exact candidate checks"
          exit 1

      - name: Download and authenticate the shared Linux workers
        shell: bash
        env:
          WORKER_RUN_ID: ${{ inputs.worker_run_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$WORKER_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$WORKER_RUN_ID")"
          test "$(jq -r .name <<< "$run")" = "Clark Code release"
          test "$(jq -r .event <<< "$run")" = "workflow_dispatch"
          jobs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$WORKER_RUN_ID/jobs?per_page=100")"
          worker_job="$(jq -c '
            [.jobs[] | select(.name == "Shared remote Linux workers")]
            | if length == 1 then .[0] else error("trusted worker job is missing or duplicated") end
          ' <<< "$jobs")"
          test "$(jq -r .status <<< "$worker_job")" = "completed"
          test "$(jq -r .conclusion <<< "$worker_job")" = "success"
          mkdir -p "$RUNNER_TEMP/shared-workers"
          gh run download "$WORKER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name shared-remote-workers \
            --dir "$RUNNER_TEMP/shared-workers"
          receipt="$RUNNER_TEMP/shared-workers/shared-worker-receipt.json"
          product_revision="$(jq -er '.inputs.productRevision | select(test("^[0-9a-f]{40}$"))' "$receipt")"
          git merge-base --is-ancestor "$product_revision" "$SOURCE_REVISION"
          for filename in \
            clark-code-headless-x86_64-unknown-linux-musl \
            clark-execution-cell-x86_64-unknown-linux-gnu; do
            expected="$(jq -er --arg filename "$filename" '.files[$filename].sha256' "$receipt")"
            actual="$(sha256sum "$RUNNER_TEMP/shared-workers/$filename" | awk '{print $1}')"
            test "$actual" = "$expected"
            chmod 0755 "$RUNNER_TEMP/shared-workers/$filename"
          done
          clark_version="$("$RUNNER_TEMP/shared-workers/clark-execution-cell-x86_64-unknown-linux-gnu" --version | awk '{print $NF}')"
          headless_version="$("$RUNNER_TEMP/shared-workers/clark-code-headless-x86_64-unknown-linux-musl" --version | awk '{print $NF}')"
          [[ "$clark_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$headless_version" = "$clark_version"

      - name: Build the signed source-pinned execution-cell bundle
        id: bundle
        shell: bash
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$CLARK_CELL_RELEASE_SIGNING_KEY"
          output="$RUNNER_TEMP/execution-cell-release"
          artifact_name="clark-execution-cell-$RELEASE_VERSION.tar.gz"
          artifact_url="$CLARK_DESKTOP_DOWNLOAD_BASE_URL/execution-cells/pilots/$SOURCE_REVISION/$artifact_name"
          node prototypes/clark-slack-code-runner/scripts/build-release.js \
            --version "$RELEASE_VERSION" \
            --clark "$RUNNER_TEMP/shared-workers/clark-execution-cell-x86_64-unknown-linux-gnu" \
            --headless-worker "$RUNNER_TEMP/shared-workers/clark-code-headless-x86_64-unknown-linux-musl" \
            --artifact-url "$artifact_url" \
            --output "$output" > "$RUNNER_TEMP/execution-cell-release-receipt.json"
          artifact="$(jq -er .archive "$RUNNER_TEMP/execution-cell-release-receipt.json")"
          manifest="$(jq -er .manifest "$RUNNER_TEMP/execution-cell-release-receipt.json")"
          public_key="$(jq -er .publicKey "$RUNNER_TEMP/execution-cell-release-receipt.json")"
          [[ "$public_key" =~ ^[A-Za-z0-9_-]{43}$ ]]
          printf '%s\n' "$public_key" > "$output/release-key"
          {
            echo "artifact=$artifact"
            echo "manifest=$manifest"
            echo "public_key_file=$output/release-key"
            echo "output=$output"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the signed manifest before publication
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.bundle.outputs.manifest }}
          PUBLIC_KEY_PATH: ${{ steps.bundle.outputs.public_key_file }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { verifyReleaseManifest } from './prototypes/clark-slack-code-runner/src/update-manager.js';
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, 'utf8'));
          const publicKey = fs.readFileSync(process.env.PUBLIC_KEY_PATH, 'utf8').trim();
          const verified = verifyReleaseManifest(manifest, publicKey);
          const expected = `/execution-cells/pilots/${process.env.SOURCE_REVISION}/`;
          if (!new URL(verified.artifactUrl).pathname.includes(expected)) {
            throw new Error('Pilot artifact URL is not source-pinned.');
          }
          NODE

      - name: Authenticate the execution-cell pilot publisher
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.0.0
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish immutable bundle and advance only the pilot channel
        shell: bash
        env:
          ARTIFACT: ${{ steps.bundle.outputs.artifact }}
          MANIFEST: ${{ steps.bundle.outputs.manifest }}
          PUBLIC_KEY_FILE: ${{ steps.bundle.outputs.public_key_file }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          publish_immutable() {
            local file="$1" key="$2" content_type="$3" sha remote_sha
            sha="$(sha256sum "$file" | awk '{print $1}')"
            if remote_sha="$(aws s3api head-object \
              --bucket "$CLARK_DESKTOP_DOWNLOAD_BUCKET" \
              --key "$key" \
              --query 'Metadata.sha256' \
              --output text 2>/dev/null)"; then
              test "$remote_sha" = "$sha"
            else
              aws s3api put-object \
                --bucket "$CLARK_DESKTOP_DOWNLOAD_BUCKET" \
                --key "$key" \
                --body "$file" \
                --content-type "$content_type" \
                --metadata "sha256=$sha" \
                --if-none-match '*' >/dev/null
            fi
          }
          prefix="desktop/execution-cells/pilots/$SOURCE_REVISION"
          publish_immutable "$ARTIFACT" "$prefix/$(basename "$ARTIFACT")" application/gzip
          publish_immutable "$MANIFEST" "$prefix/$(basename "$MANIFEST")" application/json
          publish_immutable "$PUBLIC_KEY_FILE" "$prefix/release-key" text/plain
          publish_immutable \
            prototypes/clark-slack-code-runner/scripts/install.sh \
            "$prefix/install.sh" text/x-shellscript
          aws s3 cp "$MANIFEST" \
            "s3://$CLARK_DESKTOP_DOWNLOAD_BUCKET/desktop/execution-cells/pilot/current.json" \
            --only-show-errors --content-type application/json --cache-control no-cache
          aws s3 cp "$PUBLIC_KEY_FILE" \
            "s3://$CLARK_DESKTOP_DOWNLOAD_BUCKET/desktop/execution-cells/pilot/release-key" \
            --only-show-errors --content-type text/plain --cache-control no-cache
          aws s3 cp prototypes/clark-slack-code-runner/scripts/install.sh \
            "s3://$CLARK_DESKTOP_DOWNLOAD_BUCKET/desktop/execution-cells/install.sh" \
            --only-show-errors --content-type text/x-shellscript --cache-control no-cache
          if [[ -n "$CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID" ]]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID" \
              --paths \
                '/desktop/execution-cells/pilot/current.json' \
                '/desktop/execution-cells/pilot/release-key' \
                '/desktop/execution-cells/install.sh' >/dev/null
          fi
          for _ in {1..12}; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              "$CLARK_DESKTOP_DOWNLOAD_BASE_URL/execution-cells/pilot/current.json" \
              --output "$RUNNER_TEMP/pilot-current.json"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              "$CLARK_DESKTOP_DOWNLOAD_BASE_URL/execution-cells/pilot/release-key" \
              --output "$RUNNER_TEMP/pilot-release-key"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              "$CLARK_DESKTOP_DOWNLOAD_BASE_URL/execution-cells/install.sh" \
              --output "$RUNNER_TEMP/execution-cell-install.sh"
            if cmp -s "$MANIFEST" "$RUNNER_TEMP/pilot-current.json" \
              && cmp -s "$PUBLIC_KEY_FILE" "$RUNNER_TEMP/pilot-release-key" \
              && cmp -s prototypes/clark-slack-code-runner/scripts/install.sh \
                "$RUNNER_TEMP/execution-cell-install.sh"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pilot execution-cell channel did not converge"
          exit 1

      - name: Retain the signed pilot release receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-cell-pilot-release
          path: |
            ${{ steps.bundle.outputs.output }}
            ${{ runner.temp }}/execution-cell-release-receipt.json
          if-no-files-found: error
          retention-days: 90
