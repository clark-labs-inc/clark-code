name: Release

# Builds signed installers for macOS, Windows, and Linux on GitHub's native
# runners (cross-compiling a Tauri app from one OS to the others is not viable),
# and publishes them to a GitHub Release. Triggered by a version tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile

      - name: Build + publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS is built unsigned/ad-hoc (no Apple certs configured). Passing
          # empty APPLE_* secrets makes `security import` fail, so they are
          # intentionally omitted; add them back only once real certs exist.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clark Desktop ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform from the assets below.

            **macOS** builds are not yet notarized, so Gatekeeper blocks them on
            first launch. After dragging Clark Desktop into Applications, open
            **System Settings → Privacy & Security → Open Anyway**, or run:
            `xattr -dr com.apple.quarantine "/Applications/Clark Desktop.app"`

            **Windows** SmartScreen may warn on the unsigned installer. Click
            **More info → Run anyway**.
          # Each matrix leg uploads into the same draft release; the `publish`
          # job below flips it public only after every platform has uploaded.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publish the draft once all platform builds have uploaded their installers,
  # so the release never goes public missing one platform's assets.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false --latest

# The public download page lives in clark-ui (clarkchat.com/download) and
# resolves these release assets via the GitHub Releases API — so there is no
# GitHub Pages deploy here.
