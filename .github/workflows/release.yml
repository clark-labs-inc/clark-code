name: Release

# Builds signed installers for macOS, Windows, and Linux on GitHub's native
# runners (cross-compiling a Tauri app from one OS to the others is not viable),
# keeps an operator copy in a private GitHub Release, and publishes public
# binaries to Clark-owned download hosting. Triggered by a version tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-west-2
  CLARK_DESKTOP_DOWNLOAD_BUCKET: ${{ vars.CLARK_DESKTOP_DOWNLOAD_BUCKET || 'clark-desktop-downloads-prod' }}
  CLARK_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.CLARK_DESKTOP_DOWNLOAD_BASE_URL || 'https://downloads.clarkchat.com/desktop' }}
  CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN: ${{ vars.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN || 'arn:aws:iam::293723385520:role/clark-desktop-downloads-prod-upload' }}
  CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID: ${{ vars.CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # One native runner per OS — cross-compiling a Tauri app isn't viable.
        # macOS: one signed + notarized universal build. Windows: NSIS + MSI
        # (unsigned — SmartScreen warns). Linux: .deb + .rpm + .AppImage. Each
        # leg uploads its installers under canonical ClarkCode.* names; the
        # updater latest.json is macOS-only (keyed on the .app.tar.gz.sig).
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin --config src-tauri/tauri.release.conf.json"
            bundle-target: "universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--config src-tauri/tauri.release.conf.json"
            bundle-target: "x86_64-unknown-linux-gnu"
            rust-targets: ""
          - platform: windows-latest
            args: "--config src-tauri/tauri.release.conf.json"
            bundle-target: "x86_64-pc-windows-msvc"
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Tauri v2 build deps (webkit2gtk-4.1 + ayatana appindicator).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile

      - name: Stage verified bundled tools
        shell: bash
        run: |
          python3 scripts/stage-bundled-tools.py --target "${{ matrix.bundle-target }}"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          "src-tauri/binaries/rg-${{ matrix.bundle-target }}${suffix}" --version

      - name: Install WebKit smoke dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          pnpm --dir harness install --frozen-lockfile
          pnpm --dir harness exec playwright install webkit

      - name: Smoke production frontend in WebKit
        if: matrix.platform == 'macos-latest'
        run: |
          pnpm --dir app build
          pnpm --dir harness test:webkit

      - name: Build + publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization. tauri-action only acts on these on
          # the macOS leg, and only when APPLE_CERTIFICATE is non-empty, so they
          # are inert on Windows/Linux and the build falls back to unsigned if the
          # secrets are ever removed. Identity: Developer ID Application: Clark
          # Labs Inc. (TZWY28WKAP); notarization via the admin@ Apple ID's
          # app-specific password.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Auto-update signing: the Ed25519 key whose public half is pinned in
          # tauri.conf.json. tauri-action signs the updater bundle (.app.tar.gz)
          # with it and emits the .sig that goes into latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Native (Tauri) Google sign-in — the "Desktop app" OAuth client.
          # `beforeBuildCommand` (pnpm --dir ../app build) runs as a child of
          # this step, and Vite bakes VITE_-prefixed env vars into the
          # frontend bundle at build time. Without these, every packaged
          # release showed "Set VITE_GOOGLE_DESKTOP_CLIENT_ID to enable
          # Google sign-in" instead of a working button — real customers
          # were completely locked out (Google is the only sign-in method).
          # The secret is a non-confidential installed-app secret per
          # Google's own OAuth-for-native-apps model (it ships inside the
          # distributed binary either way); the Clark backend separately
          # trusts this exact client id's audience via its own
          # GOOGLE_DESKTOP_CLIENT_ID server config.
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clark Code ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform from the assets below.

            **macOS** builds are signed with our Apple Developer ID (Clark Labs
            Inc.) and notarized by Apple — drag Clark Code into Applications
            and open it, no Gatekeeper workaround needed.

            **Windows** SmartScreen may warn on the unsigned installer. Click
            **More info → Run anyway**.

            **Linux** — `.AppImage` (portable, `chmod +x` and run), `.deb`
            (Debian/Ubuntu), or `.rpm` (Fedora/RHEL).
          # Each matrix leg uploads into the same draft release; the `publish`
          # job below flips it public only after every platform has uploaded.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Configure AWS credentials for public download upload
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish installers + updater manifest to the downloads CDN
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          bucket="${CLARK_DESKTOP_DOWNLOAD_BUCKET}"
          base_url="${CLARK_DESKTOP_DOWNLOAD_BASE_URL%/}"
          records_dir="public-release-records"
          mkdir -p "$records_dir"
          IMM="public, max-age=31536000, immutable"

          # macOS runners ship bash 3.2 (no `mapfile`), so read into the array
          # with a portable loop.
          # Only files under a tauri `bundle/` dir are installers — scope to it so
          # a Windows build's many stray *.exe (build scripts, the raw binary)
          # never get picked up.
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(
            find target -type f -path "*/bundle/*" \( \
              -name "*.dmg" -o \
              -name "*.msi" -o \
              -name "*.exe" -o \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.rpm" -o \
              -name "*.app.tar.gz" \
            \) | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installer assets found under target" >&2
            exit 1
          fi

          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }

          content_type_for() {
            case "$1" in
              *.dmg) echo "application/x-apple-diskimage" ;;
              *.msi) echo "application/x-msi" ;;
              *.exe) echo "application/vnd.microsoft.portable-executable" ;;
              *.AppImage) echo "application/octet-stream" ;;
              *.deb) echo "application/vnd.debian.binary-package" ;;
              *.rpm) echo "application/x-rpm" ;;
              *.app.tar.gz) echo "application/gzip" ;;
              *) echo "application/octet-stream" ;;
            esac
          }

          # Stable, human-facing CDN names — what clarkchat.com/download and the
          # in-app updater link to — independent of tauri's versioned bundle
          # filenames. Used for BOTH the versioned and the latest/ keys so the two
          # never diverge (the bug that forced a manual publish through v0.1.6).
          canonical_for() {
            case "$1" in
              *.dmg) echo "ClarkCode.dmg" ;;
              *.app.tar.gz) echo "ClarkCode.app.tar.gz" ;;
              *x64-setup.exe) echo "ClarkCode_x64-setup.exe" ;;
              *.msi) echo "ClarkCode_x64_en-US.msi" ;;
              *.AppImage) echo "ClarkCode_amd64.AppImage" ;;
              *.deb) echo "ClarkCode_amd64.deb" ;;
              *.rpm) echo "ClarkCode_x86_64.rpm" ;;
              *) basename "$1" ;;
            esac
          }

          # The .app.tar.gz is the updater payload, not a user download, so it is
          # published but kept out of the download-page manifest.
          in_download_manifest() {
            case "$1" in *.app.tar.gz) return 1 ;; *) return 0 ;; esac
          }

          jsonl="$(mktemp)"
          for file in "${files[@]}"; do
            canonical="$(canonical_for "$file")"
            size="$(wc -c < "$file" | tr -d '[:space:]')"
            sha="$(sha256_file "$file")"
            content_type="$(content_type_for "$file")"

            aws s3 cp "$file" "s3://$bucket/desktop/releases/$tag/$canonical" \
              --content-type "$content_type" \
              --cache-control "$IMM" \
              --metadata "sha256=$sha,clark-version=$tag"
            aws s3 cp "$file" "s3://$bucket/desktop/latest/$canonical" \
              --content-type "$content_type" \
              --cache-control "public, max-age=300" \
              --metadata "sha256=$sha,clark-version=$tag"

            if in_download_manifest "$file"; then
              node -e '
                const [name, url, size, sha] = process.argv.slice(1);
                console.log(JSON.stringify({
                  name,
                  browser_download_url: url,
                  size: Number(size),
                  digest: `sha256:${sha}`,
                }));
              ' "$canonical" "$base_url/releases/$tag/$canonical" "$size" "$sha" >> "$jsonl"
            fi
          done

          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(process.argv[1], "utf8").trim().split(/\n+/).filter(Boolean);
            const assets = lines.map((line) => JSON.parse(line));
            fs.writeFileSync(process.argv[2], JSON.stringify(assets, null, 2) + "\n");
          ' "$jsonl" "$records_dir/assets-${RUNNER_OS}.json"

          # Per-platform updater fragment for cross-platform auto-update. Each OS
          # only produces its own updater artifact + detached .sig, so no single
          # leg can write the whole latest.json — this emits just this leg's
          # platform entries and the publish job merges all three. Map each
          # updater artifact's .sig → its tauri platform key(s) + canonical CDN
          # url (macOS: universal .app.tar.gz for both arches; Windows: the NSIS
          # -setup.exe; Linux: the .AppImage). tauri.conf.json's updater endpoint
          # is desktop/latest/latest.json.
          find_sig() { find target -type f -path "*/bundle/*" -name "$1" | head -1; }
          mac_sig="$(find_sig '*.app.tar.gz.sig')"
          win_sig="$(find_sig '*-setup.exe.sig')"
          linux_sig="$(find_sig '*.AppImage.sig')"
          node -e '
            const fs = require("fs");
            const [base, macSig, winSig, linuxSig, out] = process.argv.slice(1);
            const read = (p) => (p ? fs.readFileSync(p, "utf8").trim() : "");
            const platforms = {};
            if (macSig) {
              const e = { signature: read(macSig), url: `${base}/latest/ClarkCode.app.tar.gz` };
              platforms["darwin-aarch64"] = e;
              platforms["darwin-x86_64"] = e;
            }
            if (winSig) {
              platforms["windows-x86_64"] = { signature: read(winSig), url: `${base}/latest/ClarkCode_x64-setup.exe` };
            }
            if (linuxSig) {
              platforms["linux-x86_64"] = { signature: read(linuxSig), url: `${base}/latest/ClarkCode_amd64.AppImage` };
            }
            fs.writeFileSync(out, JSON.stringify({ platforms }, null, 2) + "\n");
          ' "$base_url" "$mac_sig" "$win_sig" "$linux_sig" "$records_dir/updater-${RUNNER_OS}.json"

      - name: Upload public download asset records
        uses: actions/upload-artifact@v4
        with:
          name: desktop-download-records-${{ matrix.platform }}
          path: public-release-records/*.json
          if-no-files-found: error

  # Publish the draft once all platform builds have uploaded their installers,
  # so no public manifest points at an incomplete platform set.
  publish:
    # Also wait for exec-server: publishing flips the GH release public AND
    # writes the aggregated latest.json (the auto-update trigger), so it must
    # not run until the per-arch clark-exec-server prebuilts are on the CDN.
    # Otherwise a freshly-updated app can hit "not on the CDN for v<version>"
    # when connecting to a remote host before those binaries finish uploading.
    needs: [build, exec-server]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false --latest

      - name: Configure AWS credentials for public manifest upload
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download public download asset records
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-download-records-*
          path: release-records
          merge-multiple: true

      - name: Publish public download manifest
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          bucket="${CLARK_DESKTOP_DOWNLOAD_BUCKET}"
          base_url="${CLARK_DESKTOP_DOWNLOAD_BASE_URL%/}"
          manifest="$(mktemp)"

          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = process.argv[1];
            const tag = process.argv[2];
            const baseUrl = process.argv[3].replace(/\/$/, "");
            const assetsByName = new Map();
            for (const file of fs.readdirSync(root).filter((name) => name.startsWith("assets-") && name.endsWith(".json")).sort()) {
              const records = JSON.parse(fs.readFileSync(path.join(root, file), "utf8"));
              for (const asset of records) assetsByName.set(asset.name, asset);
            }
            const assets = [...assetsByName.values()].sort((a, b) => a.name.localeCompare(b.name));
            const manifest = {
              tag_name: tag,
              version: tag.replace(/^v/, ""),
              generated_at: new Date().toISOString(),
              base_url: baseUrl,
              assets,
            };
            fs.writeFileSync(process.argv[4], JSON.stringify(manifest, null, 2) + "\n");
          ' release-records "$tag" "$base_url" "$manifest"

          aws s3 cp "$manifest" "s3://$bucket/desktop/releases/$tag/manifest.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "$manifest" "s3://$bucket/desktop/latest/manifest.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=60"

          # Merge every leg's updater fragment into one cross-platform latest.json
          # (the updater endpoint pinned in tauri.conf.json). This is what lets
          # Windows + Linux (AppImage) auto-update, not just macOS.
          latest="$(mktemp)"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const [root, tag, repo, out] = process.argv.slice(1);
            const platforms = {};
            for (const f of fs.readdirSync(root).filter((n) => n.startsWith("updater-") && n.endsWith(".json"))) {
              const frag = JSON.parse(fs.readFileSync(path.join(root, f), "utf8"));
              Object.assign(platforms, frag.platforms || {});
            }
            const doc = {
              version: tag.replace(/^v/, ""),
              notes: `See the release notes at https://github.com/${repo}/releases/tag/${tag}`,
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync(out, JSON.stringify(doc, null, 2) + "\n");
          ' release-records "$tag" "$GITHUB_REPOSITORY" "$latest"

          aws s3 cp "$latest" "s3://$bucket/desktop/latest/latest.json" \
            --content-type "application/json" --cache-control "public, max-age=60"
          aws s3 cp "$latest" "s3://$bucket/desktop/releases/$tag/latest.json" \
            --content-type "application/json" --cache-control "public, max-age=31536000, immutable"

          if [ -n "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" \
              --paths "/desktop/latest/*"
          fi

  # The remote-projects feature (SSH) fetches a per-arch clark-exec-server from
  # the CDN onto the remote host. Build all four targets on one macOS runner
  # (cargo-zigbuild for the static Linux musl binaries, native for darwin) and
  # publish them under exec-server/<tag>/ — see scripts/publish-exec-server.sh
  # and src-tauri/src/ssh.rs `fetch_from_cdn`.
  exec-server:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install zig + cargo-zigbuild
        run: |
          brew install zig
          cargo install cargo-zigbuild --locked
      - name: Build clark-exec-server for all targets
        run: |
          cargo zigbuild --release -p exec-server --bin clark-exec-server \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          cargo build --release -p exec-server --bin clark-exec-server \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish to the downloads CDN
        run: ./scripts/publish-exec-server.sh "${{ github.ref_name }}"

# The public download page lives in clark-ui (clarkchat.com/download) and
# resolves public CDN assets via https://downloads.clarkchat.com/desktop/latest/manifest.json.
