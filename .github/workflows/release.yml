name: Release

# Builds native installers for macOS, Windows, and Linux on GitHub's native
# runners (cross-compiling a Tauri app from one OS to the others is not viable),
# publishes immutable binaries and mutable platform pointers to Clark-owned
# download hosting. GitHub Releases are deliberately not a release dependency:
# the public installer source of truth is clarkchat.com/clark-code. A candidate
# runs from exact main, and the stable tag is created only after public
# verification succeeds.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semver already declared in Cargo and Tauri metadata
        required: true
        type: string
      run_paid_benchmark:
        description: Run the separately authorized managed Qwen 3.7 Flash benchmark
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: clark-desktop-release-candidate
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  CLARK_RELEASE_TAG: ${{ format('v{0}', inputs.version) }}
  CLARK_SCIENTIST_RELEASE_REF: ${{ vars.CLARK_SCIENTIST_RELEASE_REF || '' }}
  CLARK_AUTORESEARCH_RELEASE_REF: ${{ vars.CLARK_AUTORESEARCH_RELEASE_REF || '' }}
  # Rust's MSVC target dynamically links vcruntime by default. The app and its
  # private helpers must also start on a clean Windows profile, before any
  # machine-wide VC++ redistributable has been installed.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
  CLARK_DESKTOP_DOWNLOAD_BUCKET: ${{ vars.CLARK_DESKTOP_DOWNLOAD_BUCKET || 'clark-desktop-downloads-prod' }}
  CLARK_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.CLARK_DESKTOP_DOWNLOAD_BASE_URL || 'https://downloads.clarkchat.com/desktop' }}
  CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN: ${{ vars.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN || 'arn:aws:iam::293723385520:role/clark-desktop-downloads-prod-upload' }}
  CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID: ${{ vars.CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID || '' }}
  # Clark's Authenticode private key is held by Azure Artifact Signing and is
  # never exported as a PFX. These public identity coordinates are deliberately
  # separate from the OIDC application credentials below.
  AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net' }}
  AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT || 'clarkcodesigning' }}
  AZURE_ARTIFACT_SIGNING_RESOURCE_GROUP: ${{ vars.AZURE_ARTIFACT_SIGNING_RESOURCE_GROUP || '' }}
  AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE || '' }}
  CLARK_WINDOWS_SIGNER_SUBJECT: ${{ vars.CLARK_WINDOWS_SIGNER_SUBJECT || '' }}
  CLARK_WINDOWS_QA_BASE_VM: Clark QA - Windows 11 ARM
  CLARK_WINDOWS_QA_VM_NAME: Clark QA Release ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  release_source_prerequisites:
    name: Release source and download-channel preflight
    runs-on: ubuntu-latest
    # Every platform shares this protected deployment identity for source,
    # updater-key, and downloads-CDN validation. Windows publisher validation is
    # deliberately isolated below: an external verification delay must not hold
    # back signed macOS or Linux installers.
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require exact mainline source, bundle version, and shared release identities
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Release candidates must run from main, got $GITHUB_REF_TYPE/$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release source revision is not one exact Git commit" >&2
            exit 1
          fi
          if [[ ! "$CLARK_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be exact semver, got $CLARK_RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$CLARK_SCIENTIST_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CLARK_SCIENTIST_RELEASE_REF must pin one exact clark-scientist commit" >&2
            exit 1
          fi
          if [[ ! "$CLARK_AUTORESEARCH_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CLARK_AUTORESEARCH_RELEASE_REF must pin one exact clark-autoresearch commit" >&2
            exit 1
          fi
          declared_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [[ "$declared_version" != "${CLARK_RELEASE_TAG#v}" ]]; then
            echo "Release candidate $CLARK_RELEASE_TAG does not match bundle version $declared_version" >&2
            exit 1
          fi
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Release source is not the exact current origin/main revision" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$CLARK_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Stable release tag already exists: $CLARK_RELEASE_TAG" >&2
            exit 1
          fi
          for name in \
            CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required before macOS or Linux release work can start" >&2
              exit 1
            fi
          done

      - name: Prove the pinned Clark Scientist source is accessible
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: clark-labs-inc/clark-scientist
          ref: ${{ env.CLARK_SCIENTIST_RELEASE_REF }}
          path: target/release-source-preflight/clark-scientist
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          persist-credentials: false

      - name: Prove the pinned Clark Autoresearch source is accessible
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: clark-labs-inc/clark-autoresearch
          ref: ${{ env.CLARK_AUTORESEARCH_RELEASE_REF }}
          path: target/release-source-preflight/clark-autoresearch
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          persist-credentials: false

      - name: Verify the exact private worker source revisions
        shell: bash
        run: |
          set -euo pipefail
          scientist_actual="$(git -C target/release-source-preflight/clark-scientist rev-parse HEAD)"
          if [[ "$scientist_actual" != "$CLARK_SCIENTIST_RELEASE_REF" ]]; then
            echo "Clark Scientist checkout resolved $scientist_actual, expected $CLARK_SCIENTIST_RELEASE_REF" >&2
            exit 1
          fi
          autoresearch_actual="$(git -C target/release-source-preflight/clark-autoresearch rev-parse HEAD)"
          if [[ "$autoresearch_actual" != "$CLARK_AUTORESEARCH_RELEASE_REF" ]]; then
            echo "Clark Autoresearch checkout resolved $autoresearch_actual, expected $CLARK_AUTORESEARCH_RELEASE_REF" >&2
            exit 1
          fi
          locked_source="source = \"git+https://github.com/clark-labs-inc/clark-autoresearch?rev=9312395#$CLARK_AUTORESEARCH_RELEASE_REF\""
          if ! grep -Fqx "$locked_source" target/release-source-preflight/clark-scientist/Cargo.lock; then
            echo "Clark Scientist does not lock the selected Clark Autoresearch revision" >&2
            exit 1
          fi

      - name: Authenticate the release workload with AWS OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the exact CDN upload account and record the source boundary
        shell: bash
        run: |
          set -euo pipefail
          role="$CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN"
          if [[ ! "$role" =~ ^arn:aws:iam::([0-9]{12}):role/.+$ ]]; then
            echo "CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN is not an IAM role ARN" >&2
            exit 1
          fi
          expected_account="${BASH_REMATCH[1]}"
          identity="$(aws sts get-caller-identity --output json)"
          actual_account="$(jq -r '.Account' <<<"$identity")"
          if [[ "$actual_account" != "$expected_account" ]]; then
            echo "AWS OIDC authenticated the wrong CDN upload account" >&2
            exit 1
          fi
          mkdir -p target/release-source-preflight
          jq -n \
            --arg source_revision "$GITHUB_SHA" \
            --arg scientist_revision "$CLARK_SCIENTIST_RELEASE_REF" \
            --arg autoresearch_revision "$CLARK_AUTORESEARCH_RELEASE_REF" \
            --arg aws_account "$actual_account" \
            --arg aws_arn "$(jq -r '.Arn' <<<"$identity")" \
            '{schema_version: 1, status: "passed", source_revision: $source_revision, scientist_revision: $scientist_revision, autoresearch_revision: $autoresearch_revision, aws_account: $aws_account, aws_arn: $aws_arn}' \
            > target/release-source-preflight/receipt.json

      - name: Upload shared release preflight receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-preflight
          path: target/release-source-preflight/receipt.json
          if-no-files-found: error
          retention-days: 90

  windows_release_prerequisites:
    name: Windows publisher identity preflight (signed mode only)
    needs: [release_source_prerequisites]
    if: ${{ vars.CLARK_WINDOWS_RELEASE_MODE == 'signed' }}
    runs-on: windows-2022
    # This is intentionally a Windows-only release gate. Microsoft or Azure
    # verification must never gate the independently signed macOS/Linux lanes.
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the Windows signing identity coordinates
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            AZURE_ARTIFACT_SIGNING_RESOURCE_GROUP = $env:AZURE_ARTIFACT_SIGNING_RESOURCE_GROUP
            AZURE_ARTIFACT_SIGNING_PROFILE = $env:AZURE_ARTIFACT_SIGNING_PROFILE
            CLARK_WINDOWS_SIGNER_SUBJECT = $env:CLARK_WINDOWS_SIGNER_SUBJECT
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "$($entry.Key) is required before Windows release work can start"
            }
          }

      - name: Authenticate the Windows release workload with Azure OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install and bind the official Artifact Signing client
        shell: pwsh
        run: |
          scripts/prepare-windows-artifact-signing.ps1 `
            -Endpoint $env:AZURE_ARTIFACT_SIGNING_ENDPOINT `
            -AccountName $env:AZURE_ARTIFACT_SIGNING_ACCOUNT `
            -ResourceGroup $env:AZURE_ARTIFACT_SIGNING_RESOURCE_GROUP `
            -CertificateProfileName $env:AZURE_ARTIFACT_SIGNING_PROFILE `
            -ExpectedSignerSubject $env:CLARK_WINDOWS_SIGNER_SUBJECT `
            -CorrelationId "release-windows-preflight-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"

      - name: Sign and verify a disposable PE through the production boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path target/artifact-signing | Out-Null
          $probe = (Resolve-Path target/artifact-signing).Path + "\clark-signing-probe.exe"
          Add-Type `
            -TypeDefinition 'public static class Program { public static int Main() { return 0; } }' `
            -OutputAssembly $probe `
            -OutputType ConsoleApplication
          src-tauri/sign-windows-artifact.ps1 -FilePath $probe
          $signature = Get-AuthenticodeSignature -LiteralPath $probe
          if (
            $signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
            $signature.SignerCertificate.Subject -ne $env:CLARK_WINDOWS_SIGNER_SUBJECT
          ) {
            throw "Artifact Signing returned the wrong Clark publisher identity"
          }
          @{
            schema_version = 1
            status = "passed"
            source_revision = $env:GITHUB_SHA
            signer_subject = $signature.SignerCertificate.Subject
            signer_thumbprint = $signature.SignerCertificate.Thumbprint
          } |
            ConvertTo-Json |
            Set-Content -LiteralPath target/artifact-signing/preflight-receipt.json -Encoding utf8

      - name: Upload Windows publisher preflight receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-identity-preflight
          path: target/artifact-signing/preflight-receipt.json
          if-no-files-found: error

  windows_utm_runner_preflight:
    name: UAC-enabled Windows UTM runner preflight (signed mode only)
    needs: [windows_release_prerequisites]
    runs-on: [self-hosted, macOS, ARM64, clark-utm-qa]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Start and verify the exact Windows 11 QA guest
        run: |
          node harness/utm-real-use.mjs \
            --platform windows \
            --ensure-started \
            --require-pristine \
            --out target/windows-release-runner-preflight

      - name: Upload Windows runner readiness receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-runner-preflight
          path: target/windows-release-runner-preflight
          if-no-files-found: error

      - name: Stop the verified pristine base before cloning
        run: |
          node harness/utm-windows-release-vm.mjs \
            --action prepare-base \
            --base "$CLARK_WINDOWS_QA_BASE_VM"

  release_source_ci:
    name: Exact source CI gate
    needs: [release_source_prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require successful CI for the exact mainline source revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 25 * 60))
          while (( SECONDS < deadline )); do
            runs="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci.yml \
                --commit "$GITHUB_SHA" \
                --event push \
                --limit 10 \
                --json databaseId,status,conclusion,headSha,event,url
            )"
            exact_run="$(
              jq -c --arg sha "$GITHUB_SHA" \
                '[.[] | select(.headSha == $sha and .event == "push")]
                 | sort_by(.databaseId)
                 | last // empty' \
                <<<"$runs"
            )"
            if [[ -n "$exact_run" ]]; then
              run_state="$(jq -r '.status' <<<"$exact_run")"
              run_url="$(jq -r '.url' <<<"$exact_run")"
              if [[ "$run_state" == "completed" ]]; then
                run_conclusion="$(jq -r '.conclusion' <<<"$exact_run")"
                if [[ "$run_conclusion" == "success" ]]; then
                  echo "Exact source CI passed: $run_url"
                  exit 0
                fi
                echo "Exact source CI concluded $run_conclusion: $run_url" >&2
                exit 1
              fi
              echo "Waiting for exact source CI ($run_state): $run_url"
            else
              echo "Waiting for the main push CI run for $GITHUB_SHA"
            fi
            sleep 15
          done
          echo "Timed out waiting for successful CI on $GITHUB_SHA" >&2
          exit 1

  pre_release_benchmarks:
    name: Deterministic pre-release contracts benchmark
    needs: [release_source_prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Pin the external fixture so a release is reproducible. Override the
      # repository variable deliberately when validating a newer Superpowers
      # revision; never float this release gate on upstream main.
      - name: Checkout pinned Superpowers benchmark fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: obra/superpowers
          ref: ${{ vars.CLARK_SUPERPOWERS_BENCHMARK_REF || 'd884ae04edebef577e82ff7c4e143debd0bbec99' }}
          path: benchmark-fixtures/superpowers

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          # This benchmark expands the full desktop target plus Chromium. A
          # cache-save post step can exhaust the hosted runner after every
          # contract has passed, so restore the cache but never save it here.
          save-if: false

      - name: Install native host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxcb1-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            clang \
            build-essential \
            pkg-config

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            harness/pnpm-lock.yaml
      - name: Install benchmark UI dependencies
        run: |
          pnpm --dir app install --frozen-lockfile
          pnpm --dir harness install --frozen-lockfile
          pnpm --dir harness exec playwright install --with-deps chromium

      - name: Run release-blocking benchmark
        shell: bash
        run: |
          ./scripts/run-pre-release-benchmarks.sh \
            --out target/pre-release-benchmarks/release \
            --superpowers "$GITHUB_WORKSPACE/benchmark-fixtures/superpowers" \
            --delegate-native-host \
            --delegate-ui-resilience \
            --offline

      - name: Upload benchmark receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pre-release-benchmark
          path: target/pre-release-benchmarks/release
          if-no-files-found: warn

  # The Tauri host test binary is a second full native dependency graph. Keep
  # it on a clean runner so linking it cannot exhaust the consolidated Rust and
  # frontend benchmark runner after those contracts have already passed.
  native_host_benchmark:
    name: Native host release benchmark
    needs: [release_source_prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: false
      - name: Install native host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxcb1-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            clang \
            build-essential \
            pkg-config
      - name: Run native desktop contracts
        shell: bash
        run: |
          mkdir -p target/native-host-benchmark
          set -o pipefail
          cargo test -p clark-desktop --lib 2>&1 \
            | tee target/native-host-benchmark/native-host-contracts.log
      - name: Upload native host benchmark receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-host-benchmark
          path: target/native-host-benchmark
          if-no-files-found: error

  # Browser fault simulation has its own runner so native Rust compilation
  # cannot exhaust the disk Chromium needs for profiles and renderer state.
  # It runs alongside the contract suite and remains an independent publication
  # gate rather than weakening or retrying the browser evidence.
  ui_resilience_benchmark:
    name: UI resilience release benchmark
    needs: [release_source_prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            harness/pnpm-lock.yaml
      - name: Install UI resilience dependencies
        run: |
          pnpm --dir app install --frozen-lockfile
          pnpm --dir harness install --frozen-lockfile
          pnpm --dir harness exec playwright install --with-deps chromium
      - name: Run isolated UI resilience sample
        run: |
          node harness/resilience-benchmark.mjs \
            --smoke \
            --out=target/ui-resilience/release
      - name: Upload UI resilience receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-resilience-benchmark
          path: target/ui-resilience/release
          if-no-files-found: warn

  paid_release_benchmark:
    name: Managed Qwen 3.7 Flash release benchmark (opt-in; macOS sandbox)
    needs: [release_source_prerequisites]
    # Model execution is opt-in and never spends provider credits merely because
    # a release candidate was dispatched. It remains available as a separately
    # authorized release-environment check from workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_paid_benchmark }}
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CLARK_CODE_PROVIDER: ${{ vars.CLARK_CODE_PRERELEASE_PROVIDER || 'clark-platform' }}
      CLARK_CODE_BASE_URL: ${{ vars.CLARK_CODE_PRERELEASE_BASE_URL || 'https://api.clarkslabs.com/v1' }}
      CLARK_CODE_MODEL: qwen/qwen3.7-flash
      CLARK_CODE_API_KEY: ${{ secrets.CLARK_CODE_PRERELEASE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      # The live provider-local scenarios execute model-authored filesystem and
      # shell tools. GitHub's Linux runners block bubblewrap UID namespaces, so
      # this gate runs under the real macOS Seatbelt backend instead of
      # weakening containment or granting host execution.
      - name: Install Clark Code tool dependencies
        run: brew install ripgrep

      - name: Run managed Qwen 3.7 Flash live Clark Code scenarios
        run: |
          node harness/feature-matrix.mjs \
            --live-only \
            --platform macos \
            --out target/pre-release-benchmarks/paid

      - name: Upload paid benchmark receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paid-release-benchmark
          path: target/pre-release-benchmarks/paid
          if-no-files-found: warn

  build:
    needs: [release_source_prerequisites, remote-code-worker]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One native runner per OS — cross-compiling a Tauri app isn't viable.
        # macOS: one signed + notarized universal build. Windows: a per-user
        # NSIS installer; `CLARK_WINDOWS_RELEASE_MODE=signed` restores the
        # Authenticode/UTM gate once Microsoft verification is complete. We intentionally do not ship an MSI:
        # its machine-wide installation model adds an avoidable UAC prompt.
        # Linux: .deb + .rpm + .AppImage. Each
        # leg uploads its installers under canonical ClarkCode.* names and an
        # updater fragment. The serialized metadata job merges all platforms.
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.sandbox.macos.conf.json --config src-tauri/tauri.computer-use.macos.conf.json --config src-tauri/tauri.remote-workers.dev.conf.json"
            bundle-target: "universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            windows_signing: false
          - platform: ubuntu-22.04
            args: "--config src-tauri/tauri.release.conf.json --config src-tauri/tauri.sandbox.linux.conf.json --config src-tauri/tauri.remote-workers.dev.conf.json"
            bundle-target: "x86_64-unknown-linux-gnu"
            rust-targets: ""
            windows_signing: false
          # VS 2022 is the release ABI baseline. Do not follow the moving
          # `windows-latest` alias onto a newer MSVC runtime implicitly.
          - platform: windows-2022
            args: "--bundles nsis --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.sandbox.windows.conf.json --config src-tauri/tauri.remote-workers.dev.conf.json"
            bundle-target: "x86_64-pc-windows-msvc"
            rust-targets: ""
            windows_signing: ${{ vars.CLARK_WINDOWS_RELEASE_MODE == 'signed' }}
    runs-on: ${{ matrix.platform }}
    # Keep every native package in the same protected release deployment. The
    # Windows leg consumes Azure only when its explicit signed mode is enabled.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download shared remote Linux coding workers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: remote-code-workers-linux-x86_64
          path: src-tauri/binaries

      - name: Verify shared remote Linux coding worker artifacts
        shell: bash
        run: |
          ordinary="src-tauri/binaries/clark-code-worker-x86_64-unknown-linux-musl"
          scientist="src-tauri/binaries/clark-code-headless-x86_64-unknown-linux-musl"
          chmod 0755 "$ordinary" "$scientist"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ordinary_result="$("$ordinary" --self-test)"
            jq -e '.status == "passed" and .worker == "clark-code-worker" and .protocol_version == 2' <<<"$ordinary_result"
            scientist_result="$("$scientist" --self-test)"
            jq -e '.status == "passed" and .worker == "clark-code-headless" and .protocol_version == 1 and .specialist_count == 2' <<<"$scientist_result"
          else
            for worker in "$ordinary" "$scientist"; do
              magic="$(od -An -tx1 -N4 "$worker" | tr -d '[:space:]')"
              if [[ "$magic" != "7f454c46" ]]; then
                echo "expected Linux ELF worker artifact at $worker; found magic $magic" >&2
                exit 1
              fi
            done
          fi

      - name: Checkout exact Clark Scientist worker source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: clark-labs-inc/clark-scientist
          ref: ${{ env.CLARK_SCIENTIST_RELEASE_REF }}
          path: vendor/clark-scientist
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout exact Clark Autoresearch dependency source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: clark-labs-inc/clark-autoresearch
          ref: ${{ env.CLARK_AUTORESEARCH_RELEASE_REF }}
          path: vendor/clark-autoresearch
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          persist-credentials: false
          # Cargo resolves Scientist's pinned Git dependency through this local
          # checkout. A depth-1 repository rejects Cargo's refs/commit update
          # even when the requested revision is the checked-out commit.
          fetch-depth: 0

      - name: Bind Clark Scientist to this exact Clark Code source (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/clark-scientist rev-parse HEAD)" = "$CLARK_SCIENTIST_RELEASE_REF"
          test "$(git -C vendor/clark-autoresearch rev-parse HEAD)" = "$CLARK_AUTORESEARCH_RELEASE_REF"
          ln -s "$GITHUB_WORKSPACE" vendor/clark-desktop

      - name: Bind Clark Scientist to this exact Clark Code source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git -C vendor/clark-scientist rev-parse HEAD) -ne $env:CLARK_SCIENTIST_RELEASE_REF) {
            throw "Clark Scientist checkout does not match the pinned release revision"
          }
          if ((git -C vendor/clark-autoresearch rev-parse HEAD) -ne $env:CLARK_AUTORESEARCH_RELEASE_REF) {
            throw "Clark Autoresearch checkout does not match the pinned release revision"
          }
          New-Item `
            -ItemType Junction `
            -Path vendor/clark-desktop `
            -Target $env:GITHUB_WORKSPACE | Out-Null

      - name: Require the isolated Windows publisher preflight
        if: runner.os == 'Windows' && matrix.windows_signing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $deadline = (Get-Date).AddMinutes(20)
          do {
            $response = gh api `
              "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100" |
              ConvertFrom-Json
            $preflight = @($response.jobs | Where-Object {
              $_.name -eq "Windows publisher identity preflight (signed mode only)"
            }) | Select-Object -First 1
            if ($preflight -and $preflight.status -eq "completed") {
              if ($preflight.conclusion -eq "success") {
                Write-Host "Windows publisher preflight passed"
                exit 0
              }
              throw "Windows publisher preflight concluded $($preflight.conclusion); Windows packaging is intentionally blocked"
            }
            Start-Sleep -Seconds 15
          } while ((Get-Date) -lt $deadline)
          throw "Timed out waiting for the isolated Windows publisher preflight"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"

      - name: Refresh Clark Scientist lock for the exact Desktop source
        shell: bash
        run: |
          bash scripts/refresh-scientist-lock.sh \
            --source "$GITHUB_WORKSPACE/vendor/clark-scientist" \
            --autoresearch-source "$GITHUB_WORKSPACE/vendor/clark-autoresearch"

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Tauri v2 build deps (webkit2gtk-4.1 + ayatana appindicator).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            build-essential \
            file \
            patchelf \
            meson \
            ninja-build \
            pkg-config \
            libcap-dev

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile

      - name: Stage verified bundled tools
        shell: bash
        run: |
          if [ "${{ matrix.bundle-target }}" = "universal-apple-darwin" ]; then
            # Tauri's universal build compiles each architecture separately
            # before merging, so each inner build needs its own sidecar.
            python3 scripts/stage-bundled-tools.py --target aarch64-apple-darwin
            python3 scripts/stage-bundled-tools.py --target x86_64-apple-darwin
            bash scripts/stage-computer-use-helper.sh --target aarch64-apple-darwin --profile release
            bash scripts/stage-computer-use-helper.sh --target x86_64-apple-darwin --profile release
            bash scripts/stage-computer-use-helper.sh --target universal-apple-darwin --profile release
            bash scripts/stage-scientist-worker.sh \
              --source "$GITHUB_WORKSPACE/vendor/clark-scientist" \
              --autoresearch-source "$GITHUB_WORKSPACE/vendor/clark-autoresearch" \
              --target aarch64-apple-darwin \
              --profile release
            bash scripts/stage-scientist-worker.sh \
              --source "$GITHUB_WORKSPACE/vendor/clark-scientist" \
              --autoresearch-source "$GITHUB_WORKSPACE/vendor/clark-autoresearch" \
              --target x86_64-apple-darwin \
              --profile release
            bash scripts/stage-scientist-worker.sh \
              --source "$GITHUB_WORKSPACE/vendor/clark-scientist" \
              --autoresearch-source "$GITHUB_WORKSPACE/vendor/clark-autoresearch" \
              --target universal-apple-darwin \
              --profile release
          fi

          python3 scripts/stage-bundled-tools.py --target "${{ matrix.bundle-target }}"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          "src-tauri/binaries/rg-${{ matrix.bundle-target }}${suffix}" --version
          if [ "${{ runner.os }}" = "Linux" ]; then
            "src-tauri/binaries/bwrap-${{ matrix.bundle-target }}" --version
          fi
          if [ "${{ runner.os }}" != "macOS" ]; then
            bash scripts/stage-portable-computer-use-service.sh \
              --target "${{ matrix.bundle-target }}" \
              --profile release
            bash scripts/stage-scientist-worker.sh \
              --source "$GITHUB_WORKSPACE/vendor/clark-scientist" \
              --autoresearch-source "$GITHUB_WORKSPACE/vendor/clark-autoresearch" \
              --target "${{ matrix.bundle-target }}" \
              --profile release
          fi

      - name: Stage standalone Clark TUI and paired specialist worker
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-cli-release.sh \
            --target "${{ matrix.bundle-target }}" \
            --profile release

      - name: Install WebKit smoke dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          pnpm --dir harness install --frozen-lockfile
          pnpm --dir harness exec playwright install webkit

      - name: Add MSVC tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) {
            throw "Visual Studio C++ tools were not found"
          }
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          $dumpbin.Directory.FullName >> $env:GITHUB_PATH

      - name: Authenticate the Windows build with Azure OIDC
        if: runner.os == 'Windows' && matrix.windows_signing
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install and bind the official Artifact Signing client
        if: runner.os == 'Windows' && matrix.windows_signing
        shell: pwsh
        run: |
          scripts/prepare-windows-artifact-signing.ps1 `
            -Endpoint $env:AZURE_ARTIFACT_SIGNING_ENDPOINT `
            -AccountName $env:AZURE_ARTIFACT_SIGNING_ACCOUNT `
            -ResourceGroup $env:AZURE_ARTIFACT_SIGNING_RESOURCE_GROUP `
            -CertificateProfileName $env:AZURE_ARTIFACT_SIGNING_PROFILE `
            -ExpectedSignerSubject $env:CLARK_WINDOWS_SIGNER_SUBJECT `
            -CorrelationId "release-build-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"

      - name: Build private Windows sandbox helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p exec-sandbox-windows --bins
          $windowsHelpers = @(
            "target/release/clark-command-runner.exe",
            "target/release/clark-windows-sandbox-setup.exe"
          )
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop
          foreach ($helper in $windowsHelpers) {
            $imports = (& $dumpbin.Source /dependents $helper | Out-String)
            if ($imports -match '(?im)^\s*(?:vcruntime|msvcp)[^\s]*\.dll\s*$') {
              throw "Clean-machine runtime invariant failed; $helper imports a VC++ runtime DLL:`n$imports"
            }
          }
          Copy-Item target/release/clark-command-runner.exe src-tauri/binaries/clark-command-runner-x86_64-pc-windows-msvc.exe
          Copy-Item target/release/clark-windows-sandbox-setup.exe src-tauri/binaries/clark-windows-sandbox-setup-x86_64-pc-windows-msvc.exe
          src-tauri/binaries/clark-command-runner-x86_64-pc-windows-msvc.exe --self-test
          src-tauri/binaries/clark-windows-sandbox-setup-x86_64-pc-windows-msvc.exe --self-test

      - name: Require native containment for signed Windows releases
        if: runner.os == 'Windows' && matrix.windows_signing
        shell: pwsh
        run: |
          node harness/windows-native-containment.mjs `
            --runner target/release/clark-command-runner.exe `
            --setup target/release/clark-windows-sandbox-setup.exe `
            --source-revision $env:GITHUB_SHA `
            --out "$env:RUNNER_TEMP/clark-windows-native-containment-$env:GITHUB_RUN_ID"

      - name: Upload signed-mode native Windows containment receipt
        if: runner.os == 'Windows' && matrix.windows_signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-native-containment
          path: ${{ runner.temp }}/clark-windows-native-containment-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90

      - name: Sign every bundled Windows executable before packaging
        if: runner.os == 'Windows' && matrix.windows_signing
        shell: pwsh
        run: |
          $executables = @(
            "src-tauri/binaries/rg-x86_64-pc-windows-msvc.exe"
            "src-tauri/binaries/clark-command-runner-x86_64-pc-windows-msvc.exe"
            "src-tauri/binaries/clark-windows-sandbox-setup-x86_64-pc-windows-msvc.exe"
            "src-tauri/binaries/clark-computer-use-helper-x86_64-pc-windows-msvc.exe"
            "src-tauri/binaries/clark-code-headless-x86_64-pc-windows-msvc.exe"
            "target/clark-cli-release/x86_64-pc-windows-msvc/package/bin/clark.exe"
            "target/clark-cli-release/x86_64-pc-windows-msvc/package/bin/clark-code-headless.exe"
          )
          foreach ($executable in $executables) {
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Windows bundled executable is missing: $executable"
            }
            src-tauri/sign-windows-artifact.ps1 -FilePath $executable
            $signature = Get-AuthenticodeSignature -LiteralPath $executable
            if (
              $signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
              $signature.SignerCertificate.Subject -ne $env:CLARK_WINDOWS_SIGNER_SUBJECT
            ) {
              throw "Bundled executable did not retain the Clark release signature: $executable"
            }
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_RELEASE_SIGNER_THUMBPRINT)) {
              "WINDOWS_RELEASE_SIGNER_THUMBPRINT=$($signature.SignerCertificate.Thumbprint)" >> $env:GITHUB_ENV
              $env:WINDOWS_RELEASE_SIGNER_THUMBPRINT = $signature.SignerCertificate.Thumbprint
            } elseif (
              $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_RELEASE_SIGNER_THUMBPRINT
            ) {
              throw "Bundled executable was signed by a different Artifact Signing certificate: $executable"
            }
          }

      - name: Smoke production frontend in WebKit
        if: matrix.platform == 'macos-latest'
        run: |
          pnpm --dir app build
          pnpm --dir harness test:webkit

      - name: Import Apple Developer ID for nested Computer Use service
        id: macos_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for secret_name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::$secret_name is required for every macOS release"
              exit 1
            fi
          done
          certificate_dir="$(mktemp -d "$RUNNER_TEMP/clark-apple-certificate.XXXXXX")"
          certificate_path="$certificate_dir/cert.p12"
          keychain_path="$RUNNER_TEMP/clark-release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() { rm -f "$certificate_path"; rmdir "$certificate_dir"; }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path" \
            || printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F -- "$APPLE_SIGNING_IDENTITY" > /dev/null
          echo "signing_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Sign standalone macOS Clark TUI and paired worker
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          package_bin="target/clark-cli-release/universal-apple-darwin/package/bin"
          for executable in "$package_bin/clark" "$package_bin/clark-code-headless"; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$executable"
            codesign --verify --strict --verbose=2 "$executable"
          done

      # Omitting tauri-action's tag/release inputs selects its build-only mode.
      # The action then produces bundles and updater signatures without calling
      # the GitHub Releases API; the custom records below publish the exact
      # same bytes to Clark-owned download hosting.
      - name: Build installers (signed macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Auto-update signing: the Ed25519 key whose public half is pinned in
          # tauri.conf.json. tauri-action signs the updater bundle (.app.tar.gz)
          # with it and emits the .sig that goes into latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Native (Tauri) Google sign-in — the "Desktop app" OAuth client.
          # Rust embeds these in the native host. They are deliberately not
          # VITE-prefixed and therefore never enter the WebView bundle.
          # The secret is a non-confidential installed-app secret per
          # Google's own OAuth-for-native-apps model (it ships inside the
          # distributed binary either way); the Clark backend separately
          # trusts this exact client id's audience via its own
          # GOOGLE_DESKTOP_CLIENT_ID server config.
          CLARK_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          CLARK_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          args: ${{ matrix.windows_signing && format('{0} --config src-tauri/tauri.windows-signing.conf.json', matrix.args) || matrix.args }}

      - name: Build installers (non-macOS)
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Auto-update signing: the Ed25519 key whose public half is pinned in
          # tauri.conf.json. tauri-action signs the updater bundle (.app.tar.gz)
          # with it and emits the .sig that goes into latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Native (Tauri) Google sign-in — the "Desktop app" OAuth client.
          CLARK_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          CLARK_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          args: ${{ matrix.windows_signing && format('{0} --config src-tauri/tauri.windows-signing.conf.json', matrix.args) || matrix.args }}

      - name: Package standalone Clark TUI
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-cli-release.sh --target "${{ matrix.bundle-target }}"

      - name: Notarize and staple final macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for secret_name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::$secret_name is required to notarize every macOS release"
              exit 1
            fi
          done
          dmg="$(find target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          test -n "$dmg"
          # Tauri notarizes and staples the app before it creates the signed
          # DMG. The outer disk image must be notarized separately so Gatekeeper
          # can validate the downloaded installer before mounting it.
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          cli_archive="target/clark-cli-release/universal-apple-darwin/clark-universal-apple-darwin.zip"
          test -s "$cli_archive"
          xcrun notarytool submit "$cli_archive" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          # `spctl --type open` does not assess a disk image directly on
          # current macOS runners (it reports "Insufficient Context" even
          # after a successful staple). Assess the mounted app instead while
          # `stapler validate` proves the outer DMG ticket.
          dmg_mount="$(mktemp -d)"
          dmg_mounted=0
          cleanup_dmg_mount() {
            if [ "$dmg_mounted" -eq 1 ]; then
              hdiutil detach "$dmg_mount" >/dev/null || true
            fi
          }
          trap cleanup_dmg_mount EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$dmg_mount" "$dmg" >/dev/null
          dmg_mounted=1
          app="$(find "$dmg_mount" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          hdiutil detach "$dmg_mount" >/dev/null
          dmg_mounted=0
          # The custom public-download step runs after notarization, so the
          # immutable CDN asset is the final stapled installer.

      - name: Verify packaged macOS runtime layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(find target -type d -path '*/bundle/macos/*.app' -print -quit)"
          test -n "$app"
          python3 scripts/verify-bundled-layout.py \
            --platform macos \
            --resource-root "$app/Contents/Resources" \
            --executable-dir "$app/Contents/MacOS"
          service="$app/Contents/Resources/Clark Computer Use.app"
          helper="$service/Contents/MacOS/clark-computer-use-helper"
          otool -l "$helper" | grep -A2 -F 'path @executable_path/../Frameworks'
          # Every macOS release has a Developer ID-signed Computer Use service.
          "$helper" --self-test
          "$app/Contents/MacOS/clark-code-headless" --self-test

      - name: Verify signed macOS Computer Use service identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(find target -type d -path '*/bundle/macos/*.app' -print -quit)"
          test -n "$app"
          service="$app/Contents/Resources/Clark Computer Use.app"
          update_probe_root="$(mktemp -d)"
          previous_service="$update_probe_root/Clark Computer Use.app"
          ditto "$service" "$previous_service"
          plutil -replace CFBundleVersion -string 999999 \
            "$previous_service/Contents/Info.plist"
          codesign \
            --force \
            --options runtime \
            --timestamp=none \
            --sign "Developer ID Application: Clark Labs Inc. (TZWY28WKAP)" \
            "$previous_service"
          scripts/verify-computer-use-service-identity.sh \
            --service-app "$service" \
            --previous-app "$previous_service" \
            --expected-id com.clark.computer-use \
            --expected-team TZWY28WKAP
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/clark-desktop" --computer-use-signed-smoke

      - name: Verify packaged Linux runtime layout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$(find target -type f -path '*/bundle/deb/*.deb' -print -quit)"
          test -n "$deb"
          extracted="$(mktemp -d)"
          dpkg-deb --extract "$deb" "$extracted"
          path_dir="$(find "$extracted/usr/lib" -type d -name clark-path -print -quit)"
          test -n "$path_dir"
          python3 scripts/verify-bundled-layout.py \
            --platform linux \
            --resource-root "$(dirname "$path_dir")" \
            --executable-dir "$extracted/usr/bin" \
            --staged-bwrap src-tauri/binaries/bwrap-x86_64-unknown-linux-gnu
          service="$(dirname "$path_dir")/clark-resources/computer-use/clark-computer-use-helper"
          "$service" --self-test
          "$extracted/usr/bin/clark-code-headless" --self-test

      - name: Verify packaged Windows runtime layout
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING: ${{ matrix.windows_signing }}
        run: |
          $nsis = Get-ChildItem target -Recurse -File -Filter *-setup.exe |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1
          if (-not $nsis) { throw "packaged NSIS installer was not found" }
          $installerSignature = Get-AuthenticodeSignature -LiteralPath $nsis.FullName
          if ($env:WINDOWS_SIGNING -eq "true") {
            if (
              $installerSignature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
              $installerSignature.SignerCertificate.Subject -ne $env:CLARK_WINDOWS_SIGNER_SUBJECT -or
              $installerSignature.SignerCertificate.Thumbprint -ne $env:WINDOWS_RELEASE_SIGNER_THUMBPRINT
            ) {
              throw "NSIS installer is not signed by the Clark release identity"
            }
          } elseif ($installerSignature.Status -ne [Management.Automation.SignatureStatus]::NotSigned) {
            throw "Windows preview must not claim an unexpected publisher identity"
          }
          $unexpectedMsi = Get-ChildItem target -Recurse -File -Filter *.msi |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]msi[\\/]' }
          if ($unexpectedMsi) { throw "Windows release must not publish an elevation-prone MSI" }

          # Exercise the actual user-facing artifact. A per-machine installer
          # would block here on UAC; bound the wait so that fails closed instead
          # of hanging the release job.
          $installRoot = Join-Path $env:RUNNER_TEMP "clark-nsis-smoke"
          $install = Start-Process $nsis.FullName -ArgumentList @("/S", "/D=$installRoot") -PassThru
          if (-not $install.WaitForExit(120000)) {
            Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
            throw "NSIS installation timed out (possible unexpected elevation prompt)"
          }
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed with $($install.ExitCode)" }

          python scripts/verify-bundled-layout.py `
            --platform windows `
            --resource-root $installRoot `
            --executable-dir $installRoot

          $packagedExecutables = @(
            Join-Path $installRoot "clark-desktop.exe"
            Join-Path $installRoot "clark-path/rg.exe"
            Join-Path $installRoot "clark-resources/sandbox/windows/clark-command-runner.exe"
            Join-Path $installRoot "clark-resources/sandbox/windows/clark-windows-sandbox-setup.exe"
            Join-Path $installRoot "clark-resources/computer-use/clark-computer-use-helper.exe"
            Join-Path $installRoot "clark-code-headless.exe"
          )
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop
          foreach ($executable in $packagedExecutables) {
            if (-not (Test-Path $executable -PathType Leaf)) {
              throw "Expected installed executable is missing: $executable"
            }
            $imports = (& $dumpbin.Source /dependents $executable | Out-String)
            if ($imports -match '(?im)^\s*(?:vcruntime|msvcp)[^\s]*\.dll\s*$') {
              throw "Packaged executable imports a VC++ runtime DLL: ${executable}`n$imports"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $executable
            if ($env:WINDOWS_SIGNING -eq "true") {
              if (
                $signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
                $signature.SignerCertificate.Subject -ne $env:CLARK_WINDOWS_SIGNER_SUBJECT -or
                $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_RELEASE_SIGNER_THUMBPRINT
              ) {
                throw "Packaged executable is not signed by the Clark release identity: $executable"
              }
            }
          }

          $expectedVersion = $env:CLARK_RELEASE_TAG -replace '^v', ''
          $installedVersion = (
            Get-Item -LiteralPath (Join-Path $installRoot "clark-desktop.exe")
          ).VersionInfo.ProductVersion
          if ($installedVersion -ne $expectedVersion) {
            throw "Packaged executable version $installedVersion does not match $expectedVersion"
          }
          if ($env:WINDOWS_SIGNING -eq "true") {
            $buildReceiptRoot = "target/windows-release-build"
            New-Item -ItemType Directory -Force -Path $buildReceiptRoot | Out-Null
            @{
              schema_version = 1
              receipt_type = "clark_code_windows_release_build"
              status = "passed"
              source_revision = $env:GITHUB_SHA
              tag = $env:CLARK_RELEASE_TAG
              version = $expectedVersion
              signer_subject = $installerSignature.SignerCertificate.Subject
              signer_thumbprint = $installerSignature.SignerCertificate.Thumbprint
              artifact = @{
                asset = "ClarkCode_x64-setup.exe"
                url = (
                  $env:CLARK_DESKTOP_DOWNLOAD_BASE_URL.TrimEnd("/") +
                  "/releases/$($env:CLARK_RELEASE_TAG)/ClarkCode_x64-setup.exe"
                )
                sha256 = (
                  Get-FileHash -Algorithm SHA256 -LiteralPath $nsis.FullName
                ).Hash.ToLowerInvariant()
                size = (Get-Item -LiteralPath $nsis.FullName).Length
              }
            } |
              ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath "$buildReceiptRoot/receipt.json" -Encoding utf8
          }

          & (Join-Path $installRoot "clark-resources/sandbox/windows/clark-command-runner.exe") --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows sandbox runner self-test failed" }
          & (Join-Path $installRoot "clark-resources/sandbox/windows/clark-windows-sandbox-setup.exe") --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows sandbox setup self-test failed" }
          & (Join-Path $installRoot "clark-resources/computer-use/clark-computer-use-helper.exe") --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows Computer Use service self-test failed" }
          & (Join-Path $installRoot "clark-code-headless.exe") --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows Clark Scientist worker self-test failed" }

          $app = Start-Process (Join-Path $installRoot "clark-desktop.exe") -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) {
            throw "Installed Clark Code exited during startup with $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id -Force

          $uninstall = Start-Process (Join-Path $installRoot "uninstall.exe") -ArgumentList "/S" -PassThru
          if (-not $uninstall.WaitForExit(120000)) {
            Stop-Process -Id $uninstall.Id -Force -ErrorAction SilentlyContinue
            throw "NSIS uninstall timed out"
          }
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed with $($uninstall.ExitCode)" }

      - name: Generate platform SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          artifact-name: release-sbom-${{ matrix.platform }}
          output-file: target/release-sbom-${{ runner.os }}.spdx.json
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

      - name: Attest macOS installers and updater payload
        if: runner.os == 'macOS'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/macos/*.app.tar.gz
            target/clark-cli-release/universal-apple-darwin/*.zip
          sbom-path: target/release-sbom-macOS.spdx.json

      - name: Attest Windows installer
        if: runner.os == 'Windows'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: |
            target/**/bundle/nsis/*-setup.exe
            target/clark-cli-release/x86_64-pc-windows-msvc/*.zip
          sbom-path: target/release-sbom-Windows.spdx.json

      - name: Attest Linux installers and updater payload
        if: runner.os == 'Linux'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: |
            target/**/bundle/appimage/*.AppImage
            target/**/bundle/deb/*.deb
            target/**/bundle/rpm/*.rpm
            target/clark-cli-release/x86_64-unknown-linux-gnu/*.tar.gz
          sbom-path: target/release-sbom-Linux.spdx.json

      - name: Upload exact Windows release candidate for packaged journey
        if: runner.os == 'Windows' && matrix.windows_signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release-candidate
          path: target/**/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload source-bound Windows release build receipt
        if: runner.os == 'Windows' && matrix.windows_signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release-build-receipt
          path: target/windows-release-build/receipt.json
          if-no-files-found: error

      - name: Configure AWS credentials for public download upload
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish installers + updater manifest to the downloads CDN
        shell: bash
        run: |
          set -euo pipefail

          tag="${CLARK_RELEASE_TAG}"
          version="${tag#v}"
          bucket="${CLARK_DESKTOP_DOWNLOAD_BUCKET}"
          base_url="${CLARK_DESKTOP_DOWNLOAD_BASE_URL%/}"
          records_dir="public-release-records"
          mkdir -p "$records_dir"
          IMM="public, max-age=31536000, immutable"

          # macOS runners ship bash 3.2 (no `mapfile`), so read into the array
          # with a portable loop.
          # Only files under a tauri `bundle/` dir are installers — scope to it so
          # a Windows build's many stray *.exe (build scripts, the raw binary)
          # never get picked up.
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(
            find target -type f -path "*/bundle/*" \( \
              -name "*.dmg" -o \
              -name "*.exe" -o \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.rpm" -o \
              -name "*.app.tar.gz" \
            \) | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installer assets found under target" >&2
            exit 1
          fi

          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }

          content_type_for() {
            case "$1" in
              *.dmg) echo "application/x-apple-diskimage" ;;
              *.exe) echo "application/vnd.microsoft.portable-executable" ;;
              *.AppImage) echo "application/octet-stream" ;;
              *.deb) echo "application/vnd.debian.binary-package" ;;
              *.rpm) echo "application/x-rpm" ;;
              *.app.tar.gz) echo "application/gzip" ;;
              *) echo "application/octet-stream" ;;
            esac
          }

          # Stable, human-facing filenames under an immutable version directory.
          # The download manifest and updater latest.json point to these exact
          # keys. The serialized publish job copies only user-download installers
          # to latest/; updater payloads remain immutable and versioned.
          canonical_for() {
            case "$1" in
              *.dmg) echo "ClarkCode.dmg" ;;
              *.app.tar.gz) echo "ClarkCode.app.tar.gz" ;;
              *x64-setup.exe) echo "ClarkCode_x64-setup.exe" ;;
              *.AppImage) echo "ClarkCode_amd64.AppImage" ;;
              *.deb) echo "ClarkCode_amd64.deb" ;;
              *.rpm) echo "ClarkCode_x86_64.rpm" ;;
              *) basename "$1" ;;
            esac
          }

          # The .app.tar.gz is the updater payload, not a user download, so it is
          # published but kept out of the download-page manifest.
          in_download_manifest() {
            case "$1" in *.app.tar.gz) return 1 ;; *) return 0 ;; esac
          }

          verify_immutable_head() {
            node --input-type=module -e '
              import fs from "node:fs";
              import { validateS3HeadObject } from "./harness/public-release-journey.mjs";
              const [headFile, tag, sha256, size, contentType, cacheControl] =
                process.argv.slice(1);
              validateS3HeadObject(JSON.parse(fs.readFileSync(headFile, "utf8")), {
                tag,
                sha256,
                size: Number(size),
                contentType,
                cacheControl,
                sourceRevision: process.env.GITHUB_SHA,
              });
            ' "$1" "$tag" "$2" "$3" "$4" "$IMM"
          }

          put_immutable() {
            file="$1"
            key="$2"
            sha="$3"
            size="$4"
            content_type="$5"
            head_json="$(mktemp)"
            head_error="$(mktemp)"

            if aws s3api head-object \
              --bucket "$bucket" \
              --key "$key" \
              >"$head_json" 2>"$head_error"; then
              verify_immutable_head "$head_json" "$sha" "$size" "$content_type"
              echo "Reusing byte-identical immutable object s3://$bucket/$key"
              return
            fi
            if ! grep -Eq '(^|[^0-9])404([^0-9]|$)|Not Found|NoSuchKey' "$head_error"; then
              cat "$head_error" >&2
              echo "Could not establish absence of immutable object s3://$bucket/$key" >&2
              exit 1
            fi

            if ! aws s3api put-object \
              --bucket "$bucket" \
              --key "$key" \
              --body "$file" \
              --if-none-match '*' \
              --content-type "$content_type" \
              --cache-control "$IMM" \
              --metadata "sha256=$sha,clark-version=$tag,source-revision=$GITHUB_SHA" \
              >/dev/null; then
              # A concurrent identical release job may have won the conditional
              # create. It is safe only if the resulting object is byte-for-byte
              # and metadata-identical to this build.
              aws s3api head-object \
                --bucket "$bucket" \
                --key "$key" \
                >"$head_json"
              verify_immutable_head "$head_json" "$sha" "$size" "$content_type"
            fi
            aws s3api head-object \
              --bucket "$bucket" \
              --key "$key" \
              >"$head_json"
            verify_immutable_head "$head_json" "$sha" "$size" "$content_type"
          }

          jsonl="$(mktemp)"
          for file in "${files[@]}"; do
            canonical="$(canonical_for "$file")"
            size="$(wc -c < "$file" | tr -d '[:space:]')"
            sha="$(sha256_file "$file")"
            content_type="$(content_type_for "$file")"

            put_immutable \
              "$file" \
              "desktop/releases/$tag/$canonical" \
              "$sha" \
              "$size" \
              "$content_type"

            if in_download_manifest "$file"; then
              node -e '
                const [name, url, size, sha] = process.argv.slice(1);
                console.log(JSON.stringify({
                  name,
                  browser_download_url: url,
                  size: Number(size),
                  digest: `sha256:${sha}`,
                }));
              ' "$canonical" "$base_url/releases/$tag/$canonical" "$size" "$sha" >> "$jsonl"
            fi
          done

          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(process.argv[1], "utf8").trim().split(/\n+/).filter(Boolean);
            const assets = lines.map((line) => JSON.parse(line));
            fs.writeFileSync(process.argv[2], JSON.stringify(assets, null, 2) + "\n");
          ' "$jsonl" "$records_dir/assets-${RUNNER_OS}.json"

          cli_archive="$(find "target/clark-cli-release/${{ matrix.bundle-target }}" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          if [ -z "$cli_archive" ]; then
            echo "Standalone Clark CLI archive is missing for ${{ matrix.bundle-target }}" >&2
            exit 1
          fi
          cli_name="$(basename "$cli_archive")"
          cli_sha="$(sha256_file "$cli_archive")"
          cli_size="$(wc -c < "$cli_archive" | tr -d '[:space:]')"
          case "$cli_name" in
            *.zip) cli_content_type="application/zip" ;;
            *.tar.gz) cli_content_type="application/gzip" ;;
            *) echo "Unexpected Clark CLI archive: $cli_name" >&2; exit 1 ;;
          esac
          put_immutable \
            "$cli_archive" \
            "desktop/cli/releases/$tag/$cli_name" \
            "$cli_sha" \
            "$cli_size" \
            "$cli_content_type"
          node -e '
            const fs = require("fs");
            const [target, name, url, size, sha, out] = process.argv.slice(1);
            fs.writeFileSync(out, JSON.stringify({
              target,
              name,
              url,
              size: Number(size),
              sha256: sha,
            }, null, 2) + "\n");
          ' \
            "${{ matrix.bundle-target }}" \
            "$cli_name" \
            "$base_url/cli/releases/$tag/$cli_name" \
            "$cli_size" \
            "$cli_sha" \
            "$records_dir/cli-${RUNNER_OS}.json"

          # Per-platform updater fragment for cross-platform auto-update. Each OS
          # only produces its own updater artifact + detached .sig, so no single
          # leg can write the whole latest.json — this emits just this leg's
          # platform entries and the publish job merges all three. Map each
          # updater artifact's .sig → its tauri platform key(s) + immutable,
          # versioned CDN URL (macOS: universal .app.tar.gz for both arches;
          # Windows: the NSIS -setup.exe; Linux: the .AppImage).
          # New clients resolve target-specific documents under
          # desktop/latest/updater/; the full channel also retains legacy
          # latest.json for older installed clients.
          find_sig() { find target -type f -path "*/bundle/*" -name "$1" | head -1; }
          mac_sig="$(find_sig '*.app.tar.gz.sig')"
          win_sig="$(find_sig '*-setup.exe.sig')"
          linux_sig="$(find_sig '*.AppImage.sig')"
          node -e '
            const fs = require("fs");
            const [base, tag, macSig, winSig, linuxSig, out] = process.argv.slice(1);
            const read = (p) => (p ? fs.readFileSync(p, "utf8").trim() : "");
            const releaseBase = `${base}/releases/${tag}`;
            const platforms = {};
            if (macSig) {
              const e = { signature: read(macSig), url: `${releaseBase}/ClarkCode.app.tar.gz` };
              platforms["darwin-aarch64"] = e;
              platforms["darwin-x86_64"] = e;
            }
            if (winSig) {
              platforms["windows-x86_64"] = { signature: read(winSig), url: `${releaseBase}/ClarkCode_x64-setup.exe` };
            }
            if (linuxSig) {
              platforms["linux-x86_64"] = { signature: read(linuxSig), url: `${releaseBase}/ClarkCode_amd64.AppImage` };
            }
            fs.writeFileSync(out, JSON.stringify({ platforms }, null, 2) + "\n");
          ' "$base_url" "$tag" "$mac_sig" "$win_sig" "$linux_sig" "$records_dir/updater-${RUNNER_OS}.json"

      - name: Upload public download asset records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-download-records-${{ matrix.platform }}
          path: public-release-records/*.json
          if-no-files-found: error

      - name: Publish immutable Windows candidate updater channel
        if: runner.os == 'Windows' && matrix.windows_signing
        shell: bash
        run: |
          set -euo pipefail
          tag="${CLARK_RELEASE_TAG}"
          bucket="${CLARK_DESKTOP_DOWNLOAD_BUCKET}"
          base_url="${CLARK_DESKTOP_DOWNLOAD_BASE_URL%/}"
          published_at="$(
            git show -s --format=%cI "$GITHUB_SHA" |
              node -e 'process.stdin.once("data", (v) => console.log(new Date(String(v).trim()).toISOString()))'
          )"
          out="target/windows-update-candidate"
          node harness/windows-update-candidate.mjs \
            --tag "$tag" \
            --base-url "$base_url" \
            --source-revision "$GITHUB_SHA" \
            --published-at "$published_at" \
            --updater-fragment public-release-records/updater-Windows.json \
            --out "$out"

          manifest="$out/windows-update.json"
          key="desktop/releases/$tag/windows-update.json"
          sha="$(sha256sum "$manifest" | awk '{print $1}')"
          size="$(wc -c < "$manifest" | tr -d '[:space:]')"
          head_json="$(mktemp)"
          head_error="$(mktemp)"
          verify_head() {
            node --input-type=module -e '
              import fs from "node:fs";
              import { validateS3HeadObject } from "./harness/public-release-journey.mjs";
              const [file, tag, sha256, size] = process.argv.slice(1);
              const head = JSON.parse(fs.readFileSync(file, "utf8"));
              validateS3HeadObject(head, {
                tag,
                sha256,
                size: Number(size),
                contentType: "application/json",
                cacheControl: "public, max-age=31536000, immutable",
              });
              if (head.Metadata?.["source-revision"] !== process.env.GITHUB_SHA) {
                throw new Error("Windows update manifest source revision mismatch");
              }
            ' "$head_json" "$tag" "$sha" "$size"
          }

          if aws s3api head-object \
            --bucket "$bucket" --key "$key" \
            >"$head_json" 2>"$head_error"; then
            verify_head
          else
            if ! grep -Eq '(^|[^0-9])404([^0-9]|$)|Not Found|NoSuchKey' "$head_error"; then
              cat "$head_error" >&2
              exit 1
            fi
            if ! aws s3api put-object \
              --bucket "$bucket" \
              --key "$key" \
              --body "$manifest" \
              --if-none-match '*' \
              --content-type "application/json" \
              --cache-control "public, max-age=31536000, immutable" \
              --metadata "sha256=$sha,clark-version=$tag,source-revision=$GITHUB_SHA" \
              >/dev/null; then
              echo "Conditional create raced; accepting only an exact object" >&2
            fi
            aws s3api head-object \
              --bucket "$bucket" --key "$key" >"$head_json"
            verify_head
          fi

      - name: Build signed Windows updater seed
        if: runner.os == 'Windows' && matrix.windows_signing
        shell: pwsh
        env:
          CLARK_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          CLARK_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          cargo tauri build `
            --bundles nsis `
            --config src-tauri/tauri.release.conf.json `
            --config src-tauri/tauri.sandbox.windows.conf.json `
            --config src-tauri/tauri.windows-signing.conf.json `
            --config target/windows-update-candidate/seed-tauri.conf.json
          $seed = Get-ChildItem target -Recurse -File -Filter *0.0.0*-setup.exe |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1
          if (-not $seed) { throw "signed Windows updater seed installer was not built" }
          $signature = Get-AuthenticodeSignature -LiteralPath $seed.FullName
          if (
            $signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
            $signature.SignerCertificate.Subject -ne $env:CLARK_WINDOWS_SIGNER_SUBJECT -or
            $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_RELEASE_SIGNER_THUMBPRINT
          ) {
            throw "Windows updater seed does not share the Clark release identity"
          }
          Copy-Item $seed.FullName target/windows-update-candidate/ClarkCode_update-seed.exe

      - name: Upload signed Windows updater seed
        if: runner.os == 'Windows' && matrix.windows_signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-update-seed
          path: |
            target/windows-update-candidate/ClarkCode_update-seed.exe
            target/windows-update-candidate/receipt.json
          if-no-files-found: error

  windows_packaged_journey:
    name: Clean packaged Windows first-run journey (signed mode only)
    needs: [build, windows_utm_runner_preflight]
    runs-on: [self-hosted, macOS, ARM64, clark-utm-qa]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Create a disposable pristine Windows release VM
        run: |
          node harness/utm-windows-release-vm.mjs \
            --action create-clone \
            --base "$CLARK_WINDOWS_QA_BASE_VM" \
            --clone "$CLARK_WINDOWS_QA_VM_NAME"
      - name: Download native Windows containment receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-native-containment
          path: target/windows-native-containment

      - name: Download signed Windows updater seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-update-seed
          path: target/windows-update-seed

      - name: Download source-bound Windows release build receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-release-build-receipt
          path: target/windows-release-build

      - name: Download the post-upload immutable Windows candidate
        run: |
          node harness/download-release-candidate.mjs \
            --tag "$CLARK_RELEASE_TAG" \
            --base-url "$CLARK_DESKTOP_DOWNLOAD_BASE_URL" \
            --source-revision "$GITHUB_SHA" \
            --build-receipt target/windows-release-build/receipt.json \
            --out target/windows-release-candidate

      - name: Install CDN candidate into a clean UAC-enabled Windows guest
        run: |
          node harness/utm-windows-release-install.mjs \
            --candidate-receipt target/windows-release-candidate/receipt.json \
            --source-revision "$GITHUB_SHA" \
            --out target/windows-release-install

      - name: Verify inline setup, trusted UAC, restart persistence, and no consoles
        run: |
          node harness/utm-windows-release-journey.mjs \
            --install-receipt target/windows-release-install/receipt.json \
            --native-receipt target/windows-native-containment/receipt.json \
            --out target/windows-release-journey

      - name: Verify signed installed update and sandbox persistence
        run: |
          node harness/utm-windows-update-journey.mjs \
            --seed-installer target/windows-update-seed/ClarkCode_update-seed.exe \
            --install-receipt target/windows-release-install/receipt.json \
            --update-candidate-receipt target/windows-update-seed/receipt.json \
            --out target/windows-update-journey

      - name: Upload packaged Windows journey receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-packaged-journey
          path: |
            target/windows-release-install
            target/windows-release-journey
            target/windows-native-containment
            target/windows-release-candidate
            target/windows-release-build
            target/windows-update-seed
            target/windows-update-journey
          if-no-files-found: error

  # Each platform has its own website aliases and updater document. This lane
  # publishes every complete platform build when Windows is intentionally in
  # preview mode, or when Windows signing fails while macOS/Linux pass. It also
  # advances legacy latest.json for installed clients that predate per-target
  # updater documents and manifest.json for legacy website clients. Each
  # mutable document describes precisely the platform artifacts that passed.
  publish_independent_platforms:
    name: Publish independently verified platform downloads
    needs: [build, remote-code-worker, pre_release_benchmarks, native_host_benchmark, ui_resilience_benchmark, release_source_ci]
    if: >-
      ${{ always() && needs.release_source_ci.result == 'success' &&
          needs.pre_release_benchmarks.result == 'success' &&
          needs.native_host_benchmark.result == 'success' &&
          needs.ui_resilience_benchmark.result == 'success' &&
          needs.remote-code-worker.result == 'success' &&
          (needs.build.result == 'success' || needs.build.result == 'failure') &&
          (vars.CLARK_WINDOWS_RELEASE_MODE != 'signed' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: clark-desktop-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - name: Install platform release browser verifier
        run: |
          pnpm --dir harness install --frozen-lockfile
          pnpm --dir harness exec playwright install --with-deps chromium

      - name: Configure AWS credentials for platform download publication
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download complete platform release records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: desktop-download-records-*
          path: release-records
          merge-multiple: true

      - name: Prepare complete platform aliases and legacy/current manifests
        shell: bash
        run: |
          set -euo pipefail
          published_at="$(
            git show -s --format=%cI "$GITHUB_SHA" |
              node -e 'process.stdin.once("data", (v) => console.log(new Date(String(v).trim()).toISOString()))'
          )"
          export RELEASE_PUBLISHED_AT="$published_at"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import {
            PLATFORM_RELEASES,
            createLegacyUpdaterDocument,
            createPlatformDownloadManifest,
            createPlatformUpdaterDocuments,
            platformAliases,
            validatePlatformReleaseAssets,
          } from "./harness/public-release-journey.mjs";

          const root = "release-records";
          const out = "target/independent-platform-release";
          const assetsByName = new Map();
          const updaterFragments = [];
          for (const name of fs.readdirSync(root).sort()) {
            const file = path.join(root, name);
            if (name.startsWith("assets-") && name.endsWith(".json")) {
              for (const asset of JSON.parse(fs.readFileSync(file, "utf8"))) {
                if (assetsByName.has(asset.name)) {
                  throw new Error(`duplicate platform asset: ${asset.name}`);
                }
                assetsByName.set(asset.name, asset);
              }
            }
            if (name.startsWith("updater-") && name.endsWith(".json")) {
              updaterFragments.push(JSON.parse(fs.readFileSync(file, "utf8")));
            }
          }
          const platforms = [];
          for (const platform of Object.keys(PLATFORM_RELEASES)) {
            const aliases = PLATFORM_RELEASES[platform].aliases;
            const found = aliases.filter((alias) => assetsByName.has(alias));
            if (found.length !== 0 && found.length !== aliases.length) {
              throw new Error(`incomplete ${platform} platform artifacts: ${found.join(", ")}`);
            }
            if (found.length === aliases.length) platforms.push(platform);
          }
          if (platforms.length === 0) throw new Error("no complete platform release artifacts were uploaded");
          const aliases = platformAliases(platforms);
          const assets = aliases.map((alias) => assetsByName.get(alias));
          const tag = process.env.CLARK_RELEASE_TAG;
          const baseUrl = process.env.CLARK_DESKTOP_DOWNLOAD_BASE_URL.replace(/\/+$/, "");
          validatePlatformReleaseAssets({
            assets,
            tag,
            baseUrl,
            sourceRevision: process.env.GITHUB_SHA,
            platforms,
          });
          const documents = createPlatformUpdaterDocuments({
            updaterFragments,
            tag,
            baseUrl,
            sourceRevision: process.env.GITHUB_SHA,
            platforms,
            repository: process.env.GITHUB_REPOSITORY,
            publishedAt: process.env.RELEASE_PUBLISHED_AT,
          });
          fs.mkdirSync(path.join(out, "updater"), { recursive: true, mode: 0o700 });
          fs.writeFileSync(path.join(out, "assets.json"), `${JSON.stringify(assets, null, 2)}\n`);
          fs.writeFileSync(path.join(out, "platforms.csv"), `${platforms.join(",")}\n`);
          fs.writeFileSync(
            path.join(out, "aliases.tsv"),
            assets.map((asset) => `${asset.name}\t${asset.digest.slice("sha256:".length)}\t${asset.size}`).join("\n") + "\n",
          );
          const downloadManifest = createPlatformDownloadManifest({
            assets,
            tag,
            baseUrl,
            sourceRevision: process.env.GITHUB_SHA,
            platforms,
            publishedAt: process.env.RELEASE_PUBLISHED_AT,
          });
          fs.writeFileSync(
            path.join(out, "manifest.json"),
            `${JSON.stringify(downloadManifest, null, 2)}\n`,
          );
          const legacyDocument = createLegacyUpdaterDocument({
            updaterDocuments: documents,
            tag,
            baseUrl,
            sourceRevision: process.env.GITHUB_SHA,
            platforms,
          });
          fs.writeFileSync(
            path.join(out, "latest.json"),
            `${JSON.stringify(legacyDocument, null, 2)}\n`,
          );
          for (const [target, document] of Object.entries(documents)) {
            fs.writeFileSync(
              path.join(out, "updater", `${target}.json`),
              `${JSON.stringify(document, null, 2)}\n`,
            );
          }
          NODE

      - name: Promote independent website aliases and manifests
        shell: bash
        run: |
          set -euo pipefail
          tag="$CLARK_RELEASE_TAG"
          bucket="$CLARK_DESKTOP_DOWNLOAD_BUCKET"
          base_url="${CLARK_DESKTOP_DOWNLOAD_BASE_URL%/}"
          release_dir="target/independent-platform-release"
          transaction_dir="$release_dir/transaction"
          backup_prefix="desktop/releases/$tag/_platform-rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$transaction_dir"

          # An older platform lane must never overwrite an independently newer
          # updater document, even when a delayed workflow reaches this lock.
          guard_channel_advance() {
            key="$1"
            current="$(mktemp)"
            current_err="$(mktemp)"
            if aws s3api get-object \
              --bucket "$bucket" \
              --key "$key" \
              "$current" > /dev/null 2>"$current_err"; then
              node --input-type=module -e '
                import fs from "node:fs";
                import { validateChannelAdvance } from "./harness/public-release-journey.mjs";
                const [file, incoming, revision] = process.argv.slice(1);
                validateChannelAdvance(JSON.parse(fs.readFileSync(file, "utf8")), incoming, revision);
              ' "$current" "${tag#v}" "$GITHUB_SHA"
            elif ! grep -Eq "(^|[^0-9])404([^0-9]|$)|Not Found|NoSuchKey" "$current_err"; then
              cat "$current_err" >&2
              exit 1
            fi
          }
          for document in "$release_dir"/updater/*.json; do
            target="$(basename "$document" .json)"
            guard_channel_advance "desktop/latest/updater/$target.json"
          done
          guard_channel_advance "desktop/latest/latest.json"
          guard_channel_advance "desktop/latest/manifest.json"

          : > "$transaction_dir/prior-keys.tsv"
          {
            cut -f1 "$release_dir/aliases.tsv" | sed "s#^#desktop/latest/#"
            for document in "$release_dir"/updater/*.json; do
              printf 'desktop/latest/updater/%s\n' "$(basename "$document")"
            done
            printf 'desktop/latest/latest.json\n'
            printf 'desktop/latest/manifest.json\n'
          } > "$transaction_dir/keys.txt"
          while IFS= read -r key; do
            head="$(mktemp)"
            head_err="$(mktemp)"
            if aws s3api head-object --bucket "$bucket" --key "$key" >"$head" 2>"$head_err"; then
              aws s3api copy-object \
                --bucket "$bucket" \
                --copy-source "$bucket/$key" \
                --key "$backup_prefix/${key#desktop/latest/}" \
                --metadata-directive COPY > /dev/null
              printf 'present\t%s\n' "$key" >> "$transaction_dir/prior-keys.tsv"
            elif grep -Eq "(^|[^0-9])404([^0-9]|$)|Not Found|NoSuchKey" "$head_err"; then
              printf 'absent\t%s\n' "$key" >> "$transaction_dir/prior-keys.tsv"
            else
              cat "$head_err" >&2
              exit 1
            fi
          done < "$transaction_dir/keys.txt"
          touch "$transaction_dir/backup-ready"

          while IFS=$'\t' read -r alias sha size; do
            case "$alias" in
              *.dmg) content_type="application/x-apple-diskimage" ;;
              *.exe) content_type="application/vnd.microsoft.portable-executable" ;;
              *.AppImage) content_type="application/octet-stream" ;;
              *.deb) content_type="application/vnd.debian.binary-package" ;;
              *.rpm) content_type="application/x-rpm" ;;
              *) echo "Unexpected website alias: $alias" >&2; exit 1 ;;
            esac
            aws s3api copy-object \
              --bucket "$bucket" \
              --copy-source "$bucket/desktop/releases/$tag/$alias" \
              --key "desktop/latest/$alias" \
              --content-type "$content_type" \
              --cache-control "public, max-age=300" \
              --metadata-directive REPLACE \
              --metadata "sha256=$sha,clark-version=$tag,source-revision=$GITHUB_SHA" > /dev/null
          done < "$release_dir/aliases.tsv"

          # Legacy website clients discover the current installers through this
          # document. The aliases now point to immutable release objects, so
          # this manifest may safely advance before the updater pointers.
          manifest_sha="$(sha256sum "$release_dir/manifest.json" | awk '{print $1}')"
          aws s3 cp "$release_dir/manifest.json" \
            "s3://$bucket/desktop/latest/manifest.json" \
            --content-type "application/json" \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --metadata "sha256=$manifest_sha,clark-version=$tag,source-revision=$GITHUB_SHA"

          for document in "$release_dir"/updater/*.json; do
            target="$(basename "$document")"
            sha="$(sha256sum "$document" | awk '{print $1}')"
            aws s3 cp "$document" "s3://$bucket/desktop/latest/updater/$target" \
              --content-type "application/json" \
              --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
              --metadata "sha256=$sha,clark-version=$tag,source-revision=$GITHUB_SHA"
          done

          # Legacy clients request this aggregate document. Write it after every
          # target document and installer alias so it remains the atomic update
          # trigger for that installed population.
          legacy_sha="$(sha256sum "$release_dir/latest.json" | awk '{print $1}')"
          aws s3 cp "$release_dir/latest.json" \
            "s3://$bucket/desktop/latest/latest.json" \
            --content-type "application/json" \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --metadata "sha256=$legacy_sha,clark-version=$tag,source-revision=$GITHUB_SHA"

          if [ -n "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" \
              --paths "/desktop/latest/*" > /dev/null
          fi

      - name: Verify website-visible independent platform release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/independent-platform-release"
          confirmations=0
          for _attempt in $(seq 1 24); do
            if node harness/public-release-journey.mjs \
              --tag "$CLARK_RELEASE_TAG" \
              --base-url "$CLARK_DESKTOP_DOWNLOAD_BASE_URL" \
              --site-url "https://www.clarkchat.com/" \
              --source-revision "$GITHUB_SHA" \
              --platforms "$(<"$release_dir/platforms.csv")" \
              --assets "$release_dir/assets.json" \
              --out "$release_dir/journey"; then
              confirmations=$((confirmations + 1))
              if [ "$confirmations" -ge 2 ]; then
                exit 0
              fi
            else
              confirmations=0
            fi
            sleep 5
          done
          echo "Independent platform release did not converge at the public website boundary" >&2
          exit 1

      - name: Record independently verified public release
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              "target/independent-platform-release/publication-receipt.json",
              JSON.stringify({
                schema_version: 1,
                status: "published",
                tag: process.env.CLARK_RELEASE_TAG,
                source_revision: process.env.GITHUB_SHA,
                published_at: new Date().toISOString(),
              }, null, 2) + "\n",
            );
          '

      - name: Restore independent platform pointers after failure
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          transaction_dir="target/independent-platform-release/transaction"
          if [ ! -f "$transaction_dir/backup-ready" ]; then
            echo "No independent platform pointers were mutated"
            exit 0
          fi
          bucket="$CLARK_DESKTOP_DOWNLOAD_BUCKET"
          backup_prefix="desktop/releases/$CLARK_RELEASE_TAG/_platform-rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          while IFS=$'\t' read -r disposition key; do
            case "$disposition" in
              present)
                aws s3api copy-object \
                  --bucket "$bucket" \
                  --copy-source "$bucket/$backup_prefix/${key#desktop/latest/}" \
                  --key "$key" \
                  --metadata-directive COPY > /dev/null
                ;;
              absent)
                aws s3api delete-object --bucket "$bucket" --key "$key" > /dev/null
                ;;
              *) echo "Invalid independent platform rollback disposition: $disposition" >&2; exit 1 ;;
            esac
          done < "$transaction_dir/prior-keys.tsv"
          if [ -n "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" \
              --paths "/desktop/latest/*" > /dev/null
          fi

      - name: Upload independent platform release receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: independent-platform-release
          path: target/independent-platform-release
          if-no-files-found: error

  # Publish the aggregate updater channel once all platform builds have
  # uploaded their installers, so no public manifest points at an incomplete
  # platform set.
  publish:
    # The ordinary worker is a signed package resource, so aggregate publishing
    # waits for its independently verified static build as well as every app.
    needs:
      [build, remote-code-worker, windows_packaged_journey, pre_release_benchmarks, native_host_benchmark, ui_resilience_benchmark, release_source_ci]
    runs-on: [self-hosted, macOS, ARM64, clark-utm-qa]
    environment: release
    concurrency:
      group: clark-desktop-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - name: Install public release browser verifier
        run: |
          pnpm --dir harness install --frozen-lockfile
          pnpm --dir harness exec playwright install chromium

      - name: Configure AWS credentials for public manifest upload
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download public download asset records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: desktop-download-records-*
          path: release-records
          merge-multiple: true

      - name: Download packaged Windows journey receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-packaged-journey
          path: target/windows-packaged-receipts

      - name: Publish public download manifest
        shell: bash
        run: |
          set -euo pipefail

          tag="${CLARK_RELEASE_TAG}"
          bucket="${CLARK_DESKTOP_DOWNLOAD_BUCKET}"
          base_url="${CLARK_DESKTOP_DOWNLOAD_BASE_URL%/}"
          manifest="$(mktemp)"
          pointer_cache="no-store, no-cache, must-revalidate, max-age=0"
          immutable_cache="public, max-age=31536000, immutable"
          published_at="$(
            git show -s --format=%cI "$GITHUB_SHA" |
              node -e 'process.stdin.once("data", (v) => console.log(new Date(String(v).trim()).toISOString()))'
          )"
          if ! [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Release ref must be a stable numeric version tag, got: $tag" >&2
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = process.argv[1];
            const tag = process.argv[2];
            const baseUrl = process.argv[3].replace(/\/$/, "");
            const sourceRevision = process.argv[4];
            const publishedAt = process.argv[5];
            const assetsByName = new Map();
            for (const file of fs.readdirSync(root).filter((name) => name.startsWith("assets-") && name.endsWith(".json")).sort()) {
              const records = JSON.parse(fs.readFileSync(path.join(root, file), "utf8"));
              for (const asset of records) assetsByName.set(asset.name, asset);
            }
            const assets = [...assetsByName.values()].sort((a, b) => a.name.localeCompare(b.name));
            const manifest = {
              tag_name: tag,
              version: tag.replace(/^v/, ""),
              source_revision: sourceRevision,
              generated_at: publishedAt,
              base_url: baseUrl,
              assets,
            };
            fs.writeFileSync(process.argv[6], JSON.stringify(manifest, null, 2) + "\n");
          ' release-records "$tag" "$base_url" "$GITHUB_SHA" "$published_at" "$manifest"

          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          put_immutable_json() {
            file="$1"
            key="$2"
            sha="$(sha256_file "$file")"
            size="$(wc -c < "$file" | tr -d '[:space:]')"
            head_json="$(mktemp)"
            head_error="$(mktemp)"
            verify_json_head() {
              node --input-type=module -e '
                import fs from "node:fs";
                import { validateS3HeadObject } from "./harness/public-release-journey.mjs";
                const [file, tag, sha256, size, revision, cache] = process.argv.slice(1);
                const head = JSON.parse(fs.readFileSync(file, "utf8"));
                validateS3HeadObject(head, {
                  tag,
                  sha256,
                  size: Number(size),
                  contentType: "application/json",
                  cacheControl: cache,
                });
                if (head.Metadata?.["source-revision"] !== revision) {
                  throw new Error("immutable release document source revision mismatch");
                }
              ' "$head_json" "$tag" "$sha" "$size" "$GITHUB_SHA" "$immutable_cache"
            }
            if aws s3api head-object \
              --bucket "$bucket" --key "$key" \
              >"$head_json" 2>"$head_error"; then
              verify_json_head
              return
            fi
            if ! grep -Eq '(^|[^0-9])404([^0-9]|$)|Not Found|NoSuchKey' "$head_error"; then
              cat "$head_error" >&2
              exit 1
            fi
            if ! aws s3api put-object \
              --bucket "$bucket" \
              --key "$key" \
              --body "$file" \
              --if-none-match '*' \
              --content-type "application/json" \
              --cache-control "$immutable_cache" \
              --metadata "sha256=$sha,clark-version=$tag,source-revision=$GITHUB_SHA" \
              >/dev/null; then
              echo "Conditional create raced for $key; accepting only an exact object" >&2
            fi
            aws s3api head-object \
              --bucket "$bucket" --key "$key" >"$head_json"
            verify_json_head
          }
          put_immutable_json "$manifest" "desktop/releases/$tag/manifest.json"

          # Merge every leg's updater fragment into one cross-platform latest.json
          # (the updater endpoint pinned in tauri.conf.json). This is what lets
          # Windows + Linux (AppImage) auto-update, not just macOS.
          latest="$(mktemp)"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const [root, tag, repo, baseUrl, sourceRevision, publishedAt, out] =
              process.argv.slice(1);
            const platforms = {};
            for (const f of fs.readdirSync(root).filter((n) => n.startsWith("updater-") && n.endsWith(".json"))) {
              const frag = JSON.parse(fs.readFileSync(path.join(root, f), "utf8"));
              Object.assign(platforms, frag.platforms || {});
            }
            const expected = ["darwin-aarch64", "darwin-x86_64", "linux-x86_64", "windows-x86_64"];
            for (const platform of expected) {
              if (!platforms[platform]) throw new Error(`Missing updater entry for ${platform}`);
            }
            const releasePrefix = `${baseUrl.replace(/\/$/, "")}/releases/${tag}/`;
            for (const [platform, entry] of Object.entries(platforms)) {
              if (!expected.includes(platform)) throw new Error(`Unexpected updater entry for ${platform}`);
              if (!entry.signature) throw new Error(`Missing updater signature for ${platform}`);
              if (!entry.url.startsWith(releasePrefix)) {
                throw new Error(`Updater URL for ${platform} is not immutable: ${entry.url}`);
              }
            }
            const doc = {
              version: tag.replace(/^v/, ""),
              source_revision: sourceRevision,
              notes: `See the release notes at https://github.com/${repo}/releases/tag/${tag}`,
              pub_date: publishedAt,
              platforms,
            };
            fs.writeFileSync(out, JSON.stringify(doc, null, 2) + "\n");
          ' release-records "$tag" "$GITHUB_REPOSITORY" "$base_url" "$GITHUB_SHA" "$published_at" "$latest"

          # Publish and validate the immutable snapshot first. latest.json is the
          # only mutable updater object and is written last as the atomic pointer.
          put_immutable_json "$latest" "desktop/releases/$tag/latest.json"

          # New desktop builds resolve one updater document per native target,
          # allowing a healthy macOS or Linux lane to advance independently of
          # an unavailable Windows publisher. Keep the legacy aggregate document
          # for already-installed clients that still request latest.json.
          platform_updater_dir="$(mktemp -d)"
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            import { createPlatformUpdaterDocuments } from "./harness/public-release-journey.mjs";
            const [root, out, tag, baseUrl, revision, repository, publishedAt] = process.argv.slice(1);
            const fragments = fs.readdirSync(root)
              .filter((name) => name.startsWith("updater-") && name.endsWith(".json"))
              .sort()
              .map((name) => JSON.parse(fs.readFileSync(path.join(root, name), "utf8")));
            const documents = createPlatformUpdaterDocuments({
              updaterFragments: fragments,
              tag,
              baseUrl,
              sourceRevision: revision,
              platforms: ["macos", "linux", "windows"],
              repository,
              publishedAt,
            });
            for (const [target, document] of Object.entries(documents)) {
              fs.writeFileSync(path.join(out, `${target}.json`), `${JSON.stringify(document, null, 2)}\n`);
            }
          ' release-records "$platform_updater_dir" "$tag" "$base_url" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$published_at"
          for document in "$platform_updater_dir"/*.json; do
            put_immutable_json \
              "$document" \
              "desktop/releases/$tag/updater/$(basename "$document")"
          done

          # Publish jobs are serialized above. Keep this monotonic guard as a
          # second line of defense against a delayed/retried older workflow
          # moving the channel backward after a newer tag is already live.
          current_pointer="$(mktemp)"
          aws s3api get-object \
            --bucket "$bucket" \
            --key "desktop/latest/latest.json" \
            "$current_pointer" \
            >/dev/null
          node --input-type=module -e '
            import fs from "node:fs";
            const { validateChannelAdvance } =
              await import("./harness/public-release-journey.mjs");
            const [file, incoming, incomingRevision] = process.argv.slice(1);
            const document = JSON.parse(fs.readFileSync(file, "utf8"));
            validateChannelAdvance(document, incoming, incomingRevision);
          ' "$current_pointer" "${tag#v}" "$GITHUB_SHA"

          # clarkchat.com intentionally uses stable, no-JS installer links. Move
          # those aliases only after the monotonic version guard and while this
          # publish job holds the serialized release lock. The updater bundle
          # (.app.tar.gz) is absent from the download manifest, so it can never
          # be copied to latest/ and invalidate an older cached signature.
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const expected = new Set([
              "ClarkCode.dmg",
              "ClarkCode_x64-setup.exe",
              "ClarkCode_amd64.AppImage",
              "ClarkCode_amd64.deb",
              "ClarkCode_x86_64.rpm",
            ]);
            if (manifest.assets.length !== expected.size) {
              throw new Error(`Expected ${expected.size} download assets, got ${manifest.assets.length}`);
            }
            for (const asset of manifest.assets) {
              if (!expected.delete(asset.name)) throw new Error(`Unexpected download asset: ${asset.name}`);
              if (!/^sha256:[0-9a-f]{64}$/.test(asset.digest)) {
                throw new Error(`Invalid digest for ${asset.name}`);
              }
              if (!Number.isSafeInteger(asset.size) || asset.size <= 0) {
                throw new Error(`Invalid size for ${asset.name}`);
              }
              process.stdout.write(
                `${asset.name}\t${asset.digest.slice("sha256:".length)}\t${asset.size}\n`,
              );
            }
            if (expected.size) throw new Error(`Missing download assets: ${[...expected].join(", ")}`);
          ' "$manifest" > latest-aliases.tsv

          # S3 has no multi-object transaction. Snapshot the entire mutable
          # channel before the first write so any later browser, packaged-client,
          # or GitHub-release failure can restore one coherent prior generation.
          transaction_dir="target/public-channel-transaction"
          backup_prefix="desktop/releases/$tag/_channel-rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$transaction_dir"
          printf '%s\n' "$backup_prefix" > "$transaction_dir/backup-prefix"
          : > "$transaction_dir/prior-keys.tsv"
          while IFS= read -r key; do
            source_key="desktop/latest/$key"
            if aws s3api head-object \
              --bucket "$bucket" \
              --key "$source_key" \
              >"$transaction_dir/source-head.json" 2>"$transaction_dir/source-head.err"; then
              aws s3api copy-object \
                --bucket "$bucket" \
                --copy-source "$bucket/$source_key" \
                --key "$backup_prefix/$key" \
                --metadata-directive COPY \
                >/dev/null
              aws s3api head-object \
                --bucket "$bucket" \
                --key "$backup_prefix/$key" \
                >"$transaction_dir/backup-head.json"
              node -e '
                const fs = require("fs");
                const [sourcePath, backupPath, key] = process.argv.slice(1);
                const source = JSON.parse(fs.readFileSync(sourcePath, "utf8"));
                const backup = JSON.parse(fs.readFileSync(backupPath, "utf8"));
                for (const field of ["ContentLength", "ContentType", "CacheControl", "ETag"]) {
                  if (source[field] !== backup[field]) {
                    throw new Error(`Rollback snapshot ${key} changed ${field}`);
                  }
                }
                if (source.ChecksumSHA256 &&
                    source.ChecksumSHA256 !== backup.ChecksumSHA256) {
                  throw new Error(`Rollback snapshot ${key} changed ChecksumSHA256`);
                }
                const metadata = (value) => JSON.stringify(
                  Object.fromEntries(Object.entries(value.Metadata || {}).sort()),
                );
                if (metadata(source) !== metadata(backup)) {
                  throw new Error(`Rollback snapshot ${key} changed metadata`);
                }
              ' "$transaction_dir/source-head.json" "$transaction_dir/backup-head.json" "$key"
              cp \
                "$transaction_dir/backup-head.json" \
                "$transaction_dir/backup-$key.head.json"
              printf 'present\t%s\n' "$key" >> "$transaction_dir/prior-keys.tsv"
            elif grep -Eq '(^|[^0-9])404([^0-9]|$)|Not Found|NoSuchKey' \
              "$transaction_dir/source-head.err"; then
              printf 'absent\t%s\n' "$key" >> "$transaction_dir/prior-keys.tsv"
            else
              cat "$transaction_dir/source-head.err" >&2
              exit 1
            fi
          done < <(
            cut -f1 latest-aliases.tsv
            printf '%s\n' latest.json manifest.json
            for document in "$platform_updater_dir"/*.json; do
              printf 'updater/%s\n' "$(basename "$document")"
            done
          )
          [ "$(wc -l < "$transaction_dir/prior-keys.tsv" | tr -d '[:space:]')" -eq 11 ]
          touch "$transaction_dir/backup-ready"

          while IFS=$'\t' read -r alias sha size; do
            case "$alias" in
              *.dmg) content_type="application/x-apple-diskimage" ;;
              *.exe) content_type="application/vnd.microsoft.portable-executable" ;;
              *.AppImage) content_type="application/octet-stream" ;;
              *.deb) content_type="application/vnd.debian.binary-package" ;;
              *.rpm) content_type="application/x-rpm" ;;
              *) echo "Unexpected latest download alias: $alias" >&2; exit 1 ;;
            esac
            aws s3api copy-object \
              --bucket "$bucket" \
              --copy-source "$bucket/desktop/releases/$tag/$alias" \
              --key "desktop/latest/$alias" \
              --content-type "$content_type" \
              --cache-control "public, max-age=300" \
              --metadata-directive REPLACE \
              --metadata "sha256=$sha,clark-version=$tag,source-revision=$GITHUB_SHA" \
              >/dev/null
          done < latest-aliases.tsv

          # The website manifest is written before the updater pointer.
          # latest.json is the final channel mutation and therefore never
          # advertises a generation whose other mutable documents were not
          # already written.
          aws s3 cp "$manifest" "s3://$bucket/desktop/latest/manifest.json" \
            --content-type "application/json" --cache-control "$pointer_cache"
          for document in "$platform_updater_dir"/*.json; do
            doc_sha="$(sha256_file "$document")"
            aws s3 cp "$document" "s3://$bucket/desktop/latest/updater/$(basename "$document")" \
              --content-type "application/json" \
              --cache-control "$pointer_cache" \
              --metadata "sha256=$doc_sha,clark-version=$tag,source-revision=$GITHUB_SHA"
          done
          aws s3 cp "$latest" "s3://$bucket/desktop/latest/latest.json" \
            --content-type "application/json" --cache-control "$pointer_cache"

          if [ -n "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" ]; then
            # The narrowly scoped upload role may create invalidations but
            # cannot read them back. Public CDN convergence below is the
            # client-boundary receipt and does not require GetInvalidation.
            aws cloudfront create-invalidation \
              --distribution-id "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" \
              --paths "/desktop/latest/*" \
              >/dev/null
          fi

          # Do not make the GitHub release public until the CDN repeatedly
          # serves this exact version, every human installer alias has advanced,
          # and updater payload URLs are immutable and versioned.
          observed_cdn="$(mktemp)"
          observed_manifest="$(mktemp)"
          observed_headers="$(mktemp)"
          observed_alias_headers="$(mktemp)"
          observed_platform_updater="$(mktemp)"
          cdn_ready=0
          cdn_confirmations=0
          for _attempt in $(seq 1 24); do
            aliases_ready=1
            while IFS=$'\t' read -r alias sha size; do
              if ! curl -fsSI \
                -H "Cache-Control: no-cache, no-store, max-age=0" \
                -H "Pragma: no-cache" \
                "$base_url/latest/$alias" \
                -o "$observed_alias_headers" ||
                ! tr -d '\r' < "$observed_alias_headers" |
                  grep -Fqi "x-amz-meta-clark-version: $tag" ||
                ! tr -d '\r' < "$observed_alias_headers" |
                  grep -Fqi "x-amz-meta-sha256: $sha" ||
                ! tr -d '\r' < "$observed_alias_headers" |
                  grep -Fqi "content-length: $size"; then
                aliases_ready=0
                break
              fi
            done < latest-aliases.tsv
            platform_updaters_ready=1
            for document in "$platform_updater_dir"/*.json; do
              target="$(basename "$document" .json)"
              if ! curl -fsS \
                -H "Cache-Control: no-cache, no-store, max-age=0" \
                -H "Pragma: no-cache" \
                "$base_url/latest/updater/$target.json" \
                -o "$observed_platform_updater" ||
                ! node --input-type=module -e '
                  import fs from "node:fs";
                  import { validatePlatformUpdaterDocument } from "./harness/public-release-journey.mjs";
                  const [file, target, tag, baseUrl, revision] = process.argv.slice(1);
                  validatePlatformUpdaterDocument({
                    document: JSON.parse(fs.readFileSync(file, "utf8")),
                    target,
                    tag,
                    baseUrl,
                    sourceRevision: revision,
                  });
                ' "$observed_platform_updater" "$target" "$tag" "$base_url" "$GITHUB_SHA"; then
                platform_updaters_ready=0
                break
              fi
            done
            if [ "$aliases_ready" -eq 1 ] && [ "$platform_updaters_ready" -eq 1 ] &&
              curl -fsS \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              -D "$observed_headers" \
              "$base_url/latest/latest.json" \
              -o "$observed_cdn" &&
              curl -fsS \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              "$base_url/latest/manifest.json" \
              -o "$observed_manifest" &&
              tr -d '\r' < "$observed_headers" | grep -qi '^cache-control:.*no-store' &&
              node -e '
                const fs = require("fs");
                const [latestFile, manifestFile, version, revision, prefix] =
                  process.argv.slice(1);
                const doc = JSON.parse(fs.readFileSync(latestFile, "utf8"));
                if (doc.version !== version || doc.source_revision !== revision) process.exit(1);
                const entries = Object.values(doc.platforms || {});
                if (entries.length !== 4 || entries.some((entry) => !entry.url.startsWith(prefix))) {
                  process.exit(1);
                }
                const manifest = JSON.parse(fs.readFileSync(manifestFile, "utf8"));
                if (manifest.version !== version ||
                    manifest.tag_name !== `v${version}` ||
                    manifest.source_revision !== revision) process.exit(1);
                if (manifest.assets?.length !== 5 ||
                    manifest.assets.some((asset) => !asset.browser_download_url.startsWith(prefix))) {
                  process.exit(1);
                }
              ' "$observed_cdn" "$observed_manifest" "${tag#v}" "$GITHUB_SHA" "$base_url/releases/$tag/"; then
              cdn_confirmations=$((cdn_confirmations + 1))
              if [ "$cdn_confirmations" -ge 2 ]; then
                cdn_ready=1
                break
              fi
            else
              cdn_confirmations=0
            fi
            sleep 5
          done
          if [ "$cdn_ready" -ne 1 ]; then
            echo "CDN did not converge on release version ${tag#v} and its installer aliases" >&2
            exit 1
          fi

      - name: Verify rendered public download journey
        run: |
          node harness/public-release-journey.mjs \
            --tag "$CLARK_RELEASE_TAG" \
            --base-url "$CLARK_DESKTOP_DOWNLOAD_BASE_URL" \
            --site-url "https://www.clarkchat.com/" \
            --source-revision "$GITHUB_SHA" \
            --out target/public-release-journey

      - name: Upload public release journey receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-release-journey
          path: target/public-release-journey
          if-no-files-found: error

      - name: Verify the promoted channel in the packaged Windows client
        run: |
          node harness/utm-windows-post-publish-journey.mjs \
            --update-receipt target/windows-packaged-receipts/windows-update-journey/receipt.json \
            --public-receipt target/public-release-journey/receipt.json \
            --source-revision "$GITHUB_SHA" \
            --out target/windows-post-publish-journey

      - name: Upload packaged post-publish journey receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-post-publish-journey
          path: target/windows-post-publish-journey
          if-no-files-found: error

      - name: Commit the release after updater convergence
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              "target/public-channel-transaction/commit-receipt.json",
              JSON.stringify({
                schema_version: 1,
                receipt_type: "clark_code_public_channel_transaction",
                status: "committed",
                tag: process.env.CLARK_RELEASE_TAG,
                source_revision: process.env.GITHUB_SHA,
                run_id: process.env.GITHUB_RUN_ID,
                run_attempt: process.env.GITHUB_RUN_ATTEMPT,
                generated_at: new Date().toISOString(),
              }, null, 2) + "\n",
            );
          '

      - name: Restore the prior public channel after a failed release
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          set -euo pipefail

          transaction_dir="target/public-channel-transaction"
          if [ ! -f "$transaction_dir/backup-ready" ]; then
            echo "No completed mutable-channel snapshot exists; no channel write was authorized" >&2
            exit 1
          fi

          # A cancellation can race the final receipt write. Once the verified
          # public channel is committed, preserve it rather than rolling back.
          if [ -f "$transaction_dir/commit-receipt.json" ]; then
            echo "Public channel is already committed; preserving its verified generation"
            node -e '
              const fs = require("fs");
              fs.writeFileSync(
                "target/public-channel-transaction/rollback-receipt.json",
                JSON.stringify({
                  schema_version: 1,
                  receipt_type: "clark_code_public_channel_rollback",
                  status: "not_needed_channel_committed",
                  tag: process.env.CLARK_RELEASE_TAG,
                  source_revision: process.env.GITHUB_SHA,
                  generated_at: new Date().toISOString(),
                }, null, 2) + "\n",
              );
            '
            exit 0
          fi

          bucket="${CLARK_DESKTOP_DOWNLOAD_BUCKET}"
          backup_prefix="$(<"$transaction_dir/backup-prefix")"
          while IFS=$'\t' read -r disposition key; do
            case "$disposition" in
              present)
                aws s3api copy-object \
                  --bucket "$bucket" \
                  --copy-source "$bucket/$backup_prefix/$key" \
                  --key "desktop/latest/$key" \
                  --metadata-directive COPY \
                  >/dev/null
                aws s3api head-object \
                  --bucket "$bucket" \
                  --key "desktop/latest/$key" \
                  >"$transaction_dir/restored-$key.head.json"
                node -e '
                  const fs = require("fs");
                  const [expectedPath, actualPath, key] = process.argv.slice(1);
                  const expected = JSON.parse(fs.readFileSync(expectedPath, "utf8"));
                  const actual = JSON.parse(fs.readFileSync(actualPath, "utf8"));
                  for (const field of ["ContentLength", "ContentType", "CacheControl", "ETag"]) {
                    if (expected[field] !== actual[field]) {
                      throw new Error(`Restored ${key} changed ${field}`);
                    }
                  }
                  if (expected.ChecksumSHA256 &&
                      expected.ChecksumSHA256 !== actual.ChecksumSHA256) {
                    throw new Error(`Restored ${key} changed ChecksumSHA256`);
                  }
                  const metadata = (value) => JSON.stringify(
                    Object.fromEntries(Object.entries(value.Metadata || {}).sort()),
                  );
                  if (metadata(expected) !== metadata(actual)) {
                    throw new Error(`Restored ${key} changed metadata`);
                  }
                ' \
                  "$transaction_dir/backup-$key.head.json" \
                  "$transaction_dir/restored-$key.head.json" \
                  "$key"
                ;;
              absent)
                aws s3api delete-object \
                  --bucket "$bucket" \
                  --key "desktop/latest/$key" \
                  >/dev/null
                if aws s3api head-object \
                  --bucket "$bucket" \
                  --key "desktop/latest/$key" \
                  >/dev/null 2>&1; then
                  echo "Rollback expected desktop/latest/$key to be absent" >&2
                  exit 1
                fi
                ;;
              *)
                echo "Invalid rollback disposition for $key: $disposition" >&2
                exit 1
                ;;
            esac
          done < "$transaction_dir/prior-keys.tsv"

          if [ -n "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" \
              --paths "/desktop/latest/*" \
              >/dev/null
          fi
          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              "target/public-channel-transaction/rollback-receipt.json",
              JSON.stringify({
                schema_version: 1,
                receipt_type: "clark_code_public_channel_rollback",
                status: "passed",
                tag: process.env.CLARK_RELEASE_TAG,
                source_revision: process.env.GITHUB_SHA,
                objects_restored: 11,
                generated_at: new Date().toISOString(),
              }, null, 2) + "\n",
            );
          '
          echo "Restored the complete prior mutable desktop channel generation"

      - name: Delete rollback snapshot after committed release
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          transaction_dir="target/public-channel-transaction"
          [ -f "$transaction_dir/backup-ready" ]
          backup_prefix="$(<"$transaction_dir/backup-prefix")"
          case "$backup_prefix" in
            desktop/releases/"$CLARK_RELEASE_TAG"/_channel-rollback/"${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}") ;;
            *)
              echo "Refusing to delete unexpected rollback prefix: $backup_prefix" >&2
              exit 1
              ;;
          esac
          if aws s3 rm \
            "s3://${CLARK_DESKTOP_DOWNLOAD_BUCKET}/$backup_prefix/" \
            --recursive; then
            cleanup_status="deleted"
          else
            cleanup_status="retained"
            echo "::warning::Committed release rollback snapshot was retained for lifecycle cleanup"
          fi
          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              "target/public-channel-transaction/cleanup-receipt.json",
              JSON.stringify({
                schema_version: 1,
                receipt_type: "clark_code_public_channel_snapshot_cleanup",
                status: process.argv[1],
                tag: process.env.CLARK_RELEASE_TAG,
                source_revision: process.env.GITHUB_SHA,
                generated_at: new Date().toISOString(),
              }, null, 2) + "\n",
            );
          ' "$cleanup_status"

      - name: Upload public channel transaction receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-channel-transaction
          path: target/public-channel-transaction
          if-no-files-found: warn

  publish_cli:
    name: Publish standalone Clark TUI channel
    needs: [build, pre_release_benchmarks, native_host_benchmark, ui_resilience_benchmark, release_source_ci]
    if: >-
      ${{ always() && needs.release_source_ci.result == 'success' &&
          needs.pre_release_benchmarks.result == 'success' &&
          needs.native_host_benchmark.result == 'success' &&
          needs.ui_resilience_benchmark.result == 'success' &&
          (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: clark-cli-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download standalone CLI release records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: desktop-download-records-*
          path: cli-release-records
          merge-multiple: true

      - name: Build the source-bound CLI channel documents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/clark-cli-channel
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const root = "cli-release-records";
          const output = "target/clark-cli-channel";
          const records = fs.readdirSync(root)
            .filter((name) => name.startsWith("cli-") && name.endsWith(".json"))
            .sort()
            .map((name) => JSON.parse(fs.readFileSync(path.join(root, name), "utf8")));
          const byTarget = new Map();
          for (const record of records) {
            if (byTarget.has(record.target)) throw new Error(`duplicate CLI target ${record.target}`);
            if (!/^[0-9a-f]{64}$/.test(record.sha256)) throw new Error(`invalid CLI digest for ${record.target}`);
            if (!Number.isSafeInteger(record.size) || record.size <= 0) throw new Error(`invalid CLI size for ${record.target}`);
            if (path.basename(record.url) !== record.name) throw new Error(`CLI URL/name mismatch for ${record.target}`);
            byTarget.set(record.target, record);
          }
          for (const target of [
            "universal-apple-darwin",
            "x86_64-unknown-linux-gnu",
            "x86_64-pc-windows-msvc",
          ]) {
            if (!byTarget.has(target)) throw new Error(`required standalone CLI target is missing: ${target}`);
          }
          const version = process.env.CLARK_RELEASE_TAG.slice(1);
          const sorted = [...byTarget.values()].sort((left, right) => left.target.localeCompare(right.target));
          fs.writeFileSync(path.join(output, "VERSION"), `${version}\n`);
          fs.writeFileSync(
            path.join(output, "SHA256SUMS"),
            sorted.map((record) => `${record.sha256}  ${record.name}`).join("\n") + "\n",
          );
          fs.writeFileSync(
            path.join(output, "manifest.json"),
            JSON.stringify({
              schemaVersion: 1,
              version,
              tag: process.env.CLARK_RELEASE_TAG,
              sourceRevision: process.env.GITHUB_SHA,
              targets: Object.fromEntries(sorted.map((record) => [record.target, record])),
            }, null, 2) + "\n",
          );
          NODE
          cp scripts/install.sh target/clark-cli-channel/install.sh
          cp scripts/install.ps1 target/clark-cli-channel/install.ps1
          bash -n target/clark-cli-channel/install.sh

      - name: Configure AWS credentials for CLI publication
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.CLARK_DESKTOP_DOWNLOAD_UPLOAD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish the immutable release and atomic latest pointer
        shell: bash
        run: |
          set -euo pipefail
          bucket="$CLARK_DESKTOP_DOWNLOAD_BUCKET"
          tag="$CLARK_RELEASE_TAG"
          version="${tag#v}"
          channel="target/clark-cli-channel"

          sha256_file() { sha256sum "$1" | awk '{print $1}'; }
          put_immutable() {
            file="$1"
            key="$2"
            content_type="$3"
            sha="$(sha256_file "$file")"
            size="$(wc -c < "$file" | tr -d '[:space:]')"
            head="$(mktemp)"
            error="$(mktemp)"
            if aws s3api head-object --bucket "$bucket" --key "$key" >"$head" 2>"$error"; then
              node -e '
                const fs = require("fs");
                const [file, sha, size, revision] = process.argv.slice(1);
                const head = JSON.parse(fs.readFileSync(file, "utf8"));
                if (head.ContentLength !== Number(size) || head.Metadata?.sha256 !== sha ||
                    head.Metadata?.["source-revision"] !== revision) {
                  throw new Error("immutable Clark CLI metadata collision");
                }
              ' "$head" "$sha" "$size" "$GITHUB_SHA"
              return
            fi
            if ! grep -Eq '(^|[^0-9])404([^0-9]|$)|Not Found|NoSuchKey' "$error"; then
              cat "$error" >&2
              exit 1
            fi
            aws s3api put-object \
              --bucket "$bucket" \
              --key "$key" \
              --body "$file" \
              --if-none-match '*' \
              --content-type "$content_type" \
              --cache-control 'public, max-age=31536000, immutable' \
              --metadata "sha256=$sha,clark-version=$tag,source-revision=$GITHUB_SHA" \
              >/dev/null
          }

          put_immutable "$channel/VERSION" "desktop/cli/releases/$tag/VERSION" text/plain
          put_immutable "$channel/SHA256SUMS" "desktop/cli/releases/$tag/SHA256SUMS" text/plain
          put_immutable "$channel/manifest.json" "desktop/cli/releases/$tag/manifest.json" application/json

          current="$(mktemp)"
          current_error="$(mktemp)"
          if aws s3api get-object --bucket "$bucket" --key desktop/cli/latest/VERSION "$current" \
            >/dev/null 2>"$current_error"; then
            node -e '
              const fs = require("fs");
              const [file, incoming] = process.argv.slice(1);
              const current = fs.readFileSync(file, "utf8").trim();
              const numbers = (value) => value.split(".").map(Number);
              const left = numbers(current);
              const right = numbers(incoming);
              for (let i = 0; i < 3; i += 1) {
                if (left[i] > right[i]) throw new Error(`refusing CLI channel rollback ${current} -> ${incoming}`);
                if (left[i] < right[i]) break;
              }
            ' "$current" "$version"
          elif ! grep -Eq '(^|[^0-9])404([^0-9]|$)|Not Found|NoSuchKey' "$current_error"; then
            cat "$current_error" >&2
            exit 1
          fi

          publish_mutable() {
            file="$1"
            key="$2"
            content_type="$3"
            sha="$(sha256_file "$file")"
            aws s3 cp "$file" "s3://$bucket/$key" \
              --content-type "$content_type" \
              --cache-control 'no-store, no-cache, must-revalidate, max-age=0' \
              --metadata "sha256=$sha,clark-version=$tag,source-revision=$GITHUB_SHA"
          }
          publish_mutable "$channel/SHA256SUMS" desktop/cli/latest/SHA256SUMS text/plain
          publish_mutable "$channel/manifest.json" desktop/cli/latest/manifest.json application/json
          publish_mutable "$channel/install.sh" desktop/cli/install.sh text/x-shellscript
          publish_mutable "$channel/install.ps1" desktop/cli/install.ps1 text/plain
          publish_mutable "$channel/install.sh" desktop/cli/latest/install.sh text/x-shellscript
          publish_mutable "$channel/install.ps1" desktop/cli/latest/install.ps1 text/plain
          publish_mutable "$channel/VERSION" desktop/cli/latest/VERSION text/plain

          if [ -n "${CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CLARK_DESKTOP_DOWNLOAD_DISTRIBUTION_ID" \
              --paths '/desktop/cli/*' \
              >/dev/null
          fi

      - name: Verify the public CLI and human install command
        shell: bash
        run: |
          set -euo pipefail
          channel="target/clark-cli-channel"
          base="${CLARK_DESKTOP_DOWNLOAD_BASE_URL%/}/cli"
          expected_version="${CLARK_RELEASE_TAG#v}"
          confirmations=0
          for _attempt in $(seq 1 24); do
            if [ "$(curl -fsSL "$base/latest/VERSION" | tr -d '[:space:]')" = "$expected_version" ] && \
               cmp -s "$channel/SHA256SUMS" <(curl -fsSL "$base/latest/SHA256SUMS") && \
               cmp -s "$channel/install.sh" <(curl -fsSL https://www.clarkchat.com/install.sh) && \
               cmp -s "$channel/install.ps1" <(curl -fsSL https://www.clarkchat.com/install.ps1); then
              while read -r _sha name; do
                curl -fsSI "$base/releases/$CLARK_RELEASE_TAG/$name" >/dev/null
              done < "$channel/SHA256SUMS"
              confirmations=$((confirmations + 1))
              if [ "$confirmations" -ge 2 ]; then
                break
              fi
            else
              confirmations=0
            fi
            sleep 5
          done
          if [ "$confirmations" -lt 2 ]; then
            echo "Public Clark CLI channel or clarkchat.com installer route did not converge" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            fs.writeFileSync("target/clark-cli-channel/publication-receipt.json", JSON.stringify({
              schemaVersion: 1,
              status: "published",
              version: process.env.CLARK_RELEASE_TAG.slice(1),
              sourceRevision: process.env.GITHUB_SHA,
              installCommand: "curl -fsSL https://www.clarkchat.com/install.sh | sh",
              verifiedAt: new Date().toISOString(),
            }, null, 2) + "\n");
          '

      - name: Upload standalone CLI publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clark-cli-publication
          path: target/clark-cli-channel
          if-no-files-found: error

  finalize_release_tag:
    name: Finalize stable release tag
    if: >-
      ${{ always() &&
          needs.publish_cli.result == 'success' &&
          (needs.publish_independent_platforms.result == 'success' ||
           needs.publish.result == 'success') }}
    needs: [publish_independent_platforms, publish, publish_cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reverify public generation and create the stable tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Main advanced after candidate validation; refusing to tag stale source" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$CLARK_RELEASE_TAG"; then
            echo "Stable tag already exists: $CLARK_RELEASE_TAG" >&2
            exit 1
          fi
          manifest="$(curl -fsSL "$CLARK_DESKTOP_DOWNLOAD_BASE_URL/latest/manifest.json")"
          legacy="$(curl -fsSL "$CLARK_DESKTOP_DOWNLOAD_BASE_URL/latest/latest.json")"
          expected_version="${CLARK_RELEASE_TAG#v}"
          for document in "$manifest" "$legacy"; do
            test "$(jq -r '.version' <<<"$document")" = "$expected_version"
            test "$(jq -r '.source_revision' <<<"$document")" = "$GITHUB_SHA"
          done
          test "$(jq -r '.tag_name' <<<"$manifest")" = "$CLARK_RELEASE_TAG"
          for asset in \
            ClarkCode.dmg \
            ClarkCode_x64-setup.exe \
            ClarkCode_amd64.AppImage \
            ClarkCode_amd64.deb \
            ClarkCode_x86_64.rpm; do
            jq -e --arg asset "$asset" \
              'any(.assets[]; .name == $asset)' <<<"$manifest" >/dev/null
          done
          for target in \
            darwin-aarch64 \
            darwin-x86_64 \
            linux-x86_64 \
            windows-x86_64; do
            jq -e --arg target "$target" \
              '.platforms[$target].url and .platforms[$target].signature' \
              <<<"$legacy" >/dev/null
          done

          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "$CLARK_RELEASE_TAG" "$GITHUB_SHA" \
            -m "Clark Code $CLARK_RELEASE_TAG"
          git push origin "refs/tags/$CLARK_RELEASE_TAG"
          {
            echo "## Stable release finalized"
            echo
            echo "- Tag: \`$CLARK_RELEASE_TAG\`"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Current and legacy manifests were verified before the tag was created."
          } >> "$GITHUB_STEP_SUMMARY"

  windows_release_vm_cleanup:
    name: Delete disposable Windows release VM
    # Unsigned Windows releases never create the disposable UTM clone. Keeping
    # this job off the self-hosted queue also lets a cancelled unsigned release
    # relinquish the global release concurrency lock immediately.
    if: >-
      ${{ always() &&
          vars.CLARK_WINDOWS_RELEASE_MODE == 'signed' &&
          needs.windows_packaged_journey.result != 'skipped' }}
    needs: [windows_packaged_journey, publish]
    runs-on: [self-hosted, macOS, ARM64, clark-utm-qa]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Stop and delete only this release run's clone
        run: |
          node harness/utm-windows-release-vm.mjs \
            --action delete-clone \
            --clone "$CLARK_WINDOWS_QA_VM_NAME"

  # Every desktop package carries the same verified static Linux workers. Build
  # both once, then fan the exact bytes out to every native package instead of
  # cross-compiling the Scientist remote worker independently on three runners.
  remote-code-worker:
    name: Shared remote Linux coding workers
    needs: [release_source_prerequisites]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout exact Clark Scientist worker source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: clark-labs-inc/clark-scientist
          ref: ${{ env.CLARK_SCIENTIST_RELEASE_REF }}
          path: vendor/clark-scientist
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout exact Clark Autoresearch dependency source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: clark-labs-inc/clark-autoresearch
          ref: ${{ env.CLARK_AUTORESEARCH_RELEASE_REF }}
          path: vendor/clark-autoresearch
          token: ${{ secrets.CLARK_SCIENTIST_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind Clark Scientist to this exact Clark Code source
        run: |
          test "$(git -C vendor/clark-scientist rev-parse HEAD)" = "$CLARK_SCIENTIST_RELEASE_REF"
          test "$(git -C vendor/clark-autoresearch rev-parse HEAD)" = "$CLARK_AUTORESEARCH_RELEASE_REF"
          ln -s "$GITHUB_WORKSPACE" vendor/clark-desktop
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
      - name: Refresh Clark Scientist lock for the exact Desktop source
        run: |
          bash scripts/refresh-scientist-lock.sh \
            --source "$GITHUB_WORKSPACE/vendor/clark-scientist" \
            --autoresearch-source "$GITHUB_WORKSPACE/vendor/clark-autoresearch"
      # setup-zig v2.2.1 still declares the retired Node 20 action runtime.
      # Install the same exact compiler directly from Zig's official archive so
      # successful release jobs do not carry a deprecation annotation.
      - name: Install exact Zig toolchain
        shell: bash
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-$ZIG_VERSION.tar.xz"
          install_dir="$RUNNER_TEMP/zig-$ZIG_VERSION"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused \
            --location --fail --silent --show-error \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xJf "$archive" --strip-components=1 -C "$install_dir"
          test "$("$install_dir/zig" version)" = "$ZIG_VERSION"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: |
          cargo install cargo-zigbuild --locked
      - name: Build shared remote Linux coding workers
        run: |
          ./scripts/stage-code-worker.sh --target x86_64-unknown-linux-musl
          ./scripts/stage-scientist-worker.sh \
            --source "$GITHUB_WORKSPACE/vendor/clark-scientist" \
            --autoresearch-source "$GITHUB_WORKSPACE/vendor/clark-autoresearch" \
            --target x86_64-unknown-linux-musl \
            --profile release
      - name: Upload shared remote Linux coding workers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remote-code-workers-linux-x86_64
          path: |
            src-tauri/binaries/clark-code-worker-x86_64-unknown-linux-musl
            src-tauri/binaries/clark-code-headless-x86_64-unknown-linux-musl
          if-no-files-found: error
          retention-days: 1

# The public download page lives in clark-ui (clarkchat.com/download) and
# resolves public CDN assets via https://downloads.clarkchat.com/desktop/latest/manifest.json.
