name: Sandbox Conformance

env:
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/exec-core/**"
      - "crates/exec-sandbox/**"
      - "crates/exec-sandbox-protocol/**"
      - "crates/exec-sandbox-windows/**"
      - "crates/install-context/**"
      - "scripts/bundled-tools.json"
      - "scripts/stage-bundled-tools.py"
      - "src-tauri/tauri.sandbox.macos.conf.json"
      - "src-tauri/tauri.sandbox.linux.conf.json"
      - "src-tauri/tauri.sandbox.windows.conf.json"
      - ".github/workflows/sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-unix:
    name: Native containment (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-targets: false
      - name: Set up pinned kache
        uses: kunobi-ninja/kache-action@49398d37113c616fdb61be434cb497e3c2c8f3e6 # v1
        with:
          version: 0.14.2
          cache-key-prefix: clark-code-sandbox-${{ matrix.os }}
      - name: Install exact prebuilt cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Build verified release bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap meson ninja-build pkg-config libcap-dev
          python3 scripts/stage-bundled-tools.py --target x86_64-unknown-linux-gnu
          src-tauri/binaries/bwrap-x86_64-unknown-linux-gnu --version
          echo "DESKTOP_BWRAP_PATH=$GITHUB_WORKSPACE/src-tauri/binaries/bwrap-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - name: Run required native adversarial suite
        env:
          DESKTOP_SANDBOX_E2E_REQUIRED: "1"
        run: cargo nextest run -p exec-core -p exec-sandbox-protocol -p exec-sandbox -p desktop-install-context --no-fail-fast
      - name: Capture native benchmark
        run: cargo run -p exec-sandbox --example sandbox_benchmark -- --iterations 5000 --launch-iterations 30

  windows-contract:
    name: Windows protocol and helper boundary
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install exact prebuilt cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo nextest run -p exec-sandbox-protocol -p exec-sandbox-windows -p exec-sandbox --no-fail-fast
      - run: cargo build -p exec-sandbox-windows --release --bins
      - name: Verify clean-machine runtime boundary
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }
          foreach ($helper in @(
            "target/release/agent-command-runner.exe",
            "target/release/agent-windows-sandbox-setup.exe"
          )) {
            $imports = (& $dumpbin.FullName /dependents $helper | Out-String)
            if ($imports -match '(?im)^\s*(?:vcruntime|msvcp)[^\s]*\.dll\s*$') {
              throw "Clean-machine runtime invariant failed for ${helper}:`n$imports"
            }
          }
      - run: target/release/agent-command-runner.exe --self-test
      - run: target/release/agent-windows-sandbox-setup.exe --self-test
      - name: Run required native Windows adversarial suite
        shell: pwsh
        run: |
          $env:DESKTOP_WINDOWS_SANDBOX_E2E_REQUIRED = "1"
          $env:DESKTOP_WINDOWS_SANDBOX_RUNNER = (Resolve-Path "target/release/agent-command-runner.exe")
          $env:DESKTOP_WINDOWS_SANDBOX_SETUP = (Resolve-Path "target/release/agent-windows-sandbox-setup.exe")
          cargo nextest run -p exec-sandbox-windows --release --test windows_native --no-capture
          $env:DESKTOP_SANDBOX_E2E_REQUIRED = "1"
          $env:DESKTOP_WINDOWS_SANDBOX_EXPERIMENTAL = "1"
          cargo nextest run -p exec-sandbox --release --test sandbox_e2e --no-capture
