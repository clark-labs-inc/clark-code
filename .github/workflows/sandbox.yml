name: Sandbox Conformance

env:
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/exec-core/**"
      - "crates/exec-sandbox/**"
      - "crates/exec-sandbox-protocol/**"
      - "crates/exec-sandbox-windows/**"
      - "crates/install-context/**"
      - "scripts/bundled-tools.json"
      - "scripts/stage-bundled-tools.py"
      - "scripts/verify-bundled-layout.py"
      - "src-tauri/tauri.sandbox.macos.conf.json"
      - "src-tauri/tauri.sandbox.linux.conf.json"
      - "src-tauri/tauri.sandbox.windows.conf.json"
      - ".github/workflows/sandbox.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  native-unix:
    name: Native containment (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Build verified release bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap meson ninja-build pkg-config libcap-dev
          python3 scripts/stage-bundled-tools.py --target x86_64-unknown-linux-gnu
          src-tauri/binaries/bwrap-x86_64-unknown-linux-gnu --version
          echo "CLARK_BWRAP_PATH=$GITHUB_WORKSPACE/src-tauri/binaries/bwrap-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - name: Run required native adversarial suite
        env:
          CLARK_SANDBOX_E2E_REQUIRED: "1"
        run: cargo test -p exec-core -p exec-sandbox-protocol -p exec-sandbox -p clark-install-context --no-fail-fast
      - name: Capture native benchmark
        run: cargo run -p exec-sandbox --example sandbox_benchmark -- --iterations 5000 --launch-iterations 30

  windows-contract:
    name: Windows protocol and helper boundary
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo test -p exec-sandbox-protocol -p exec-sandbox-windows -p exec-sandbox --no-fail-fast
      - run: cargo build -p exec-sandbox-windows --release --bins
      - name: Verify clean-machine runtime boundary
        shell: pwsh
        run: |
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop
          foreach ($helper in @(
            "target/release/clark-command-runner.exe",
            "target/release/clark-windows-sandbox-setup.exe"
          )) {
            $imports = (& $dumpbin.Source /dependents $helper | Out-String)
            if ($imports -match '(?im)^\s*(?:vcruntime|msvcp)[^\s]*\.dll\s*$') {
              throw "Clean-machine runtime invariant failed for ${helper}:`n$imports"
            }
          }
      - run: target/release/clark-command-runner.exe --self-test
      - run: target/release/clark-windows-sandbox-setup.exe --self-test
      - name: Run required native Windows adversarial suite
        shell: pwsh
        run: |
          $env:CLARK_WINDOWS_SANDBOX_E2E_REQUIRED = "1"
          $env:CLARK_WINDOWS_SANDBOX_RUNNER = (Resolve-Path "target/release/clark-command-runner.exe")
          $env:CLARK_WINDOWS_SANDBOX_SETUP = (Resolve-Path "target/release/clark-windows-sandbox-setup.exe")
          cargo test -p exec-sandbox-windows --release --test windows_native -- --nocapture
          $env:CLARK_SANDBOX_E2E_REQUIRED = "1"
          $env:CLARK_WINDOWS_SANDBOX_EXPERIMENTAL = "1"
          cargo test -p exec-sandbox --release --test sandbox_e2e -- --nocapture
