name: OIDC check
# Temporary: prove the GitHub Actions OIDC provider can assume the downloads
# upload role. Manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  assume:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::293723385520:role/clark-desktop-downloads-prod-upload
          aws-region: us-west-2
      - name: Who am I
        run: aws sts get-caller-identity
