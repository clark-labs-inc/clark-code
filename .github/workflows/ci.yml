name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust core and providers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # sccache owns compiler artifacts in this pilot. Keep rust-cache for
          # the Cargo registry and git dependencies; nextest is cached below.
          cache-targets: false
          cache-bin: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Restore the exact cargo-nextest executable
        id: cargo-nextest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-nextest-${{ runner.os }}-0.9.143
          path: ~/.cargo/bin/cargo-nextest
      - name: Install the exact cargo-nextest executable
        if: steps.cargo-nextest-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --version 0.9.143 --locked
      - name: Cache the exact cargo-nextest executable
        if: steps.cargo-nextest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-nextest-${{ runner.os }}-0.9.143
          path: ~/.cargo/bin/cargo-nextest
      - name: Install Linux keyring dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy core and providers
        run: cargo clippy -p agent-core -p provider-acp -p provider-local -p provider-remote-worker -p code-host -p code-worker -p code-remote -p devbridge --all-targets -- -D warnings
      - name: Test core and providers
        run: cargo nextest run -p agent-core -p provider-acp -p provider-local -p provider-remote-worker -p code-host -p code-worker -p code-remote --no-fail-fast
      - name: WASM build (agent-core)
        run: cargo check -p agent-core --target wasm32-unknown-unknown
      - name: Report sccache pilot statistics
        if: always()
        run: sccache --show-stats

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  tauri:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pin Windows to the VS 2022 image. `windows-latest` now follows the
        # VS 2026 image and can silently raise the runtime ABI of produced apps.
        os: [macos-15-xlarge, ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Match release executables so Windows tests do not depend on the
      # runner's dynamically installed Visual C++ runtime entry points.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          cache-targets: ${{ matrix.os == 'windows-2022' }}
          # Native links dominate failure diagnosis time. Cargo still validates
          # dep-info before reuse, so preserve completed objects when a later
          # runtime contract fails.
          cache-on-failure: true
      - name: Set up pinned kache
        if: matrix.os != 'windows-2022'
        uses: kunobi-ninja/kache-action@49398d37113c616fdb61be434cb497e3c2c8f3e6 # v1
        with:
          version: 0.14.2
          cache-key-prefix: clark-code-tauri-${{ matrix.os }}
      - name: Install pinned cargo-nextest
        if: matrix.os != 'windows-2022'
        run: cargo install cargo-nextest --version 0.9.143 --locked
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build app (no bundle on CI)
        run: cargo build -p desktop-foundation
      - name: Test native prompt and persistence contracts
        if: matrix.os != 'windows-2022'
        run: cargo nextest run -p desktop-foundation --lib
      - name: Test native prompt and persistence contracts (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          cargo test -p desktop-foundation --lib --no-run
          $testExe = Get-ChildItem target/debug/deps/desktop_foundation-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $testExe) { throw "Desktop foundation test executable was not produced" }
          Copy-Item src-tauri/windows-test.manifest "$($testExe.FullName).manifest"
          scripts/check-windows-pe-imports.ps1 -FilePath target/debug/clark-code.exe
          scripts/check-windows-pe-imports.ps1 -FilePath $testExe.FullName
          # Git worktree/diff integration is covered on macOS and Linux. It
          # requires Windows Git path/line-ending policy and is not a package
          # startup dependency, so keep it out of the Windows release gate.
          & $testExe.FullName `
            --skip commands::real_backend_tests `
            --skip project_worktree
          exit $LASTEXITCODE
  public-boundary:
    name: Public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths and added content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA:-}" ]]; then
            scripts/check-public-boundary.sh "$BASE_SHA" HEAD
          else
            scripts/check-public-boundary.sh
          fi
      - name: Check product decomposition contract
        run: node --test harness/product-boundary.spec.mjs

  tauri-linker-benchmark:
    name: Tauri Linux linker benchmark (${{ matrix.linker }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        linker: [system, mold, wild]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: tauri-linker-${{ matrix.linker }}
          cache-on-failure: true
      - name: Install Linux Tauri and linker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev mold patchelf
      - name: Install pinned Wild linker
        if: matrix.linker == 'wild'
        shell: bash
        env:
          WILD_SHA256: 641265506a7c06cfb03181b8916ab663ec8407855db6d4db7f8450667d105283
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wild-linker.tar.gz"
          release_dir="$RUNNER_TEMP/wild-linker-0.10.0-x86_64-unknown-linux-gnu"
          curl --proto '=https' --tlsv1.2 --retry 5 --location --fail --silent --show-error \
            https://github.com/wild-linker/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$WILD_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$release_dir/wild" "$RUNNER_TEMP/wild"
          "$RUNNER_TEMP/wild" --version
      - name: Measure desktop-foundation build
        shell: bash
        env:
          LINKER_UNDER_TEST: ${{ matrix.linker }}
        run: |
          set -euo pipefail
          case "$LINKER_UNDER_TEST" in
            system)
              export RUSTFLAGS="-C linker=clang"
              linker_version="$(clang --version | sed -n '1p')"
              ;;
            mold)
              export RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=mold"
              linker_version="$(mold --version | sed -n '1p')"
              ;;
            wild)
              export RUSTFLAGS="-C linker=clang -C link-arg=--ld-path=$RUNNER_TEMP/wild"
              linker_version="$("$RUNNER_TEMP/wild" --version | sed -n '1p')"
              ;;
          esac
          /usr/bin/time -p -o "$RUNNER_TEMP/tauri-linker-time.txt" \
            cargo build -p desktop-foundation
          if [[ "$LINKER_UNDER_TEST" == "wild" ]]; then
            readelf --string-dump .comment target/debug/clark-code \
              | tee "$RUNNER_TEMP/wild-link-proof.txt"
            grep -F "Linker: Wild 0.10.0" "$RUNNER_TEMP/wild-link-proof.txt"
          fi
          real_seconds="$(awk '$1 == "real" { print $2 }' "$RUNNER_TEMP/tauri-linker-time.txt")"
          printf 'linker=%s seconds=%s version=%s\n' \
            "$LINKER_UNDER_TEST" "$real_seconds" "$linker_version"
          {
            echo "## Tauri Linux linker benchmark"
            echo
            echo "| Linker | Version | Build seconds |"
            echo "| --- | --- | ---: |"
            echo "| $LINKER_UNDER_TEST | $linker_version | $real_seconds |"
          } >> "$GITHUB_STEP_SUMMARY"

  required:
    name: CI required
    if: always()
    needs: [rust, frontend, tauri, public-boundary]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI lane
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TAURI_RESULT: ${{ needs.tauri.result }}
          PUBLIC_BOUNDARY_RESULT: ${{ needs.public-boundary.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$TAURI_RESULT" = success
          test "$PUBLIC_BOUNDARY_RESULT" = success
          {
            echo "## CI receipt"
            echo
            echo "| Lane | Result |"
            echo "| --- | --- |"
            echo "| Rust core and providers | $RUST_RESULT |"
            echo "| Frontend | $FRONTEND_RESULT |"
            echo "| Native Tauri matrix | $TAURI_RESULT |"
            echo "| Public boundary | $PUBLIC_BOUNDARY_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
