<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F7F5F1" />
    <script>
      /* Apply persisted appearance and reading scale before the stylesheet's
         first paint. React reconciles this state later; doing it here avoids a
         light frame or a text-size jump in a native window. */
      (() => {
        try {
          const root = document.documentElement;
          const dark = localStorage.getItem("clark.theme") === "dark";
          const colorblind = localStorage.getItem("clark.colorblind") === "1";
          const savedTextSize = localStorage.getItem("clark.text-size");
          const textSize = savedTextSize === "large"
            ? 110
            : /^(100|110|125|150|175|200)$/.test(savedTextSize ?? "")
              ? Number(savedTextSize)
              : 100;
          root.classList.toggle("dark", dark);
          root.classList.toggle("colorblind", colorblind);
          root.dataset.textSize = String(textSize);
          root.style.setProperty("--text-size-scale", String(textSize / 100));
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            "content",
            dark ? "#0D0D0D" : "#F7F5F1",
          );
        } catch {
          // Storage can be unavailable in a restricted webview; light is the
          // deterministic fallback declared by the document.
        }
      })();
    </script>
    <title>Clark Code</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Ctext x='16' y='23' font-family='Inter,system-ui,sans-serif' font-size='21' font-weight='700' fill='%23ededec' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='21' font-weight='700' fill='%23ededec' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root">
      <div class="clark-bootstrap-shell" data-clark-bootstrap-shell="true" aria-label="Loading Clark Code">
        <span class="clark-bootstrap-mark" aria-hidden="true">c</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
