[workspace]
resolver = "2"
members = ["computer-use"]

[workspace.package]
version = "0.1.91"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
